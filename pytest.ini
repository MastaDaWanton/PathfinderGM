[pytest]
python_files = test_*.py
testpaths = tests
# -p no:django: tests/conftest.py configures Django itself, on purpose (see its
# docstring); pytest-django was auto-loading anyway as a second setup path.
addopts = -q -p no:django
markers =
    live_model: the test may reach a real model; every other test has gm.client.chat stubbed to ModelUnavailable
filterwarnings =
    ignore::DeprecationWarning
