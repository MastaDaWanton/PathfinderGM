<!-- The game's theme, the real file: textures and fonts resolve from play/static. -->

<style>
  /* The harness's one stand-in, for the table's stage (table.html .stage, not copied):
     the stage's padding round the board, and the board's row filling the frame. Its
     class outranks the variant's plain `body` rule, which loads after it. */
  body.polish-stage {
    grid-template-rows: minmax(0, 1fr); padding: 20px 20px 16px; box-sizing: border-box;
  }
  #polish-error { color: #e0261e; font: 14px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
</style>
