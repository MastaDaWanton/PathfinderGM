{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathfinder GM — Pangrella</title>
<style>
  :root {
    --bg: #14120f; --panel: #1c1a16; --edge: #322d24; --ink: #e8e2d6;
    --dim: #9a917f; --accent: #c8a24a; --player: #7fa8c8; --alarm: #c86a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 Georgia, "Iowan Old Style", serif;
    display: grid; grid-template-columns: 1fr 340px; height: 100vh;
  }
  main { display: flex; flex-direction: column; min-width: 0; }
  #story { flex: 1; overflow-y: auto; padding: 32px 40px; }
  .beat { margin: 0 0 20px; max-width: 62ch; white-space: pre-wrap; }
  .beat.player { color: var(--player); font-style: italic; }
  .beat.player::before { content: "› "; opacity: .6; }
  .beat.consequence { color: var(--ink); }
  .beat.setup { color: #d8d2c6; }
  footer { border-top: 1px solid var(--edge); padding: 16px 40px 24px; }
  form { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--edge); color: var(--ink);
    padding: 12px 14px; font: inherit; border-radius: 3px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); border: 0; color: #1a1610; padding: 12px 20px;
    font: 600 15px/1 system-ui, sans-serif; border-radius: 3px; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--edge); }

  aside {
    background: var(--panel); border-left: 1px solid var(--edge);
    overflow-y: auto; padding: 20px; font: 14px/1.5 system-ui, sans-serif;
  }
  aside h2 {
    font: 600 11px/1 system-ui, sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); margin: 22px 0 10px;
  }
  aside h2:first-child { margin-top: 0; }
  .name { font: 600 17px/1.2 Georgia, serif; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .bar { height: 6px; background: #2a2620; border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cell { background: #232019; border-radius: 3px; padding: 6px 8px; }
  .cell b { display: block; font: 600 10px/1 system-ui; color: var(--dim);
            letter-spacing: .1em; text-transform: uppercase; }
  .cell span { font: 600 15px/1.4 Georgia, serif; }
  .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .row span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
  .who { display: flex; justify-content: space-between; padding: 5px 0;
         border-bottom: 1px solid #262218; }
  .who small { color: var(--dim); }

  #veil {
    position: fixed; inset: 0; background: rgba(8,7,5,.82);
    display: none; place-items: center; z-index: 20;
  }
  #veil.on { display: grid; }
  .popup {
    background: var(--panel); border: 1px solid var(--accent); border-radius: 6px;
    padding: 26px 28px; width: 400px; font: 15px/1.5 system-ui, sans-serif;
  }
  .popup h3 { margin: 0 0 4px; font: 600 20px/1.2 Georgia, serif; color: var(--accent); }
  .popup .because { color: var(--dim); font-style: italic; margin-bottom: 16px; }
  .terms { background: #232019; border-radius: 4px; padding: 10px 12px; margin: 12px 0; }
  .terms .row { font-size: 13px; }
  .terms .row.total { border-top: 1px solid #383225; margin-top: 6px; padding-top: 6px;
                      font-weight: 600; }
  .dieface {
    width: 100%; background: #14120f; border: 1px solid var(--edge); color: var(--ink);
    font: 600 34px/1 Georgia, serif; text-align: center; padding: 14px; border-radius: 4px;
    margin-bottom: 12px;
  }
  .popup .acts { display: flex; gap: 8px; }
  .popup .acts button { flex: 1; }
  /* --- The full character sheet ------------------------------------------------
     Unfolds from the sidebar across the whole window. The sidebar quick reference
     stays as it was; this is the paper sheet, with the Folio's own section names as
     tabs. */
  #sheetpanel {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: none; grid-template-rows: auto auto 1fr;
    transform: translateX(3%); opacity: 0;
    transition: transform .18s ease-out, opacity .18s ease-out;
  }
  #sheetpanel.on { display: grid; transform: none; opacity: 1; }
  .sheethead {
    display: flex; align-items: baseline; gap: 16px;
    padding: 22px 40px 14px; border-bottom: 1px solid var(--edge);
  }
  .sheethead h1 { margin: 0; font: 600 30px/1.1 Georgia, serif; }
  .sheethead .meta { color: var(--dim); font: 15px/1.4 system-ui, sans-serif; }
  .sheethead .close {
    margin-left: auto; background: transparent; border: 1px solid var(--edge);
    color: var(--dim); padding: 8px 16px; border-radius: 3px; cursor: pointer;
    font: 600 13px/1 system-ui, sans-serif;
  }
  .sheethead .close:hover { color: var(--ink); border-color: var(--accent); }
  .tabs {
    display: flex; gap: 2px; padding: 0 40px; border-bottom: 1px solid var(--edge);
    overflow-x: auto;
  }
  .tabs button {
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--dim); padding: 12px 18px; cursor: pointer; white-space: nowrap;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .1em;
    text-transform: uppercase; border-radius: 0;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .sheetbody { overflow-y: auto; padding: 26px 40px 60px; }
  .cols {
    display: grid; gap: 26px;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    align-items: start;
  }
  .card {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 5px;
    padding: 16px 18px;
  }
  .card > h3 {
    margin: 0 0 12px; font: 600 11px/1 system-ui, sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim);
  }
  .bignum { font: 600 34px/1 Georgia, serif; color: var(--accent); }
  .bignum small { font: 400 13px/1 system-ui, sans-serif; color: var(--dim); }
  .terms { margin-top: 8px; }
  .terms .t {
    display: flex; justify-content: space-between; padding: 3px 0;
    font: 13px/1.4 system-ui, sans-serif; color: var(--dim);
    border-bottom: 1px dotted #2a2620;
  }
  .terms .t b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
  table.sheet { width: 100%; border-collapse: collapse; font: 14px/1.5 system-ui, sans-serif; }
  table.sheet th {
    text-align: left; font: 600 11px/1 system-ui, sans-serif; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); padding: 8px 10px;
    border-bottom: 1px solid var(--edge);
  }
  table.sheet td { padding: 7px 10px; border-bottom: 1px solid #232019; vertical-align: top; }
  table.sheet td.num { text-align: right; font-variant-numeric: tabular-nums;
                       color: var(--accent); font-weight: 600; white-space: nowrap; }
  table.sheet tr.dim td { color: var(--dim); }
  .why { color: var(--dim); font-size: 12px; }
  .pill {
    display: inline-block; background: #232019; border-radius: 10px; padding: 1px 8px;
    font: 600 10px/1.6 system-ui, sans-serif; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim);
  }
  .pill.warn { color: var(--alarm); }
  .pill.good { color: var(--accent); }
  .empty { color: var(--dim); font-style: italic; }
  /* --- Body slots -------------------------------------------------------------- */
  .bodylayout {
    display: grid; grid-template-columns: minmax(210px, 1fr) minmax(180px, 300px) minmax(210px, 1fr);
    gap: 22px; align-items: start;
  }
  .slotcol { display: flex; flex-direction: column; gap: 10px; }
  .figure { position: sticky; top: 0; text-align: center; color: var(--edge); }
  .figure svg { width: 100%; max-width: 260px; height: auto; color: #4a4335; }
  .figcap { color: var(--dim); font: 13px/1.4 system-ui, sans-serif; margin-top: 6px; }
  .slot {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 4px;
    padding: 8px 10px 9px;
  }
  .slothead {
    display: flex; align-items: center; justify-content: space-between;
    font: 600 10px/1 system-ui, sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 6px;
  }
  .slothead button {
    background: transparent; border: 1px solid var(--edge); color: var(--dim);
    width: 20px; height: 20px; line-height: 1; border-radius: 3px; padding: 0;
    cursor: pointer; font: 600 14px/1 system-ui, sans-serif;
  }
  .slothead button:hover { color: var(--accent); border-color: var(--accent); }
  .slotrow { display: flex; gap: 5px; margin-bottom: 4px; }
  .slotinput {
    flex: 1; min-width: 0; background: #14120f; border: 1px solid var(--edge);
    color: var(--ink); border-radius: 3px; padding: 6px 8px;
    font: 14px/1.3 Georgia, serif;
  }
  .slotinput:focus { outline: none; border-color: var(--accent); }
  .slotinput:disabled { color: var(--dim); font-style: italic; background: #191710; }
  .slotinput::placeholder { color: #5c5545; font-style: italic; }
  .slotrow.isempty .slotinput { border-style: dashed; }
  .slotrow.beyond .slotinput { border-left: 3px solid var(--alarm); }
  .slotrow .delslot {
    background: transparent; border: 1px solid var(--edge); color: var(--dim);
    width: 24px; border-radius: 3px; cursor: pointer; padding: 0;
    font: 14px/1 system-ui, sans-serif;
  }
  .slotrow .delslot:hover { color: var(--alarm); border-color: var(--alarm); }
  .slotholds {
    color: var(--dim); font: 11px/1.35 system-ui, sans-serif; margin-top: 4px;
  }
  @media (max-width: 900px) {
    .bodylayout { grid-template-columns: 1fr 1fr; }
    .figure { display: none; }
  }

  .opensheet {
    width: 100%; margin-top: 14px; background: transparent; color: var(--accent);
    border: 1px solid var(--edge); padding: 10px; border-radius: 3px; cursor: pointer;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .08em;
    text-transform: uppercase;
  }
  .opensheet:hover { border-color: var(--accent); }

  #busy { color: var(--dim); font-style: italic; padding: 0 40px 12px; display: none; }
  #busy.on { display: block; }
  #err { color: var(--alarm); padding: 0 40px 12px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  pre { font: 11px/1.4 ui-monospace, monospace; color: var(--dim); overflow-x: auto;
        background: #14120f; padding: 8px; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <div id="story"></div>
  <div id="busy">the GM is thinking…</div>
  <div id="err"></div>
  <footer>
    <form id="sayform" autocomplete="off">
      <input type="text" id="input" placeholder="What do you do?" autofocus>
      <button type="submit" id="send">Say</button>
    </form>
  </footer>
</main>

<aside>
  <div id="sheet"></div>
  <h2>In the scene</h2>
  <div id="board"></div>
  <h2>Rolls</h2>
  <div id="rolls"></div>
</aside>

<div id="veil"><div class="popup" id="popup"></div></div>

<div id="sheetpanel" aria-hidden="true">
  <div class="sheethead">
    <h1 id="sheetname"></h1>
    <div class="meta" id="sheetmeta"></div>
    <button class="close" id="closesheet">Close  ·  Esc</button>
  </div>
  <div class="tabs" id="sheettabs" role="tablist"></div>
  <div class="sheetbody" id="sheetbody"></div>
</div>

<script>
const STATE = {{ state_json|safe }};
const $ = s => document.querySelector(s);

function csrf() {
  const m = document.cookie.match(/csrftoken=([^;]+)/);
  return m ? m[1] : "";
}

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()},
    body: JSON.stringify(body || {}),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

function render(s) {
  $("#story").innerHTML = s.transcript.map(b =>
    `<p class="beat ${b.who === "player" ? "player" : (b.kind || "")}">${esc(b.text)}</p>`
  ).join("");
  $("#story").scrollTop = $("#story").scrollHeight;

  const pc = s.pc;
  if (pc) {
    const pct = Math.max(0, Math.round(100 * pc.hp / pc.hp_max));
    $("#sheet").innerHTML = `
      <div class="name">${esc(pc.name)}</div>
      <div class="sub">${esc(pc.heritage)} ${esc(pc.class)} · ${esc(pc.race)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row"><span>Hit points</span><span>${pc.hp} / ${pc.hp_max}</span></div>
      <div class="row"><span>Armour class</span><span>${pc.ac}</span></div>
      <h2>Abilities</h2>
      <div class="grid">${Object.entries(pc.abilities).map(([k, v]) =>
        `<div class="cell"><b>${k}</b><span>${v} <small>(${sign(Math.floor((v-10)/2))})</small></span></div>`
      ).join("")}</div>
      <h2>Saves</h2>
      ${Object.entries(pc.saves).map(([k, v]) =>
        `<div class="row"><span>${{fort:"Fortitude",ref:"Reflex",will:"Will"}[k]}</span><span>${sign(v)}</span></div>`
      ).join("")}
      <h2>Skills</h2>
      ${Object.entries(pc.skills).map(([k, v]) =>
        `<div class="row"><span>${title(k)}</span><span>${sign(v)}</span></div>`
      ).join("")}
      <h2>Feats</h2>
      <div class="sub">${pc.feats.map(esc).join(", ")}</div>
      <button class="opensheet" id="opensheet">Full character sheet</button>`;
    $("#opensheet").onclick = openSheet;
  }

  $("#board").innerHTML = s.scene.actors.map(a =>
    `<div class="who"><span>${esc(a.name)} <small>${a.ref}</small></span>
     <small>${a.hp}/${a.hp_max}${a.conditions.length ? " · " + a.conditions.join(", ") : ""}</small></div>`
  ).join("") + `<div class="sub" style="margin-top:8px">${esc(s.scene.location)}</div>`;

  renderRolls(s.log);

  if (s.awaiting) showPopup(s.awaiting); else $("#veil").classList.remove("on");
}

function renderRolls(log) {
  const rolls = [];
  for (const entry of log) {
    for (const o of (entry.outcomes || [])) {
      for (const r of (o.rolls || [])) {
        rolls.push({r, o});
      }
    }
  }
  // Only the player's own rolls ever appear here. The server already strips everyone
  // else's before the state leaves it, so there is nothing to filter and nothing to
  // find in the page source.
  $("#rolls").innerHTML = rolls.slice(-8).reverse().map(({r, o}) => `
    <div class="who" style="display:block">
      <div style="display:flex;justify-content:space-between">
        <span>${esc(r.label || o.op)}</span>
        <span style="color:var(--accent)">${r.total}${
          // Only a d20 is compared against a DC or an AC. Showing the outcome's target
          // beside a damage roll read as "6 vs 10", which looks like a miss.
          o.dc && o.dc.value != null && r.die === "1d20" ? " vs " + o.dc.value : ""}</span>
      </div>
      <small>${r.raw}${
        r.modifiers.map(m => ` ${sign(m.value)} ${esc(m.source)}`).join("")}</small>
    </div>`).join("") || `<div class="sub">Nothing rolled yet.</div>`;
}

function showPopup(p) {
  const terms = p.breakdown.map(m =>
    `<div class="row"><span>${esc(m.source)}</span><span>${sign(m.value)}</span></div>`).join("");
  // The die is not always a d20: damage asks for a pool total, so the bounds come from
  // the prompt rather than being hardcoded.
  const lo = p.min != null ? p.min : 1, hi = p.max != null ? p.max : 20;
  const die = p.die || "1d20";
  $("#popup").innerHTML = `
    <h3>${esc(p.label)}</h3>
    <div class="because">${esc(p.because || "")}</div>
    <input class="dieface" id="face" type="number" min="${lo}" max="${hi}"
           placeholder="${esc(die)}">
    <div class="terms">
      <div class="row"><span>Roll</span><span>${esc(die)}${
        lo === hi ? "" : ` (${lo}–${hi})`}</span></div>
      ${terms}
      <div class="row total"><span>Your modifier</span><span>${sign(p.modifier)}</span></div>
      ${p.dc != null ? `<div class="row"><span>Beat</span><span>${p.dc}</span></div>` : ""}
    </div>
    <div class="acts">
      <button id="submitroll">Roll it myself</button>
      <button class="ghost" id="autoroll">Let the table roll</button>
    </div>`;
  $("#veil").classList.add("on");
  $("#face").focus();
  $("#submitroll").onclick = () => {
    const v = parseInt($("#face").value, 10);
    if (!(v >= lo && v <= hi)) { $("#face").focus(); return; }
    sendRoll(v);
  };
  $("#autoroll").onclick = () => sendRoll(null);
  $("#face").onkeydown = e => { if (e.key === "Enter") $("#submitroll").click(); };
}

async function sendRoll(face) {
  $("#veil").classList.remove("on");
  busy(true);
  try { render(await post("/api/roll", {face})); }
  catch (e) { $("#err").textContent = e.message; }
  finally { busy(false); }
}

$("#sayform").onsubmit = async e => {
  e.preventDefault();
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = "";
  $("#err").textContent = "";
  busy(true);
  try { render(await post("/api/say", {text})); }
  catch (err) { $("#err").textContent = err.message; }
  finally { busy(false); }
};

/* ---- The full character sheet -------------------------------------------------
   Section names are the Pathfinder Player Character Folio's own, so a player who
   knows the paper sheet knows which tab to reach for. Every number shows the terms
   that produced it — that itemisation is the whole point of the app, so the sheet is
   where it lives in full. */

let SHEET = null, SHEET_TAB = "defense";

// A plain standing figure, drawn here rather than traced from anyone's artwork. It is
// only a place to hang the slots, so it is deliberately anonymous — no gear, no weapon,
// no gender, nothing that contradicts whoever the character actually is.
const FIGURE_SVG = `
<svg viewBox="0 0 200 460" role="img" aria-label="Body slot diagram">
  <g fill="none" stroke="currentColor" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="42" r="26"/>
    <path d="M100 68 v22"/>
    <path d="M62 104 q38 -16 76 0"/>
    <path d="M62 104 q-6 60 2 96 h72 q8 -36 2 -96"/>
    <path d="M64 108 q-22 44 -26 92 q-2 14 6 22"/>
    <path d="M136 108 q22 44 26 92 q2 14 -6 22"/>
    <path d="M40 226 q-6 12 0 20 q8 8 16 2"/>
    <path d="M160 226 q6 12 0 20 q-8 8 -16 2"/>
    <path d="M66 200 q-4 60 2 108 q3 60 6 96"/>
    <path d="M134 200 q4 60 -2 108 q-3 60 -6 96"/>
    <path d="M74 404 h22 M126 404 h-22"/>
    <path d="M68 428 q-10 6 -2 12 h30 q4 -8 -2 -12"/>
    <path d="M132 428 q10 6 2 12 h-30 q-4 -8 2 -12"/>
  </g>
  <g fill="currentColor" opacity=".5">
    <circle cx="100" cy="26" r="3"/><circle cx="100" cy="52" r="3"/>
    <circle cx="100" cy="82" r="3"/><circle cx="100" cy="118" r="3"/>
    <circle cx="100" cy="150" r="3"/><circle cx="100" cy="192" r="3"/>
    <circle cx="46" cy="238" r="3"/><circle cx="154" cy="238" r="3"/>
    <circle cx="100" cy="436" r="3"/>
  </g>
</svg>`;

const TABS = [
  ["defense",   "Defense",   s => tabDefense(s)],
  ["offense",   "Offense",   s => tabOffense(s)],
  ["skills",    "Skills",    s => tabSkills(s)],
  ["feats",     "Feats & Traits", s => tabFeats(s)],
  ["spells",    "Spells",    s => tabSpells(s)],
  ["equipment", "Equipment", s => tabEquipment(s)],
  ["companions","Companions",s => tabEmpty("No animal companion, familiar, cohort or mount.")],
  ["background","Background",s => tabBackground(s)],
  ["adventures","Adventures",s => tabEmpty("No adventure log yet. Sessions will be recorded here.")],
];

async function openSheet() {
  $("#sheetpanel").classList.add("on");
  $("#sheetpanel").setAttribute("aria-hidden", "false");
  $("#sheetbody").innerHTML = `<div class="empty">Reading the sheet…</div>`;
  try {
    const r = await fetch("/api/sheet");
    SHEET = await r.json();
    if (!r.ok) throw new Error(SHEET.error || "could not read the sheet");
  } catch (e) {
    $("#sheetbody").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }
  $("#sheetname").textContent = SHEET.identity.name;
  $("#sheetmeta").textContent =
    [SHEET.identity.heritage, SHEET.identity.race, SHEET.identity.class,
     SHEET.identity.size].filter(Boolean).join(" · ");
  $("#sheettabs").innerHTML = TABS.map(([k, label]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${k === SHEET_TAB}">${label}</button>`
  ).join("");
  $("#sheettabs").querySelectorAll("button").forEach(b => {
    b.onclick = () => { SHEET_TAB = b.dataset.tab; drawSheet(); };
  });
  drawSheet();
}

function closeSheet() {
  $("#sheetpanel").classList.remove("on");
  $("#sheetpanel").setAttribute("aria-hidden", "true");
}

function drawSheet() {
  $("#sheettabs").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === SHEET_TAB)));
  const entry = TABS.find(t => t[0] === SHEET_TAB);
  $("#sheetbody").innerHTML = entry ? entry[2](SHEET) : "";
  $("#sheetbody").scrollTop = 0;
}

// --- shared bits ---
const termList = t => `<div class="terms">${
  (t.terms || []).map(m => `<div class="t"><span>${esc(m.source)}</span><b>${sign(m.value)}</b></div>`).join("")
}</div>`;

const statCard = (title, t, suffix = "") => `
  <div class="card">
    <h3>${esc(title)}</h3>
    <div class="bignum">${sign(t.total)} ${suffix ? `<small>${esc(suffix)}</small>` : ""}</div>
    ${termList(t)}
  </div>`;

const tabEmpty = msg => `<div class="empty">${esc(msg)}</div>`;

// --- Defense ---
function tabDefense(s) {
  const d = s.defense;
  return `<div class="cols">
    <div class="card">
      <h3>Hit points</h3>
      <div class="bignum">${d.hp.current} <small>of ${d.hp.max}</small></div>
      <div class="terms">
        <div class="t"><span>Unconscious at</span><b>0</b></div>
        <div class="t"><span>Dead at</span><b>-${s.abilities.find(a => a.key === "con").score}</b></div>
      </div>
    </div>
    <div class="card">
      <h3>Armour class</h3>
      <div class="bignum">${d.ac.total}</div>
      ${termList(d.ac)}
      <div class="terms" style="margin-top:10px">
        <div class="t"><span>Touch</span><b>${d.ac_touch.total}</b></div>
        <div class="t"><span>Flat-footed</span><b>${d.ac_flat_footed.total}</b></div>
      </div>
    </div>
    ${d.saves.map(sv => statCard(sv.name + " save", sv)).join("")}
    <div class="card">
      <h3>Combat Maneuver Defense</h3>
      <div class="bignum">${d.cmd.total}</div>
      ${termList(d.cmd)}
      <div class="terms" style="margin-top:10px">
        <div class="t"><span>Flat-footed (no Dex)</span><b>${d.cmd_flat_footed.total}</b></div>
      </div>
    </div>
    <div class="card">
      <h3>Conditions</h3>
      ${d.conditions.length ? d.conditions.map(c => `
        <div style="margin-bottom:10px">
          <b>${esc(c.name)}</b>${c.rounds_left ? ` <span class="pill">${c.rounds_left} rounds</span>` : ""}
          <div class="why">${esc(c.note)}</div>
          ${c.source ? `<div class="why">from: ${esc(c.source)}</div>` : ""}
        </div>`).join("") : `<div class="empty">None.</div>`}
    </div>
  </div>`;
}

// --- Offense ---
function tabOffense(s) {
  const o = s.offense;
  return `<div class="cols" style="margin-bottom:26px">
      ${statCard("Base attack bonus", {total: o.bab, terms: []})}
      ${statCard("Initiative", o.initiative)}
      ${statCard("Combat Maneuver Bonus", o.cmb)}
    </div>
    <div class="card" style="margin-bottom:26px">
      <h3>Attacks</h3>
      <table class="sheet">
        <tr><th>Weapon</th><th>Attack</th><th>Damage</th><th>Critical</th><th>Notes</th></tr>
        ${o.attacks.map(a => `<tr>
          <td><b>${esc(a.name)}</b>${a.equipped ? ' <span class="pill good">in hand</span>' : ""}
              <div class="why">${esc(a.category)}, ${a.hands === 2 ? "two-handed" : "one-handed"}</div></td>
          <td class="num">${sign(a.attack.total)}
              <div class="why" style="font-weight:400">${a.attack.terms.map(m => `${sign(m.value)} ${esc(m.source)}`).join("<br>")}</div></td>
          <td class="num">${esc(a.damage_dice)}${a.damage.total ? sign(a.damage.total) : ""}
              <div class="why" style="font-weight:400">${esc(a.type)}</div></td>
          <td class="num">${esc(a.crit)}</td>
          <td>${a.proficient ? "" : '<span class="pill warn">not proficient (-4)</span>'}
              ${a.sequence > 1 ? `<span class="pill">${a.sequence} attacks on a full attack</span>` : ""}</td>
        </tr>`).join("")}
      </table>
    </div>
    <div class="card">
      <h3>Combat maneuvers — roll CMB against the target's CMD</h3>
      <table class="sheet">
        <tr><th>Maneuver</th><th>Your CMB</th><th>On success</th><th></th></tr>
        ${o.maneuvers.map(m => `<tr>
          <td><b>${esc(m.name)}</b></td>
          <td class="num">${sign(m.cmb.total)}</td>
          <td>${esc(m.effect)}</td>
          <td>${m.size_limit != null ? '<span class="pill">max one size larger</span>' : ""}</td>
        </tr>`).join("")}
      </table>
    </div>`;
}

// --- Skills ---
function tabSkills(s) {
  return `<div class="card">
    <h3>Skills — ${s.skills.filter(k => k.rank > 0).length} trained</h3>
    <table class="sheet">
      <tr><th>Skill</th><th>Total</th><th>Ranks</th><th>Made up of</th></tr>
      ${s.skills.map(k => `<tr class="${k.usable ? "" : "dim"}">
        <td>${esc(title(k.name))}
            ${k.class_skill ? '<span class="pill good">class</span>' : ""}
            ${k.trained_only ? '<span class="pill">trained only</span>' : ""}
            <div class="why">${esc(k.ability.toUpperCase())}${k.armour_check ? " · armour check applies" : ""}</div></td>
        <td class="num">${k.usable ? sign(k.total) : "—"}</td>
        <td class="num">${k.rank || ""}</td>
        <td class="why">${k.usable
          ? k.terms.map(m => `${sign(m.value)} ${esc(m.source)}`).join(", ")
          : "cannot be attempted untrained"}</td>
      </tr>`).join("")}
    </table>
  </div>`;
}

// --- Feats ---
function tabFeats(s) {
  return `<div class="cols">
    <div class="card">
      <h3>Feats</h3>
      <table class="sheet">
        <tr><th>Feat</th><th>What the engine applies</th></tr>
        ${s.feats.map(f => `<tr class="${f.applied ? "" : "dim"}">
          <td><b>${esc(f.name)}</b>${f.applied ? "" : ' <span class="pill warn">flavour</span>'}</td>
          <td class="why">${esc(f.effect)}</td>
        </tr>`).join("") || `<tr><td colspan="2" class="empty">None.</td></tr>`}
      </table>
    </div>
    <div class="card">
      <h3>Traits &amp; languages</h3>
      <div class="empty">Traits and languages are not modelled yet.</div>
    </div>
  </div>`;
}

// --- Spells ---
function tabSpells(s) {
  return tabEmpty(`${SHEET.identity.name} is not a spellcaster. `
    + `Spellcasting is not implemented yet — when it is, prepared spells, slots and `
    + `save DCs will appear here.`);
}

// --- Equipment ---
// The body-slot page: a figure with the slots arranged down either side, roughly where
// each thing is worn. Empty slots are drawn as blanks rather than hidden — showing what
// is *not* filled is the whole reason for laying it out on a body.
function slotBox(sl, side) {
  const canAdd = sl.items.length < sl.max;
  return `
    <div class="slot ${side}" data-slot="${sl.key}">
      <div class="slothead">
        <span>${esc(sl.label)}</span>
        ${canAdd ? `<button class="addslot" data-slot="${sl.key}" title="Add another ${esc(sl.label.toLowerCase())} slot">+</button>` : ""}
      </div>
      ${sl.items.map(it => `
        <div class="slotrow${it.empty ? " isempty" : ""}${it.beyond_rules ? " beyond" : ""}">
          <input class="slotinput" data-slot="${sl.key}" data-index="${it.index}"
                 value="${esc(it.item || "")}" placeholder="empty"
                 ${sl.derived ? "disabled" : ""}>
          ${sl.items.length > 1 && !sl.derived
            ? `<button class="delslot" data-slot="${sl.key}" data-index="${it.index}" title="Remove this slot">×</button>`
            : ""}
        </div>`).join("")}
      <div class="slotholds">${esc(sl.holds)}${
        sl.max > sl.rules_limit ? ` · ${sl.rules_limit} work${sl.rules_limit === 1 ? "s" : ""} at once` : ""}</div>
    </div>`;
}

function tabEquipment(s) {
  const e = s.equipment, sl = e.slots;
  return `
    <div class="bodylayout">
      <div class="slotcol">${sl.left.map(x => slotBox(x, "left")).join("")}</div>
      <div class="figure">${FIGURE_SVG}
        <div class="figcap">${sl.filled} of ${sl.total} slots filled</div>
      </div>
      <div class="slotcol">${sl.right.map(x => slotBox(x, "right")).join("")}</div>
    </div>

    <div class="cols" style="margin-top:26px">
      <div class="card">
        <h3>Armour and shield</h3>
        <table class="sheet">
          <tr><th>Item</th><th>AC</th><th>Max Dex</th><th>Check penalty</th></tr>
          <tr><td>${esc(e.armour.name)}</td><td class="num">${sign(e.armour.ac)}</td>
              <td class="num">${e.armour.max_dex > 90 ? "—" : sign(e.armour.max_dex)}</td>
              <td class="num">${e.armour.acp || "—"}</td></tr>
          <tr><td>${esc(e.shield.name)}</td><td class="num">${sign(e.shield.ac)}</td>
              <td class="num">—</td><td class="num">${e.shield.acp || "—"}</td></tr>
        </table>
        <div class="why" style="margin-top:10px">
          Total armour check penalty ${e.armour_check_penalty || 0}, applied to
          Acrobatics, Climb, Disable Device, Escape Artist, Fly, Ride, Sleight of Hand,
          Stealth and Swim. The armour and shield slots are filled from here, so there
          is only one place that says what you are wearing.
        </div>
      </div>
      <div class="card">
        <h3>Carried weapons</h3>
        ${e.weapons.length
          ? `<ul style="margin:0;padding-left:18px">${e.weapons.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`
          : `<div class="empty">Nothing.</div>`}
        <div class="why" style="margin-top:10px">
          Slots record what is worn. Their effects are not applied to your numbers yet —
          a ring of protection here will not move your AC until magic items are modelled.
          Gear, coin and encumbrance are not tracked either.
        </div>
      </div>
    </div>`;
}

async function slotAction(payload) {
  try {
    SHEET = await post("/api/slots", payload);
    drawSheet();
  } catch (e) {
    alert(e.message);
  }
}

// Delegated so the handlers survive every redraw.
document.addEventListener("click", e => {
  const add = e.target.closest(".addslot");
  if (add) return slotAction({action: "add", slot: add.dataset.slot});
  const del = e.target.closest(".delslot");
  if (del) return slotAction({action: "remove", slot: del.dataset.slot,
                              index: Number(del.dataset.index)});
});
document.addEventListener("change", e => {
  const input = e.target.closest(".slotinput");
  if (input) slotAction({action: "set", slot: input.dataset.slot,
                         index: Number(input.dataset.index), item: input.value});
});

// --- Background ---
function tabBackground(s) {
  const b = s.background, i = s.identity;
  return `<div class="cols">
    <div class="card">
      <h3>In the world</h3>
      <div class="terms">
        <div class="t"><span>People</span><b>${esc(b.heritage || "—")}</b></div>
        <div class="t"><span>World Bible id</span><b>${esc(i.world_people_id || "—")}</b></div>
      </div>
      <div class="why" style="margin-top:10px">
        The rules race and the world's people are different things, and the sheet
        carries both. ${esc(i.heritage || "This people")} is who
        ${esc(i.name)} is in the world; ${esc(i.race)} is what the rules use.
      </div>
    </div>
    <div class="card">
      <h3>Notes</h3>
      ${b.notes ? `<div style="white-space:pre-wrap">${esc(b.notes)}</div>`
                : `<div class="empty">None.</div>`}
    </div>
  </div>`;
}

$("#closesheet").onclick = closeSheet;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheetpanel").classList.contains("on")) closeSheet();
});

function busy(on) {
  $("#busy").classList.toggle("on", on);
  $("#send").disabled = on;
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sign = n => (n >= 0 ? "+" : "") + n;
const title = s => s.replace(/\b\w/g, c => c.toUpperCase());

render(STATE);
</script>
</body>
</html>
