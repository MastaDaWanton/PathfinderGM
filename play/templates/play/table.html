{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathfinder GM — Pangrella</title>
<style>
  /* ==========================================================================
     The grimoire. One design system, stated once:

     - The window is carved dungeon stone, lit from below by candlelight and
       from nowhere by a low blood-red ambience that only wakes when something
       is wrong.
     - The transcript is the book: a column of aged, darkened parchment with an
       illuminated capital opening each of the GM's passages, and new passages
       arriving as ink bleeding in rather than appearing.
     - The sidebar and every overlay are obsidian glass: translucent, blurred,
       edged in wrought iron and a gold hairline.
     - Everything interactive is warm to the touch — an ember follows the
       cursor inside buttons, runes glow when a field takes focus — and all of
       it stands down under prefers-reduced-motion.

     No asset is fetched. The fonts degrade to Palatino (see fonts/README.md),
     the textures are gradients, the ornaments are inline SVG — the app has to
     look right on a machine that has never been online, because that machine
     is the point of it.
     ========================================================================== */
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 400; font-display: swap;
    src: local("Cinzel"), url("{% static 'fonts/Cinzel-Regular.woff2' %}") format("woff2");
  }
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 600; font-display: swap;
    src: local("Cinzel SemiBold"), url("{% static 'fonts/Cinzel-SemiBold.woff2' %}") format("woff2");
  }

  :root {
    --display: "Cinzel", "Trajan Pro", "Palatino Linotype", Palatino, "Book Antiqua",
               Georgia, serif;
    --body: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;

    /* Stone, iron, parchment. */
    --bg: #0d0b09; --panel: #161210; --edge: #3a2f22; --sunk: #0b0908;
    --ink: #e8ddc4; --dim: #93866e; --ash: #6d675e;
    /* Candlelight. */
    --accent: #cfa964; --gold: #ddc48e; --gold-dim: #7d6845;
    --candle: #f0c070; --ember: 255, 176, 84;
    /* Blood magic. */
    --blood: #6e1f1f; --bloodglow: 168, 44, 40; --alarm: #b0483c;
    --player: #8fb0c8;
    /* Obsidian glass. */
    --glass: rgba(16, 12, 9, .66); --glass-edge: rgba(221, 196, 142, .14);
  }
  * { box-sizing: border-box; }

  /* Thin wrought-iron scrollbars, everywhere. */
  * { scrollbar-width: thin; scrollbar-color: #3a2f22 transparent; }
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-thumb {
    background: linear-gradient(#3a2f22, #2a2118); border-radius: 4px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  *::-webkit-scrollbar-track { background: transparent; }

  body {
    margin: 0; color: var(--ink); font: 17px/1.65 var(--body);
    display: grid; grid-template-columns: 1fr 350px; height: 100vh;
    overflow: hidden; position: relative;
    /* Carved stone: big soft shadow-form first, then two interfering strata of
       chisel marks, then mortar courses. All gradient, nothing fetched. */
    background:
      radial-gradient(130% 100% at 42% -10%, #191410 0%, #0d0b09 52%, #060504 100%),
      repeating-linear-gradient(58deg,  rgba(255,240,200,.014) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(-31deg, rgba(0,0,0,.35) 0 3px, transparent 3px 8px),
      repeating-linear-gradient(0deg,   transparent 0 118px, rgba(0,0,0,.28) 118px 121px),
      repeating-linear-gradient(90deg,  transparent 0 174px, rgba(0,0,0,.22) 174px 177px);
  }
  /* The candle. A fixed pool of warm light rising from the writing desk — the
     input bar — that breathes very slowly. Light animates on opacity only. */
  body::before {
    content: ""; position: fixed; z-index: 0; pointer-events: none;
    left: -10%; right: 20%; bottom: -30%; height: 90%;
    background: radial-gradient(55% 60% at 38% 100%,
                rgba(var(--ember), .10), rgba(var(--ember), .035) 45%, transparent 72%);
    animation: candle 7s ease-in-out infinite;
  }
  /* And the vignette: the edges of the room fall away into the dark. */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 5; pointer-events: none;
    box-shadow: inset 0 0 190px 40px rgba(0, 0, 0, .78);
  }
  @keyframes candle {
    0%, 100% { opacity: .75; } 38% { opacity: 1; } 61% { opacity: .82; }
  }

  main {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    position: relative; z-index: 1;
  }

  /* --- The book ----------------------------------------------------------- */
  /* The transcript is a column of aged parchment: barely lighter than the
     stone, warm, edged with a deckled shadow and a double hairline. It scrolls
     as one long page — the scroll *is* turning the book. */
  #story {
    flex: 1; min-height: 0; overflow-y: auto; padding: 44px 48px 34px;
  }
  #story::before {
    /* The page under the ink, fixed to the pane rather than the text so it
       does not scroll away: soft parchment light down the reading column. */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 100%;
    pointer-events: none;
    background: radial-gradient(72% 90% at 50% 30%,
                rgba(240, 214, 158, .045), transparent 75%);
  }
  .beat {
    margin: 0 auto 24px; max-width: 64ch; white-space: pre-wrap;
    position: relative;
  }
  /* Ink bleeding in. Only beats marked fresh animate — render() rebuilds the
     whole transcript each state, and without the gate every line re-bled on
     every turn. The JS marks the tail. */
  .beat.fresh { animation: inkbleed .9s cubic-bezier(.22, .8, .36, 1) both; }
  @keyframes inkbleed {
    from { opacity: 0; filter: blur(7px); transform: translateY(9px); }
    60%  { filter: blur(1.5px); }
    to   { opacity: 1; filter: blur(0); transform: none; }
  }
  .beat.player { color: var(--player); font-style: italic; }
  .beat.player::before { content: "❧ "; opacity: .55; font-style: normal; }
  .beat.consequence { color: var(--ink); }
  .beat.setup { color: #d2c7ad; }
  /* The illuminated capital: each of the GM's scene passages opens the way a
     grimoire page does. Consequences stay plain — they are the engine's voice. */
  .beat.setup::first-letter {
    font-family: var(--display); font-size: 2.55em; line-height: .78;
    padding: .04em .09em 0 0; float: left; color: var(--candle);
    text-shadow: 0 0 18px rgba(var(--ember), .35), 0 2px 6px rgba(0,0,0,.8);
  }

  /* --- The writing desk --------------------------------------------------- */
  footer {
    position: relative; z-index: 2;
    border-top: 1px solid var(--gold-dim); padding: 16px 48px 24px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 -1px 0 rgba(221,196,142,.10), 0 -18px 44px rgba(0,0,0,.45);
  }
  form { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; color: var(--ink); padding: 13px 16px; font: inherit; border-radius: 2px;
    background: linear-gradient(var(--sunk), #131009); border: 1px solid #2e251a;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.6);
    transition: border-color .25s ease, box-shadow .45s ease;
  }
  /* The rune wakes: focus is a slow gold pulse, not a browser outline. */
  input[type=text]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 0 0 1px rgba(var(--ember), .25),
                0 0 22px rgba(var(--ember), .12);
    animation: runewake 2.6s ease-in-out infinite;
  }
  @keyframes runewake {
    50% { box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 0 0 1px rgba(var(--ember), .4),
                      0 0 30px rgba(var(--ember), .2); }
  }
  input[type=text]::placeholder { color: #5d5240; font-style: italic; }

  /* Every button is cold iron with a gold face, and an ember that follows the
     cursor inside it — the JS feeds --mx/--my from one delegated listener. */
  button {
    background: linear-gradient(#2b2318, #191410); border: 1px solid var(--gold-dim);
    color: var(--gold); padding: 12px 24px; border-radius: 2px; cursor: pointer;
    font: 400 15px/1 var(--display); letter-spacing: .16em; font-variant: small-caps;
    position: relative; overflow: hidden;
    transition: color .2s ease, border-color .2s ease, transform .16s ease,
                box-shadow .25s ease;
  }
  button::after, .sugg::after, .pick::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(130px circle at var(--mx, 50%) var(--my, 50%),
                rgba(var(--ember), .17), transparent 65%);
    transition: opacity .3s ease;
  }
  button:hover::after, .sugg:hover::after, .pick:hover::after { opacity: 1; }
  button:hover:not(:disabled) {
    color: #f4e6c0; border-color: var(--accent); transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,.5), 0 0 14px rgba(var(--ember), .10);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .35; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); }
  button:focus-visible, .sugg:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(var(--ember), .35);
  }

  /* --- The obsidian pane -------------------------------------------------- */
  aside {
    position: relative; z-index: 2;
    border-left: 1px solid var(--gold-dim); overflow-y: auto; padding: 22px;
    min-height: 0; font: 14px/1.55 var(--body);
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: inset 1px 0 0 var(--glass-edge), -14px 0 40px rgba(0,0,0,.35);
  }
  aside h2 {
    color: var(--gold); font: 400 16px/1 var(--display); letter-spacing: .13em;
    font-variant: small-caps; margin: 24px 0 10px; padding-bottom: 5px;
    border-bottom: 1px solid #2b2319;
  }
  aside h2:first-child { margin-top: 0; }
  .name { color: var(--gold); font: 400 24px/1.15 var(--display);
          letter-spacing: .04em; font-variant: small-caps;
          text-shadow: 0 2px 10px rgba(0,0,0,.85); }
  .sub { color: var(--dim); font-size: 13px; font-style: italic; margin-bottom: 12px; }
  .biome {
    margin: -6px 0 12px; padding: 5px 9px; border-radius: 2px; cursor: default;
    background: rgba(111,207,143,.06); border: 1px solid #2f5f42; color: #a9d9bb;
    font: 600 11px/1.4 system-ui, sans-serif; letter-spacing: .07em;
    text-transform: uppercase;
  }

  /* Life as candlelight: the bar burns, and it gutters low. */
  .bar { height: 7px; background: #221c14; border-radius: 2px; overflow: hidden;
         margin: 8px 0 6px; box-shadow: inset 0 1px 3px rgba(0,0,0,.7);
         display: flex; }
  .bar > i { display: block; height: 100%; position: relative;
             background: linear-gradient(90deg, #8a6f3e, var(--accent), #e8c47c);
             transition: width .8s cubic-bezier(.3, .9, .3, 1);
             box-shadow: 0 0 10px rgba(var(--ember), .25); }
  .bar > i.temp { background: linear-gradient(90deg, #4a6b7a, #7fb0c4);
                  box-shadow: none; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .cell {
    background: linear-gradient(#1d1811, #151109); border: 1px solid #2b2319;
    border-radius: 2px; padding: 7px 9px; text-align: center;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .cell:hover { border-color: #43372a; box-shadow: 0 0 12px rgba(var(--ember), .06); }
  .cell.hurt { border-color: #6d3a32;
               box-shadow: inset 0 0 12px rgba(var(--bloodglow), .12); }
  .cell.hurt > em { display: block; color: #c4736a; font: italic 11px/1.3 var(--body); }
  .cell b { display: block; color: var(--dim); font: 400 12px/1.3 var(--display);
            letter-spacing: .1em; font-variant: small-caps; }
  .cell span { color: var(--gold); font: 400 19px/1.35 var(--display); }
  .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .row span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
  /* Blood magic wakes only when something is wrong. */
  .row.danger span:last-child {
    color: #d9534f; text-shadow: 0 0 12px rgba(var(--bloodglow), .5);
    animation: bloodpulse 2.2s ease-in-out infinite;
  }
  @keyframes bloodpulse {
    50% { text-shadow: 0 0 20px rgba(var(--bloodglow), .85); }
  }
  .row small.cd { color: var(--dim); }

  /* The map: a stone relief under glass. */
  #map { width: 100%; height: auto; display: block; background: #14110e;
         border: 1px solid #241d15; border-radius: 3px;
         box-shadow: inset 0 0 24px rgba(0,0,0,.55); }
  #map .rule { stroke: #241d15; stroke-width: .5; }
  #map .blocked { fill: #3a3128; }
  #map .difficult { fill: #2a2416; }
  #map .obscuring { fill: #23262b; }
  #map .reach { fill: var(--gold); opacity: .12; }
  #map .token { fill: #6b4a3a; stroke: #241d15; stroke-width: 1;
                transition: cx .4s ease, cy .4s ease; }
  #map .token.pc { fill: var(--gold); }
  #map .token.down { opacity: .35; }
  #map text.tok { fill: #14120f; font: 700 9px var(--display); text-anchor: middle;
                  pointer-events: none; }
  .maplegend { margin-top: 4px; }

  .spellrow { display: flex; align-items: center; justify-content: space-between;
              gap: 12px; padding: 5px 0; border-bottom: 1px solid #1d1811; }
  .spellrow:last-child { border-bottom: 0; }
  .spellname b { display: block; }
  .spellname small { color: var(--dim); }
  .spellrow.missing { opacity: .5; }
  .prep { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .prepbtn { width: 22px; height: 22px; line-height: 1; border-radius: 3px;
             border: 1px solid #2e261c; background: #1a1610; color: var(--gold);
             cursor: pointer; padding: 0; letter-spacing: 0; }
  .prepbtn:disabled { opacity: .3; cursor: default; }
  .prepcount { min-width: 14px; text-align: center; color: var(--dim);
               font-variant-numeric: tabular-nums; }
  .prepcount.has { color: var(--accent); }
  .terms b.spent { color: var(--dim); }

  #featq { width: 100%; padding: 7px 9px; margin-bottom: 10px; border-radius: 3px;
           border: 1px solid #2e261c; background: #14120f; color: var(--ink);
           font: inherit; }
  #featresults { max-height: 46vh; overflow-y: auto; }
  .featrow { padding: 7px 0; border-bottom: 1px solid #1d1811; }
  .featrow:last-child { border-bottom: 0; }
  .featrow small { color: var(--dim); margin-left: 6px; }
  .featrow .why { margin: 3px 0; }
  .verdict { font: 400 12px/1.4 var(--display); letter-spacing: .06em;
             font-variant: small-caps; }
  .verdict.ok { color: #6fa76f; }
  .verdict.held { color: var(--gold); }
  .verdict.no { color: #8a7a6a; }
  .verdict.maybe { color: #b08a4a; }
  .prereq { display: block; color: var(--dim); margin-left: 0; }
  .why a { color: var(--gold); }

  /* The GM's offered actions: wax seals on the desk. One click fills the pen. */
  #suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #suggestions:empty { display: none; }
  .sugg { padding: 5px 12px; border-radius: 12px; cursor: pointer;
          border: 1px solid var(--gold-dim); background: rgba(26,22,16,.82);
          color: var(--gold); font: inherit; font-size: 13px; text-align: left;
          position: relative; overflow: hidden;
          transition: color .2s ease, border-color .2s ease, transform .16s ease,
                      box-shadow .25s ease;
          animation: inkbleed .7s cubic-bezier(.22,.8,.36,1) both; }
  .sugg:hover { color: #f4e6c0; border-color: var(--accent);
                transform: translateY(-1px);
                box-shadow: 0 3px 12px rgba(0,0,0,.45), 0 0 12px rgba(var(--ember), .10); }
  .who { display: flex; justify-content: space-between; padding: 6px 0;
         border-bottom: 1px solid #241d15; }
  .who small { color: var(--dim); }
  .who.up { color: var(--gold); }
  .who.up small { color: var(--accent); }
  .who.out { opacity: .45; text-decoration: line-through; }

  /* --- Death -------------------------------------------------------------- */
  #deathveil {
    position: fixed; inset: 0; z-index: 40; display: none; place-items: center;
    background: radial-gradient(60% 50% at 50% 40%, rgba(46,10,10,.5), rgba(4,3,3,.94));
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  }
  #deathveil.on { display: grid; }
  #deathveil.on .deathpanel { animation: conjure .5s cubic-bezier(.2, .9, .3, 1.04) both; }
  .deathpanel {
    width: min(620px, 92vw); max-height: 86vh; overflow-y: auto; padding: 34px 38px;
    background: linear-gradient(rgba(24,17,15,.92), rgba(12,9,8,.94)) padding-box,
                linear-gradient(#6b2020, #2a1512) border-box;
    border: 1px solid transparent; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(221,196,142,.08), 0 24px 80px rgba(0,0,0,.9),
                0 0 60px rgba(var(--bloodglow), .18);
  }
  .deathpanel h2 {
    margin: 0 0 14px; color: #c96a5a; font: 400 42px/1 var(--display);
    letter-spacing: .08em; font-variant: small-caps;
    text-shadow: 0 0 30px rgba(var(--bloodglow), .5);
  }
  .deathpanel h3 {
    margin: 26px 0 12px; color: var(--gold); font: 400 18px/1 var(--display);
    letter-spacing: .12em; font-variant: small-caps;
    border-bottom: 1px solid #2b2319; padding-bottom: 7px;
  }
  .deathpanel p { margin: 0; white-space: pre-wrap; color: var(--ink); }
  .pick {
    display: block; width: 100%; text-align: left; margin-bottom: 9px;
    padding: 13px 16px; cursor: pointer; border-radius: 2px;
    background: linear-gradient(#1d1811, #141009); border: 1px solid var(--gold-dim);
    position: relative; overflow: hidden;
    transition: border-color .2s ease, transform .16s ease, box-shadow .25s ease;
  }
  .pick:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px);
                               box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  .pick:disabled { opacity: .5; cursor: default; }
  .pick.current { border-color: var(--accent); }
  .pick b { display: block; color: var(--gold); font: 400 21px/1.2 var(--display);
            letter-spacing: .03em; font-variant: small-caps; }
  .pick small { color: var(--dim); font: 13px/1.5 var(--body); }
  .pick em { display: block; color: var(--dim); font: italic 13px/1.5 var(--body);
             margin-top: 5px; }
  .grave { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
           border-bottom: 1px solid #241d15; font: 14px/1.5 var(--body); }
  .grave.dead { color: var(--dim); }
  .grave b { color: var(--ink); font-weight: 400; }
  .grave.dead b { text-decoration: line-through; }

  /* --- The conjuring: the dice popup -------------------------------------- */
  #veil {
    position: fixed; inset: 0; background: rgba(6,5,4,.72);
    display: none; place-items: center; z-index: 20;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #veil.on { display: grid; }
  #veil.on .popup { animation: conjure .42s cubic-bezier(.2, .9, .3, 1.04) both; }
  @keyframes conjure {
    from { opacity: 0; transform: scale(.955) translateY(10px); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  .popup {
    width: 420px; padding: 28px 30px; font: 15px/1.55 var(--body);
    background:
      linear-gradient(rgba(27,22,17,.93), rgba(18,15,11,.95)) padding-box,
      linear-gradient(#5a4931, #2a2219) border-box;
    border: 1px solid transparent; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(221,196,142,.10), 0 18px 60px rgba(0,0,0,.8),
                0 0 46px rgba(var(--ember), .07);
  }
  .popup h3 {
    margin: 0 0 4px; color: var(--gold); font: 400 26px/1.2 var(--display);
    letter-spacing: .06em; font-variant: small-caps;
  }
  .popup .because { color: var(--dim); font-style: italic; margin-bottom: 18px; }
  .terms {
    background: rgba(0,0,0,.34); border: 1px solid #2b2319; border-radius: 2px;
    padding: 11px 13px; margin: 14px 0;
  }
  .terms .row { font-size: 13px; }
  .terms .row.total { border-top: 1px solid #3a3022; margin-top: 7px; padding-top: 7px;
                      color: var(--gold); }
  .dieface {
    width: 100%; color: var(--gold); text-align: center; padding: 16px;
    font: 400 42px/1 var(--display); border-radius: 2px; margin-bottom: 14px;
    background: linear-gradient(var(--sunk), #131009); border: 1px solid #2e251a;
    box-shadow: inset 0 3px 10px rgba(0,0,0,.7);
    transition: border-color .25s ease, box-shadow .3s ease, text-shadow .3s ease;
  }
  .dieface:focus {
    outline: none; border-color: var(--accent);
    box-shadow: inset 0 3px 10px rgba(0,0,0,.7), 0 0 20px rgba(var(--ember), .14);
    text-shadow: 0 0 22px rgba(var(--ember), .4);
  }
  .popup .acts { display: flex; gap: 9px; }
  .popup .acts button { flex: 1; }
  #busy, #err { font-family: var(--body); }

  /* --- The full character sheet ------------------------------------------- */
  #sheetpanel {
    position: fixed; inset: 0; z-index: 30;
    display: none; grid-template-rows: auto auto 1fr;
    transform: translateX(1.5%) scale(.995); opacity: 0;
    transition: transform .3s cubic-bezier(.2, .9, .3, 1), opacity .3s ease;
    background:
      radial-gradient(120% 90% at 50% 0%, #1a1512 0%, #0f0d0b 55%, #080706 100%),
      repeating-linear-gradient(58deg, rgba(255,240,200,.014) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(-31deg, rgba(0,0,0,.30) 0 3px, transparent 3px 7px);
  }
  #sheetpanel.on { display: grid; transform: none; opacity: 1; }
  #sheetpanel::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 220px 60px rgba(0,0,0,.72);
  }

  .sheethead {
    display: flex; align-items: center; gap: 18px;
    padding: 20px 44px 16px; position: relative;
    border-bottom: 1px solid var(--gold-dim);
    box-shadow: 0 1px 0 #0a0806, 0 2px 0 rgba(221,196,142,.10);
  }
  .sigil { width: 46px; height: 62px; flex: none; color: var(--blood); }
  .sheethead h1 {
    margin: 0; color: var(--gold); font: 400 38px/1.05 var(--display);
    letter-spacing: .045em; font-variant: small-caps;
    text-shadow: 0 2px 10px rgba(0,0,0,.9);
  }
  .sheethead .meta {
    color: var(--dim); font: 14px/1.4 var(--body);
    letter-spacing: .09em; align-self: flex-end; padding-bottom: 8px;
  }
  .sheethead .close {
    margin-left: auto; background: linear-gradient(#1d1813, #131009);
    border: 1px solid var(--gold-dim); color: var(--gold);
    padding: 9px 18px; border-radius: 2px; cursor: pointer;
    font: 400 12px/1 var(--display);
    letter-spacing: .18em; font-variant: small-caps;
  }
  .sheethead .close:hover { color: #f4e6c0; border-color: var(--accent); }

  .tabs {
    display: flex; gap: 4px; padding: 0 44px; overflow-x: auto;

  }
  .tabs button {
    background: transparent; border: 1px solid transparent; border-bottom: 0;
    color: var(--dim); padding: 11px 20px 10px; cursor: pointer; white-space: nowrap;
    font: 400 15px/1 var(--display);

    position: relative; top: 1px; overflow: hidden;
  }
  .tabs button:hover { color: var(--ink); transform: none; box-shadow: none; }
  .tabs button[aria-selected="true"] {
    color: var(--gold); border-color: var(--gold-dim);
    background: linear-gradient(#1d1712, #14100c);
    box-shadow: inset 0 1px 0 rgba(221,196,142,.16);

  .sheetbody { overflow-y: auto; padding: 26px 44px 70px; position: relative; z-index: 1; }
  .cols {

  .framed, .card, .slot {

    transition: box-shadow .3s ease;

  .card:hover { box-shadow: inset 0 0 0 1px rgba(221,196,142,.10),
                0 6px 22px rgba(0,0,0,.6), 0 0 22px rgba(var(--ember), .05); }
  .framed::before, .card::before, .slot::before {
    content: ""; position: absolute; inset: 4px; pointer-events: none;
    border: 1px solid rgba(221,196,142,.11); border-radius: 2px;

  .card { padding: 17px 19px; }
  .card > h3 {
    margin: 0 0 12px; color: var(--gold);

  .bignum {
    font: 400 38px/1 var(--display); color: var(--gold);

  .terms { margin-top: 8px; }
  .terms .t {
    display: flex; justify-content: space-between; padding: 3px 0;

  .terms .t b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
  table.sheet {
    width: 100%; border-collapse: collapse;

  table.sheet th {
    text-align: left; color: var(--gold); padding: 7px 10px;

    letter-spacing: .1em; font-variant: small-caps;

  table.sheet td { padding: 7px 10px; border-bottom: 1px solid #241d15; vertical-align: top; }
  table.sheet td.num { text-align: right; font-variant-numeric: tabular-nums;
                       color: var(--accent); white-space: nowrap; }
  table.sheet tr.dim td { color: var(--dim); }
  .why { color: var(--dim); font: italic 13px/1.5 var(--body); }
  .pill {
    display: inline-block; border: 1px solid #33291d; border-radius: 2px;

           font-family: var(--display); }

  .corner {
    position: absolute; width: 74px; height: 74px; pointer-events: none;
    color: var(--gold-dim); opacity: .85; z-index: 2;

  .corner.tl { top: 6px; left: 6px; }
  .corner.tr { top: 6px; right: 6px; transform: scaleX(-1); }
  .corner.bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
  .corner.br { bottom: 6px; right: 6px; transform: scale(-1); }

  .bodylayout {
    display: grid; grid-template-columns: minmax(210px, 1fr) minmax(180px, 300px) minmax(210px, 1fr);
    gap: 22px; align-items: start;
  }
  .slotcol { display: flex; flex-direction: column; gap: 11px; }
  .figure { position: sticky; top: 0; text-align: center; }
  .figure > svg { width: 100%; max-width: 300px; height: auto; color: #6a5a3c; }
  .figcap {
    display: inline-block; margin-top: 10px; padding: 5px 26px;
    color: var(--gold); font: 400 14px/1 var(--display);
    letter-spacing: .13em; font-variant: small-caps;

  .slot { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 11px 13px; }

  .medallion {
    grid-row: 1 / span 3; align-self: start; width: 46px; height: 46px; flex: none;
    border-radius: 50%; display: grid; place-items: center; color: var(--accent);
    background: radial-gradient(circle at 34% 28%, #3a3024, #171310 72%);
    box-shadow: inset 0 0 0 1px rgba(221,196,142,.30),
                inset 0 2px 6px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.6);

  .slothead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    color: var(--gold); font: 400 17px/1 var(--display);
    letter-spacing: .1em; font-variant: small-caps; margin-bottom: 5px;
  }
  .slothead button {
    background: transparent; border: 1px solid var(--gold-dim); color: var(--accent);
    width: 21px; height: 21px; line-height: 1; border-radius: 2px; padding: 0;
    cursor: pointer; font: 400 15px/1 Georgia, serif; flex: none; letter-spacing: 0;
  }
  .slothead button:hover { color: #f4e6c0; border-color: var(--accent);
                           background: rgba(221,196,142,.10); }
  .slotrow { display: flex; gap: 6px; margin-bottom: 5px; }
  .slotinput {
    flex: 1; min-width: 0; color: var(--ink); border-radius: 2px; padding: 7px 10px;
    font: 15px/1.3 var(--body);
    background: linear-gradient(var(--sunk), #131009);
    border: 1px solid #2e251a;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.6);
  }
  .slotinput:focus { outline: none; border-color: var(--accent);
                     box-shadow: inset 0 2px 5px rgba(0,0,0,.6), 0 0 0 1px rgba(201,168,106,.35); }
  .slotinput:disabled { color: var(--gold); font-style: normal; opacity: .85; }
  .slotinput::placeholder { color: #5d5240; font-style: italic; }
  .slotrow.beyond .slotinput { border-left: 2px solid var(--alarm); }
  .slotrow .delslot {
    background: transparent; border: 1px solid #2e251a; color: var(--dim);
    width: 26px; border-radius: 2px; cursor: pointer; padding: 0;
    font: 15px/1 Georgia, serif; flex: none; letter-spacing: 0;
  }
  .slotrow .delslot:hover { color: var(--alarm); border-color: var(--alarm); }
  .slotholds {
    color: var(--dim); font: 12px/1.4 var(--body);
    font-style: italic;
  }
  @media (max-width: 1000px) {
    .bodylayout { grid-template-columns: 1fr 1fr; }
    .figure { display: none; }
  }

  .opensheet {
    width: 100%; margin-top: 14px; background: transparent; color: var(--accent);
    border: 1px solid var(--edge); padding: 10px; border-radius: 3px; cursor: pointer;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .08em;
    text-transform: uppercase;
    display: block; text-align: center; text-decoration: none; box-sizing: border-box;
  }
  .opensheet:hover { border-color: var(--accent); }

  #busy { color: var(--dim); font-style: italic; padding: 0 48px 12px;
          display: none; position: relative; z-index: 2; }
  #busy.on { display: block; animation: thinking 2.4s ease-in-out infinite; }
  @keyframes thinking { 50% { opacity: .45; } }
  #err { color: var(--alarm); padding: 0 48px 12px; max-width: 70ch;
         position: relative; z-index: 2; }
  #err.hint { color: var(--dim); font-style: italic; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  pre { font: 11px/1.4 ui-monospace, monospace; color: var(--dim); overflow-x: auto;
        background: #14120f; padding: 8px; border-radius: 3px; }

  /* The whole enchantment stands down for anyone who asked motion to stop. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important; transition: none !important;
    }
  }
</style>
</head>
<body>
<main>
  <div id="story"></div>
  <div id="busy">the GM is thinking…</div>
  <div id="err"></div>
  <footer>
    <div id="suggestions"></div>
    <form id="sayform" autocomplete="off">
      <input type="text" id="input" placeholder="What do you do?" autofocus>
      <button type="submit" id="send">Say</button>
    </form>
  </footer>
</main>

<aside>
  <div id="sheet"></div>
  <div id="order"></div>
  <div id="mapwrap"></div>
  <h2>In the scene</h2>
  <div id="board"></div>
  <h2>Rolls</h2>
  <div id="rolls"></div>
</aside>

<div id="veil"><div class="popup" id="popup"></div></div>

<div id="deathveil">
  <div class="deathpanel">
    <h2 id="deathtitle">Dead</h2>
    <p id="deathtext"></p>
    <h3>Who plays next?</h3>
    <div id="deathchoices"></div>
    <div id="deathroster"></div>
  </div>
</div>

<div id="sheetpanel" aria-hidden="true">
  <svg class="corner tl" viewBox="0 0 74 74" fill="none" stroke="currentColor" aria-hidden="true">
    <path d="M2 2h70M2 2v70" stroke-width="1.4"/>
    <path d="M7 7h40M7 7v40" stroke-width=".7"/>
    <path d="M7 30c10 0 16-6 16-16M30 7c0 10-6 16-16 16" stroke-width=".8"/>
    <circle cx="14" cy="14" r="2.6" stroke-width=".9"/>
  </svg>
  <svg class="corner tr" viewBox="0 0 74 74" fill="none" stroke="currentColor" aria-hidden="true">
    <path d="M2 2h70M2 2v70" stroke-width="1.4"/>
    <path d="M7 7h40M7 7v40" stroke-width=".7"/>
    <path d="M7 30c10 0 16-6 16-16M30 7c0 10-6 16-16 16" stroke-width=".8"/>
    <circle cx="14" cy="14" r="2.6" stroke-width=".9"/>
  </svg>
  <svg class="corner bl" viewBox="0 0 74 74" fill="none" stroke="currentColor" aria-hidden="true">
    <path d="M2 2h70M2 2v70" stroke-width="1.4"/>
    <path d="M7 7h40M7 7v40" stroke-width=".7"/>
    <path d="M7 30c10 0 16-6 16-16M30 7c0 10-6 16-16 16" stroke-width=".8"/>
    <circle cx="14" cy="14" r="2.6" stroke-width=".9"/>
  </svg>
  <svg class="corner br" viewBox="0 0 74 74" fill="none" stroke="currentColor" aria-hidden="true">
    <path d="M2 2h70M2 2v70" stroke-width="1.4"/>
    <path d="M7 7h40M7 7v40" stroke-width=".7"/>
    <path d="M7 30c10 0 16-6 16-16M30 7c0 10-6 16-16 16" stroke-width=".8"/>
    <circle cx="14" cy="14" r="2.6" stroke-width=".9"/>
  </svg>
  <div class="sheethead">
    <h1 id="sheetname"></h1>
    <div class="meta" id="sheetmeta"></div>
    <button class="close" id="closesheet">Close  ·  Esc</button>
  </div>
  <div class="tabs" id="sheettabs" role="tablist"></div>
  <div class="sheetbody" id="sheetbody"></div>
</div>

<script>
// The state last drawn. `render` keeps it current: it was `const`, set once at page load
// and never updated, so after switching characters the death panel still announced the
// character you had started the page as — and anything else reading STATE was reading a
// snapshot of a game that had moved on.
let STATE = {{ state_json|safe }};
const $ = s => document.querySelector(s);

function csrf() {
  const m = document.cookie.match(/csrftoken=([^;]+)/);
  return m ? m[1] : "";
}

// --- The roster ----------------------------------------------------------------
// Switching is switching campaigns: one per character, so somebody you come back to is
// where you left them rather than at the start of a new game.
async function openRoster() {
  let d;
  try { d = await (await fetch("/api/characters")).json(); }
  catch (e) { $("#err").textContent = e.message; return; }

  $("#deathtitle").textContent = "Who is playing";
  $("#deathtext").textContent =
    "Switching picks up that character's game where it stopped. The dead stay on the "
    + "roster; they are the reason the next game went the way it did.";
  $("#deathchoices").innerHTML = (d.roster || []).map(e => `
    <button class="pick ${e.current ? "current" : ""}" data-switch="${esc(e.id)}"
            ${e.playable && !e.current ? "" : "disabled"}>
      <b>${esc(e.name)}</b>
      <small>${esc(e.line)} · ${esc(e.hp)} hp${
        e.current ? " · playing now" : e.status === "dead" ? " · dead" : ""}</small>
      ${e.epitaph ? `<em>${esc(e.epitaph)}</em>` : ""}
    </button>`).join("");
  $("#deathroster").innerHTML = `<h3>Somebody new</h3>` + (d.choices || []).map(ch => `
    <button class="pick" data-source="${esc(ch.source)}">
      <b>${esc(ch.name)}</b><small>${esc(ch.line)} · ${ch.hp} hp</small>
    </button>`).join("")
    + `<button class="pick" id="closeroster"><b>Never mind</b>
       <small>carry on with the game in front of you</small></button>`;
  $("#deathveil").classList.add("on");
}

// One listener for every button in the panel. Two of them — one for switching, one for
// starting somebody new — both matched `.pick`, so a click on a roster row fired both:
// it switched campaigns *and* posted /api/character/new with an undefined source, and
// "Never mind" quietly rolled a new character instead of closing the panel.
document.addEventListener("click", async e => {
  const pick = e.target.closest(".pick");
  if (!pick || pick.disabled) return;

  if (pick.id === "closeroster") {
    $("#deathveil").classList.remove("on");
    return;
  }
  const switching = pick.dataset.switch !== undefined;
  pick.disabled = true;
  try {
    render(switching
      ? await post("/api/character/switch", {id: pick.dataset.switch})
      : await post("/api/character/new", {source: pick.dataset.source}));
    $("#deathveil").classList.remove("on");
  } catch (err) { $("#err").textContent = err.message; pick.disabled = false; }
});

// --- Death, and who plays next -------------------------------------------------
function showDeath(d) {
  $("#deathtitle").textContent = (STATE.pc && STATE.pc.name) ? STATE.pc.name : "Dead";
  $("#deathtext").textContent = d.death || "";
  $("#deathchoices").innerHTML = (d.choices || []).map(ch => `
    <button class="pick" data-source="${esc(ch.source)}">
      <b>${esc(ch.name)}</b>
      <small>${esc(ch.line)} · ${ch.hp} hp</small>
      ${ch.notes ? `<em>${esc(ch.notes)}</em>` : ""}
    </button>`).join("");
  const played = (d.roster || []);
  $("#deathroster").innerHTML = played.length ? `<h3>Played before</h3>` + played.map(e => `
    <div class="grave ${e.status === "dead" ? "dead" : ""}">
      <span><b>${esc(e.name)}</b> — ${esc(e.line)}</span>
      <small>${e.status === "dead" ? "died" : e.status}</small>
    </div>`).join("") : "";
  $("#deathveil").classList.add("on");
}

// The death panel's choices are `.pick` buttons too, and the one listener above already
// handles them. This file used to declare a second one here; both fired on every click,
// so picking a character to switch to also posted /api/character/new with an undefined
// source, and the 404 from that was the error the player saw.

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()},
    body: JSON.stringify(body || {}),
  });
  const data = await r.json();
  // 422 is the table pushing a turn back across the table rather than an error: the
  // player said what the world does, which is the GM's half. The text they typed is
  // deliberately left in the box so they can rewrite it.
  if (r.status === 422) { const e = new Error(data.hint); e.hint = true; throw e; }
  if (r.status === 410) { showDeath(data); const e = new Error(""); e.handled = true; throw e; }
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

function render(s) {
  STATE = s;
  // `fresh` marks only the beats that were not on the page a moment ago, because this
  // rebuilds the whole transcript each state: without the gate, every line re-ran its
  // ink-bleed entrance on every turn, which reads as the book flickering rather than
  // being written in.
  const seen = window._beatsSeen || 0;
  $("#story").innerHTML = s.transcript.map((b, i) =>
    `<p class="beat ${b.who === "player" ? "player" : (b.kind || "")}${
      i >= seen ? " fresh" : ""}">${esc(b.text)}</p>`
  ).join("");
  window._beatsSeen = s.transcript.length;
  $("#story").scrollTop = $("#story").scrollHeight;

  const pc = s.pc;
  if (pc) {
    // Temporary hit points scale against hp_max, so 6 temp on a 9 hp character reads as
    // two thirds of a bar again — which is what they are worth.
    const temp = pc.temp_hp || 0;
    const pct = Math.max(0, Math.round(100 * pc.hp / pc.hp_max));
    const tpct = Math.max(0, Math.round(100 * temp / pc.hp_max));
    // Non-lethal is shown against its own threshold rather than against hp_max. The two
    // are not the same line and for a Blood Bender they are rarely close: the class buys
    // its abilities with non-lethal damage and counts temporary hit points before it
    // drops, so the number that matters moves as their wards go up and down.
    const nl = pc.nonlethal || 0;
    const nlLimit = pc.nonlethal_threshold ?? pc.hp;
    $("#sheet").innerHTML = `
      <div class="name">${esc(pc.name)}</div>
      <div class="sub">${esc(pc.heritage)} ${esc(pc.class)} · ${esc(pc.race)}</div>
      ${s.scene.biome ? `<div class="biome" title="${esc(s.scene.biome_describe)}">
        ${esc(s.scene.location)} · ${esc(s.scene.biome)} · ${fmtClock(s.scene.clock_minutes)}</div>` : ""}
      <div class="bar"><i style="width:${pct}%"></i>${
        temp ? `<i class="temp" style="width:${tpct}%"></i>` : ""}</div>
      <div class="row"><span>Hit points</span><span>${pc.hp} / ${pc.hp_max}${
        temp ? ` <small>+${temp} temp</small>` : ""}</span></div>
      ${nl ? `<div class="row${nl >= nlLimit ? " danger" : ""}"><span>Non-lethal</span>
        <span>${nl} <small>of ${nlLimit}</small></span></div>` : ""}
      ${(pc.dr && pc.dr.length)
        ? `<div class="row"><span>Damage reduction</span><span>${
             pc.dr.map(esc).join(", ")}</span></div>` : ""}
      ${(pc.pools || []).map(p => `<div class="row"><span>${esc(title(p.id))}</span>
        <span>${p.current} <small>of ${p.max}</small>${
          p.ready ? "" : ` <small class="cd">${p.cooldown_left}r</small>`}</span></div>`).join("")}
      <div class="row"><span>Armour class</span><span>${pc.ac}</span></div>
      <h2>Abilities</h2>
      <div class="grid">${Object.entries(pc.abilities).map(([k, v]) => {
        // A 10 that used to be a 14 is not the same as a 10.
        const hurt = (pc.ability_damage || {})[k] || 0;
        return `<div class="cell${hurt ? " hurt" : ""}"><b>${k}</b><span>${v} <small>(${
          sign(Math.floor((v-10)/2))})</small></span>${
          hurt ? `<em>-${hurt}</em>` : ""}</div>`;
      }).join("")}</div>
      ${(pc.satchel && pc.satchel.length) ? `<h2>Satchel</h2>${
        pc.satchel.map(i => `<div class="row"><span>${esc(i.name)}</span><span>${
          i.count}</span></div>`).join("")}` : ""}
      ${(pc.world_classes && pc.world_classes.length) ? `<h2>World classes</h2>${
        pc.world_classes.map(w => `
          <div class="row"><span>${esc(w.name)} ${w.level}</span><span>${
            w.missing ? "<small>unknown track</small>"
            : w.to_next ? `<small>${w.to_next.need} to next</small>`
            : "<small>mastered</small>"}</span></div>
          ${w.missing ? "" : `<div class="sub" style="margin:-4px 0 8px">${
            esc(w.max_tier)} · ${w.known} recipe${w.known === 1 ? "" : "s"}</div>`}
        `).join("")}` : ""}
      <h2>Saves</h2>
      ${Object.entries(pc.saves).map(([k, v]) =>
        `<div class="row"><span>${{fort:"Fortitude",ref:"Reflex",will:"Will"}[k]}</span><span>${sign(v)}</span></div>`
      ).join("")}
      <h2>Skills</h2>
      ${Object.entries(pc.skills).map(([k, v]) =>
        `<div class="row"><span>${title(k)}</span><span>${sign(v)}</span></div>`
      ).join("")}
      <h2>Feats</h2>
      <div class="sub">${pc.feats.map(esc).join(", ")}</div>
      <button class="opensheet" id="opensheet">Full character sheet</button>
      <a class="opensheet" href="/craft/">Crafting bench</a>
      <a class="opensheet" href="/">Worlds &amp; characters</a>
      <button class="opensheet" id="openroster">Who is playing</button>`;
    $("#opensheet").onclick = openSheet;
    $("#openroster").onclick = openRoster;
  }

  // Turn order, only while a fight is on. Without it the player cannot tell whose turn
  // it is or who is still standing, which makes combat unplayable however correct the
  // maths underneath is.
  $("#order").innerHTML = s.scene.in_encounter ? `
    <h2>Round ${s.scene.round}</h2>
    ${s.scene.initiative.map(i => `
      <div class="who${i.up ? " up" : ""}${i.out ? " out" : ""}">
        <span>${i.up ? "▸ " : ""}${esc(i.name)}</span>
        <small>${i.out ? "down" : i.score}</small>
      </div>`).join("")}` : "";

  renderMap(s);
  renderSuggestions(s);

  $("#board").innerHTML = s.scene.actors.map(a =>
    `<div class="who"><span>${esc(a.name)} <small>${a.ref}</small></span>
     <small>${a.hp}/${a.hp_max}${a.conditions.length ? " · " + a.conditions.join(", ") : ""}</small></div>`
  ).join("") + `<div class="sub" style="margin-top:8px">${esc(s.scene.location)}</div>`;

  renderRolls(s.log);

  if (s.awaiting) showPopup(s.awaiting); else $("#veil").classList.remove("on");
}

// --- what the GM offered -----------------------------------------------------------
//
// Suggestions, not a menu. Clicking one puts the words in the box rather than sending
// them, so the player can change their mind or add to it — a chip that fired the turn
// straight off would quietly turn a nudge into the only three things you can do.
function renderSuggestions(s) {
  const box = $("#suggestions");
  const offered = (s.suggestions || []);
  // Hidden entirely while a roll is pending: the only thing to do then is answer it.
  if (!offered.length || s.awaiting) { box.innerHTML = ""; return; }
  box.innerHTML = offered.map(t =>
    `<button type="button" class="sugg">${esc(t)}</button>`).join("");
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".sugg");
  if (!chip) return;
  const input = $("#input");
  input.value = chip.textContent;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
});

// --- the map -------------------------------------------------------------------------
//
// Drawn as an SVG rather than a grid of divs: a 20x20 map is 400 elements either way, and
// the SVG version scales to the panel without every square needing its own size in pixels.
//
// The reachable squares are computed by the engine and sent down, never worked out here.
// Two implementations of the alternating diagonal rule would eventually disagree, and the
// one on screen is the one the player would believe.
function renderMap(s) {
  const g = s.scene.grid;
  if (!g) { $("#mapwrap").innerHTML = ""; return; }

  const CELL = 18;
  const reach = new Map((g.reachable || []).map(([c, r, cost]) => [`${c},${r}`, cost]));
  const parts = [];

  for (const [c, r] of g.difficult) parts.push(cell(c, r, "difficult"));
  for (const [c, r] of g.obscuring) parts.push(cell(c, r, "obscuring"));
  for (const [c, r] of g.blocked) parts.push(cell(c, r, "blocked"));
  for (const [key, cost] of reach) {
    const [c, r] = key.split(",").map(Number);
    parts.push(cell(c, r, "reach", `<title>${cost} ft</title>`));
  }

  // Grid lines last of the terrain, so they sit over the fills and under the tokens.
  for (let c = 0; c <= g.width; c++)
    parts.push(`<line class="rule" x1="${c * CELL}" y1="0" x2="${
      c * CELL}" y2="${g.height * CELL}"/>`);
  for (let r = 0; r <= g.height; r++)
    parts.push(`<line class="rule" x1="0" y1="${r * CELL}" x2="${
      g.width * CELL}" y2="${r * CELL}"/>`);

  for (const a of s.scene.actors) {
    if (!a.at) continue;
    const [c, r] = a.at;
    const n = a.squares || 1;
    const down = a.hp <= 0;
    parts.push(`<rect class="token${a.is_pc ? " pc" : ""}${down ? " down" : ""}"
      x="${c * CELL + 2}" y="${r * CELL + 2}"
      width="${n * CELL - 4}" height="${n * CELL - 4}" rx="3">
      <title>${esc(a.name)} — ${a.hp}/${a.hp_max}</title></rect>`);
    parts.push(`<text class="tok" x="${(c + n / 2) * CELL}" y="${
      (r + n / 2) * CELL + 4}">${esc(a.name.slice(0, 1).toUpperCase())}</text>`);
  }

  $("#mapwrap").innerHTML = `<h2>The ground</h2>
    <svg id="map" viewBox="0 0 ${g.width * CELL} ${g.height * CELL}"
         preserveAspectRatio="xMidYMid meet">${parts.join("")}</svg>
    ${g.speed ? `<div class="sub maplegend">${
      reach.size} squares within ${g.speed} ft</div>` : ""}`;

  function cell(c, r, cls, inner = "") {
    return `<rect class="${cls}" x="${c * CELL}" y="${r * CELL}" width="${
      CELL}" height="${CELL}">${inner}</rect>`;
  }
}

function renderRolls(log) {
  const rolls = [];
  for (const entry of log) {
    for (const o of (entry.outcomes || [])) {
      for (const r of (o.rolls || [])) {
        rolls.push({r, o});
      }
    }
  }
  // Only the player's own rolls ever appear here. The server already strips everyone
  // else's before the state leaves it, so there is nothing to filter and nothing to
  // find in the page source.
  $("#rolls").innerHTML = rolls.slice(-8).reverse().map(({r, o}) => `
    <div class="who" style="display:block">
      <div style="display:flex;justify-content:space-between">
        <span>${esc(r.label || o.op)}</span>
        <span style="color:var(--accent)">${r.total}${
          // Only a d20 is compared against a DC or an AC. Showing the outcome's target
          // beside a damage roll read as "6 vs 10", which looks like a miss.
          o.dc && o.dc.value != null && r.die === "1d20" ? " vs " + o.dc.value : ""}</span>
      </div>
      <small>${r.raw}${
        r.modifiers.map(m => ` ${sign(m.value)} ${esc(m.source)}`).join("")}</small>
    </div>`).join("") || `<div class="sub">Nothing rolled yet.</div>`;
}

function showPopup(p) {
  const terms = p.breakdown.map(m =>
    `<div class="row"><span>${esc(m.source)}</span><span>${sign(m.value)}</span></div>`).join("");
  // The die is not always a d20: damage asks for a pool total, so the bounds come from
  // the prompt rather than being hardcoded.
  const lo = p.min != null ? p.min : 1, hi = p.max != null ? p.max : 20;
  const die = p.die || "1d20";
  $("#popup").innerHTML = `
    <h3>${esc(p.label)}</h3>
    <div class="because">${esc(p.because || "")}</div>
    <input class="dieface" id="face" type="number" min="${lo}" max="${hi}"
           placeholder="${esc(die)}">
    <div class="terms">
      <div class="row"><span>Roll</span><span>${esc(die)}${
        lo === hi ? "" : ` (${lo}–${hi})`}</span></div>
      ${terms}
      <div class="row total"><span>Your modifier</span><span>${sign(p.modifier)}</span></div>
      ${p.dc != null ? `<div class="row"><span>Beat</span><span>${p.dc}</span></div>` : ""}
    </div>
    <div class="acts">
      <button id="submitroll">Roll it myself</button>
      <button class="ghost" id="autoroll">Let the table roll</button>
    </div>`;
  $("#veil").classList.add("on");
  $("#face").focus();
  $("#submitroll").onclick = () => {
    const v = parseInt($("#face").value, 10);
    if (!(v >= lo && v <= hi)) { $("#face").focus(); return; }
    sendRoll(v);
  };
  $("#autoroll").onclick = () => sendRoll(null);
  $("#face").onkeydown = e => { if (e.key === "Enter") $("#submitroll").click(); };
}

async function sendRoll(face) {
  $("#veil").classList.remove("on");
  busy(true);
  try { render(await post("/api/roll", {face})); }
  catch (e) { $("#err").textContent = e.message; }
  finally { busy(false); }
}

$("#sayform").onsubmit = async e => {
  e.preventDefault();
  const text = $("#input").value.trim();
  if (!text) return;
  $("#err").textContent = "";
  $("#err").className = "";
  busy(true);
  try {
    const s = await post("/api/say", {text});
    render(s);
    $("#input").value = "";          // cleared only once the turn was taken
    if (s.ended) showDeath(s);
  }
  catch (err) {
    if (!err.handled) $("#err").textContent = err.message;
    if (err.hint) $("#err").className = "hint";
  }
  finally { busy(false); }
};

async function openSheet() {
  $("#sheetpanel").classList.add("on");
  $("#sheetpanel").setAttribute("aria-hidden", "false");
  $("#sheetbody").innerHTML = `<div class="empty">Reading the sheet…</div>`;
  try {
    const r = await fetch("/api/sheet");
    SHEET = await r.json();
    if (!r.ok) throw new Error(SHEET.error || "could not read the sheet");
  } catch (e) {
    $("#sheetbody").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }
  if (!$("#sheethead-sigil")) {
    $(".sheethead").insertAdjacentHTML("afterbegin",
      `<span id="sheethead-sigil">${SIGIL_SVG}</span>`);
  }
  $("#sheetname").textContent = SHEET.identity.name;
  $("#sheetmeta").textContent =
    [SHEET.identity.heritage, SHEET.identity.race, SHEET.identity.class,
     SHEET.identity.size].filter(Boolean).join(" · ");
  $("#sheettabs").innerHTML = TABS.map(([k, label]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${k === SHEET_TAB}">${label}</button>`
  ).join("");
  $("#sheettabs").querySelectorAll("button").forEach(b => {
    b.onclick = () => { SHEET_TAB = b.dataset.tab; drawSheet(); };
  });
  drawSheet();
}

function closeSheet() {
  $("#sheetpanel").classList.remove("on");
  $("#sheetpanel").setAttribute("aria-hidden", "true");
}

function drawSheet() {
  $("#sheettabs").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === SHEET_TAB)));
  const entry = TABS.find(t => t[0] === SHEET_TAB);
  $("#sheetbody").innerHTML = entry ? entry[2](SHEET) : "";
  $("#sheetbody").scrollTop = 0;
}

            ${k.trained_only ? '<span class="pill">trained only</span>' : ""}
            <div class="why">${esc(k.ability.toUpperCase())}${k.armour_check ? " · armour check applies" : ""}</div></td>
        <td class="num">${k.usable ? sign(k.total) : "—"}</td>
        <td class="num">${k.rank || ""}</td>
        <td class="why">${k.usable
          ? k.terms.map(m => `${sign(m.value)} ${esc(m.source)}`).join(", ")
          : "cannot be attempted untrained"}</td>
      </tr>`).join("")}
    </table>
  </div>`;
}

// --- Feats ---
// The browse pane's last result, so a redraw does not lose it and typing does not refetch
// on every keystroke.
let FEAT_RESULTS = null;
let FEAT_QUERY = "";

function tabFeats(s) {
  return `<div class="cols">
    <div class="card">
      <h3>Feats</h3>
      <table class="sheet">
        <tr><th>Feat</th><th>What it does</th></tr>
        ${s.feats.map(f => `<tr class="${f.applied ? "" : "dim"}">
          <td><b>${esc(f.name)}</b>${
            f.applied ? "" :
            f.known ? ' <span class="pill">not computed</span>'
                    : ' <span class="pill warn">unknown feat</span>'}
            ${f.prerequisites ? `<small class="prereq">${esc(f.prerequisites)}</small>` : ""}</td>
          <td class="why">${esc(f.effect)}</td>
        </tr>`).join("") || `<tr><td colspan="2" class="empty">None.</td></tr>`}
      </table>
      <div class="why" style="margin-top:10px">
        “Not computed” means the engine carries the feat and its text but applies no
        number for it — sixteen feats have arithmetic the engine owns, and the rest are
        yours to invoke.
      </div>
    </div>
    <div class="card">
      <h3>Browse</h3>
      <input type="search" id="featq" placeholder="Search 1,474 feats…"
             value="${esc(FEAT_QUERY)}" autocomplete="off">
      <div id="featresults">${featResults()}</div>
    </div>
  </div>`;
}

function featResults() {
  if (FEAT_RESULTS === null) {
    return `<div class="empty">Type to search, or see what you qualify for.</div>`;
  }
  if (!FEAT_RESULTS.length) return `<div class="empty">Nothing matches.</div>`;
  return FEAT_RESULTS.map(f => {
    // Three states, not two: "you qualify", "you are short by something specific", and
    // "this asks for something the sheet cannot check". Collapsing the last into a no
    // would be a lie about a feat the player may well be entitled to.
    const state = f.held ? ["held", "have it"]
      : f.qualifies ? ["ok", "can take"]
      : f.unmet.length ? ["no", "needs " + f.unmet.join(", ")]
      : ["maybe", "ask your GM: " + f.unknown.join("; ")];
    return `<div class="featrow ${state[0]}">
      <div><b>${esc(f.name)}</b>
        <small>${esc(f.types.join(", "))}${f.source ? " · " + esc(f.source) : ""}</small></div>
      <div class="why">${esc(f.benefit || f.description)}</div>
      <div class="verdict ${state[0]}">${esc(state[1])}</div>
    </div>`;
  }).join("");
}

let featTimer = null;
document.addEventListener("input", e => {
  const box = e.target.closest("#featq");
  if (!box) return;
  FEAT_QUERY = box.value;
  clearTimeout(featTimer);
  // Debounced: 1,474 feats is fast to filter and slow to re-render on every keystroke.
  featTimer = setTimeout(async () => {
    try {
      const r = await fetch(`/api/feats?q=${encodeURIComponent(FEAT_QUERY)}&limit=40`);
      FEAT_RESULTS = (await r.json()).feats;
    } catch (err) {
      FEAT_RESULTS = [];
    }
    const box2 = $("#featresults");
    if (box2) box2.innerHTML = featResults();
  }, 180);
});

// --- Spells ---
// --- Spells ---
// Slots across the top, the book underneath. The DC sits on the slot row rather than on
// each spell, because it is a property of the level and repeating it against forty spells
// is forty chances to read the wrong one.
function tabSpells(s) {
  const sp = s.spells;
  if (!sp) {
    return tabEmpty(`${esc(s.identity.name)} does not cast spells.`);
  }

  const byLevel = new Map();
  for (const k of sp.known) {
    const lvl = k.level === null || k.level === undefined ? "?" : k.level;
    if (!byLevel.has(lvl)) byLevel.set(lvl, []);
    byLevel.get(lvl).push(k);
  }

  const slots = sp.slots.map(sl => `
    <div class="t"><span>Level ${sl.level}${
      sl.level > 0 ? ` <small>DC ${sl.dc}</small>` : ""}</span>
      <b class="${sl.left ? "" : "spent"}">${sl.left} <small>of ${sl.max}</small></b></div>`
  ).join("");

  const book = [...byLevel.entries()].sort((a, b) => (a[0] === "?") - (b[0] === "?")
                                                     || a[0] - b[0]).map(([lvl, list]) => `
    <h3>Level ${lvl}</h3>
    ${list.map(k => `
      <div class="spellrow${k.missing ? " missing" : ""}">
        <div class="spellname">
          <b>${esc(k.name)}</b>
          ${k.missing
            ? `<small>not in this build</small>`
            : `<small>${esc([k.school, k.range, k.duration].filter(Boolean).join(" · "))}${
                 k.save ? ` · ${esc(k.save)}` : ""}</small>`}
        </div>
        ${k.missing ? "" : `
          <div class="prep">
            <button class="prepbtn" data-spell="${esc(k.id)}" data-action="unprepare"
                    ${k.prepared ? "" : "disabled"} title="Unprepare">−</button>
            <span class="prepcount${k.prepared ? " has" : ""}">${k.prepared}</span>
            <button class="prepbtn" data-spell="${esc(k.id)}" data-action="prepare"
                    title="Prepare">+</button>
          </div>`}
      </div>`).join("")}`).join("");

  return `<div class="cols">
    <div class="card">
      <h3>Slots</h3>
      <div class="terms">${slots || tabEmpty("No slots at this level.")}</div>
      <div class="terms" style="margin-top:10px">
        <div class="t"><span>Caster level</span><b>${sp.caster_level}</b></div>
        <div class="t"><span>Casting ability</span><b>${esc(sp.ability.toUpperCase())}</b></div>
        <div class="t"><span>Highest spell</span><b>Level ${sp.highest}</b></div>
      </div>
      ${sp.note ? `<div class="sub" style="margin-top:10px">${esc(sp.note)}</div>` : ""}
    </div>
    <div class="card">
      <h3>${sp.kind === "prepared" ? "Prepared today" : "Known"}</h3>
      ${book || tabEmpty("Nothing in the book yet.")}
    </div>
  </div>`;
}

// --- Equipment ---
// The body-slot page: a figure with the slots arranged down either side, roughly where
// each thing is worn. Empty slots are drawn as blanks rather than hidden — showing what
// is *not* filled is the whole reason for laying it out on a body.
function slotBox(sl, side) {
  const canAdd = sl.items.length < sl.max;
  return `
    <div class="slot ${side}" data-slot="${sl.key}">
      ${medallion(sl.key)}
      <div class="slothead">
        <span>${esc(sl.label)}</span>
        ${canAdd ? `<button class="addslot" data-slot="${sl.key}" title="Add another ${esc(sl.label.toLowerCase())} slot">+</button>` : ""}
      </div>
      ${sl.items.map(it => `
        <div class="slotrow${it.empty ? " isempty" : ""}${it.beyond_rules ? " beyond" : ""}">
          <input class="slotinput" data-slot="${sl.key}" data-index="${it.index}"
                 value="${esc(it.item || "")}" placeholder="empty"
                 ${sl.derived ? "disabled" : ""}>
          ${sl.items.length > 1 && !sl.derived
            ? `<button class="delslot" data-slot="${sl.key}" data-index="${it.index}" title="Remove this slot">×</button>`
            : ""}
        </div>`).join("")}
      <div class="slotholds">${esc(sl.holds)}${
        sl.max > sl.rules_limit ? ` · ${sl.rules_limit} work${sl.rules_limit === 1 ? "s" : ""} at once` : ""}</div>
    </div>`;
}

function tabEquipment(s) {
  const e = s.equipment, sl = e.slots;
  return `
    <div class="bodylayout">
      <div class="slotcol">${sl.left.map(x => slotBox(x, "left")).join("")}</div>
      <div class="figure">${FIGURE_SVG}
        <div class="figcap">${sl.filled} of ${sl.total} slots filled</div>
      </div>
      <div class="slotcol">${sl.right.map(x => slotBox(x, "right")).join("")}</div>
    </div>

    <div class="cols" style="margin-top:26px">
      <div class="card">
        <h3>Armour and shield</h3>
        <table class="sheet">
          <tr><th>Item</th><th>AC</th><th>Max Dex</th><th>Check penalty</th></tr>
          <tr><td>${esc(e.armour.name)}</td><td class="num">${sign(e.armour.ac)}</td>
              <td class="num">${e.armour.max_dex > 90 ? "—" : sign(e.armour.max_dex)}</td>
              <td class="num">${e.armour.acp || "—"}</td></tr>
          <tr><td>${esc(e.shield.name)}</td><td class="num">${sign(e.shield.ac)}</td>
              <td class="num">—</td><td class="num">${e.shield.acp || "—"}</td></tr>
        </table>
        <div class="why" style="margin-top:10px">
          Total armour check penalty ${e.armour_check_penalty || 0}, applied to
          Acrobatics, Climb, Disable Device, Escape Artist, Fly, Ride, Sleight of Hand,
          Stealth and Swim. The armour and shield slots are filled from here, so there
          is only one place that says what you are wearing.
        </div>
      </div>
      <div class="card">
        <h3>Carried weapons</h3>
        ${e.weapons.length
          ? `<ul style="margin:0;padding-left:18px">${e.weapons.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`
          : `<div class="empty">Nothing.</div>`}
        <div class="why" style="margin-top:10px">
          Slots record what is worn. Their effects are not applied to your numbers yet —
          a ring of protection here will not move your AC until magic items are modelled.
          Gear, coin and encumbrance are not tracked either.
        </div>
      </div>
    </div>`;
}

async function slotAction(payload) {
  try {
    SHEET = await post("/api/slots", payload);
    drawSheet();
  } catch (e) {
    alert(e.message);
  }
}

// Delegated so the handlers survive every redraw.
document.addEventListener("click", e => {
  const add = e.target.closest(".addslot");
  if (add) return slotAction({action: "add", slot: add.dataset.slot});
  const del = e.target.closest(".delslot");
  if (del) return slotAction({action: "remove", slot: del.dataset.slot,
                              index: Number(del.dataset.index)});
  const prep = e.target.closest(".prepbtn");
  if (prep) return prepareSpell(prep.dataset.spell, prep.dataset.action);
});

// The server refuses over-preparing and casting what was never prepared; the page only
// asks. Checking the slot arithmetic here as well would be a second implementation of a
// rule, and the one on screen is the one the player would believe.
async function prepareSpell(spell, action) {
  try {
    SHEET = await post("/api/spells/prepare", {action, spell});
    drawSheet();
  } catch (e) {
    alert(e.message);
  }
}
document.addEventListener("change", e => {
  const input = e.target.closest(".slotinput");
  if (input) slotAction({action: "set", slot: input.dataset.slot,
                         index: Number(input.dataset.index), item: input.value});
});

// --- Background ---
function tabBackground(s) {
  const b = s.background, i = s.identity;
  return `<div class="cols">
    <div class="card">
      <h3>In the world</h3>
      <div class="terms">
        <div class="t"><span>People</span><b>${esc(b.heritage || "—")}</b></div>
        <div class="t"><span>World Bible id</span><b>${esc(i.world_people_id || "—")}</b></div>
      </div>
      <div class="why" style="margin-top:10px">
        The rules race and the world's people are different things, and the sheet
        carries both. ${esc(i.heritage || "This people")} is who
        ${esc(i.name)} is in the world; ${esc(i.race)} is what the rules use.
      </div>
    </div>
    <div class="card">
      <h3>Notes</h3>
      ${b.notes ? `<div style="white-space:pre-wrap">${esc(b.notes)}</div>`
                : `<div class="empty">None.</div>`}
      <h3 style="margin-top:16px">Rules content</h3>
      <div class="why">
        The Pathfinder rules this app runs on — spells, creatures, feats, weapons and the
        tables behind them — are Open Game Content under the
        <a href="/licence" target="_blank" rel="noopener">Open Game Licence v1.0a</a>,
        which section 10 requires travel with it. This project is not published by,
        endorsed by, or affiliated with Paizo Inc.
      </div>
    </div>
  </div>`;
}

$("#closesheet").onclick = closeSheet;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheetpanel").classList.contains("on")) closeSheet();
});

function busy(on) {
  $("#busy").classList.toggle("on", on);
  $("#send").disabled = on;
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sign = n => (n >= 0 ? "+" : "") + n;
const title = s => s.replace(/\b\w/g, c => c.toUpperCase());

// The ember under the cursor. One delegated listener feeds --mx/--my to whatever
// interactive surface the pointer is inside, and the CSS paints a warm radial there.
// Delegated because the buttons are rebuilt on every render — a per-element listener
// would be lost each time, and hundreds of listeners for one glow is the wrong trade.
document.addEventListener("pointermove", e => {
  const t = e.target.closest("button, .sugg, .pick");
  if (!t) return;
  const r = t.getBoundingClientRect();
  t.style.setProperty("--mx", `${e.clientX - r.left}px`);
  t.style.setProperty("--my", `${e.clientY - r.top}px`);
}, { passive: true });

// Elapsed campaign time, from the engine's own clock. Elapsed rather than a time of day,
// because the engine has no notion of when the campaign started — "day 2, hour 3" is a
// fact the clock can state, and "9 in the morning" would be an invention. The playtest
// foraged for eight real hours and slept a full night and the page never showed a minute
// of it; the number was in the payload all along and nothing rendered it.
const fmtClock = mins => {
  mins = mins || 0;
  const day = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  if (!day && !h) return m ? `${m}m in` : "the first hour";
  const hm = m ? `${h}h ${m}m` : `${h}h`;
  return day ? `day ${day + 1}, ${hm} in` : `${hm} in`;
};

render(STATE);
</script>
</body>
</html>
