{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class builder — Pathfinder GM</title>
<style>
  /* The bench's own vocabulary, not a second one. Everything below is the craft page's
     and the shelf's: the same two faces, the same palette, the same leather writing
     surface, the same tabs, the same alarm and confirm colours. A page that authors a
     class should not look like a different application from the page that brews a tea. */
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 400; font-display: swap;
    src: local("Cinzel"), url("{% static 'fonts/Cinzel-Regular.woff2' %}") format("woff2");
  }
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 600; font-display: swap;
    src: local("Cinzel SemiBold"), url("{% static 'fonts/Cinzel-SemiBold.woff2' %}") format("woff2");
  }
  :root {
    --display: "Cinzel", "Trajan Pro", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --body: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --bg: #0f0d0b; --panel: #17130f; --edge: #3a2f22; --ink: #e6dcc6;
    --dim: #8e816a; --accent: #c9a86a; --alarm: #a8443a;
    --gold: #d9c08a; --gold-dim: #7a6543; --sunk: #0c0a08;
    --brew: #6fcf8f; --brew-dim: #2f5f42;
  }
  * { box-sizing: border-box; }
  body {
    /* Fixed frame, scrolling panes — the rule the table, the bench and the shelf all
       needed. A grid child will not shrink below its content without `min-height: 0`. */
    margin: 0; color: var(--ink); font: 16px/1.6 var(--body);
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    background:
      linear-gradient(rgba(10, 8, 6, .40), rgba(7, 5, 4, .58)),
      url("{% static 'img/grimoire-leather.jpg' %}") center / cover no-repeat fixed #0d0b09;
  }

  /* --- banner ------------------------------------------------------------------ */
  header {
    border-bottom: 1px solid var(--gold-dim); padding: 0 30px;
    background:
      linear-gradient(rgba(14, 10, 7, .22), rgba(8, 6, 4, .44)),
      url("{% static 'img/card-leather.jpg' %}") #1d1710;
    background-size: auto, 340px auto;
    display: flex; align-items: flex-end; gap: 26px; flex-wrap: wrap;
  }
  h1 {
    margin: 16px 0; color: var(--gold); white-space: nowrap;
    font: 400 27px/1 var(--display); letter-spacing: .09em; font-variant: small-caps;
  }
  h1 small { display: block; margin-top: 6px; color: var(--dim);
             font: italic 12px/1 var(--body); letter-spacing: .02em;
             font-variant: normal; }
  .who {
    margin-bottom: 17px; color: var(--gold); font: 400 15px/1 var(--display);
    letter-spacing: .06em; font-variant: small-caps;
  }
  .who span { color: var(--dim); font: italic 12px/1 var(--body);
              font-variant: normal; letter-spacing: 0; }
  .back {
    margin-left: auto; margin-bottom: 18px; color: var(--dim); text-decoration: none;
    font: 14px/1 var(--body); border-bottom: 1px solid transparent; white-space: nowrap;
  }
  .back:hover { color: var(--accent); border-bottom-color: var(--gold-dim); }

  /* --- the strip that opens and keeps a class --------------------------------- */
  .strip {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 30px; border-bottom: 1px solid #2b2319;
    background: linear-gradient(rgba(20, 15, 9, .35), rgba(10, 8, 5, .55));
  }
  .strip label { color: var(--dim); font: 400 12px/1 var(--display);
                 letter-spacing: .12em; font-variant: small-caps; }
  .strip .grow { flex: 1; }
  .strip select {
    padding: 6px 9px; font: 13px var(--body); color: var(--ink);
    background: var(--sunk); border: 1px solid var(--edge); border-radius: 2px;
    max-width: 250px;
  }
  .strip select:focus { outline: none; border-color: var(--gold-dim); }
  #saved { color: var(--dim); font: italic 12.5px/1.4 var(--body); }
  #saved.done { color: var(--brew); font-style: normal; }

  button.quiet {
    cursor: pointer; font: 400 13px/1 var(--display); letter-spacing: .08em;
    font-variant: small-caps; padding: 8px 15px; border-radius: 2px;
    color: var(--gold); background: linear-gradient(#2a2114, #1a140c);
    border: 1px solid var(--gold-dim);
  }
  button.quiet:hover:not(:disabled) { border-color: var(--accent); color: #f0dcae; }
  button.quiet:disabled { opacity: .35; cursor: not-allowed; }
  button.go {
    cursor: pointer; font: 400 15px/1 var(--display); letter-spacing: .1em;
    font-variant: small-caps; padding: 10px 22px; border-radius: 2px; color: var(--brew);
    background: linear-gradient(#1f3327, #16241c); border: 1px solid var(--brew-dim);
  }
  button.go:hover { border-color: var(--brew); color: #b6f0ca; }
  .mini {
    background: linear-gradient(#22190f, #150f09); border: 1px solid var(--edge);
    border-radius: 2px; padding: 4px 10px; cursor: pointer; color: var(--gold);
    font: 400 12px/1.3 var(--display); letter-spacing: .05em; font-variant: small-caps;
  }
  .mini:hover { border-color: var(--accent); color: #f0dcae; }
  .mini.drop { color: var(--dim); padding: 2px 8px; }
  .mini.drop:hover { border-color: var(--alarm); color: #d9a49c; }
  .mini.add { border-style: dashed; }
  .mini.add:hover { border-style: solid; }

  /* --- the rail of sections, which is the craft page's tabs stood on end ------- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 246px 1fr;
         gap: 26px; padding: 18px 30px 0; }
  nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
        padding-bottom: 30px; }
  .tab {
    background: linear-gradient(#171209, #100d08); color: var(--dim); cursor: pointer;
    border: 1px solid var(--edge); border-right: none; padding: 9px 14px;
    border-radius: 3px 0 0 3px; font: 400 15px/1.2 var(--display);
    letter-spacing: .06em; font-variant: small-caps; text-align: left;
    position: relative; left: 1px; display: flex; align-items: center; gap: 8px;
  }
  .tab:hover:not(.on) { color: var(--ink); }
  .tab.on {
    color: var(--gold);
    background:
      linear-gradient(rgba(20, 15, 9, .05), rgba(12, 9, 6, .22)),
      url("{% static 'img/card-leather.jpg' %}") #241d15;
    background-size: auto, 340px auto;
    border-color: var(--gold-dim); box-shadow: inset 2px 0 0 rgba(217,192,138,.22);
  }
  .tab .grow { flex: 1; }
  /* A section with something wrong in it, in the alarm colour the bench already uses
     for a chain it will not make — so a refusal reads the same wherever it comes from. */
  .tab .badge {
    background: rgba(110,31,31,.35); border: 1px solid #6b322a; color: #d9a49c;
    border-radius: 9px; padding: 0 7px; font: 600 11px/1.6 var(--body);
    letter-spacing: 0; font-variant: normal;
  }
  .railhead {
    margin: 16px 0 5px; color: var(--gold); font: 400 11px/1.4 var(--display);
    letter-spacing: .14em; font-variant: small-caps; padding: 0 0 5px 2px;
    border-bottom: 1px solid #2b2319;
  }
  .railhead em { display: block; color: var(--dim); font: italic 10.5px/1.4 var(--body);
                 letter-spacing: 0; font-variant: normal; margin-top: 3px; }

  /* --- the writing surface ------------------------------------------------------
     A leather page, not a bound cover: the same treatment the effect builder and the
     forge use, and for the reason stated there — a form is a page in the book, so it
     takes the grain and the gold edge but none of the ironmongery. */
  .leaf {
    overflow-y: auto; margin-bottom: 0; padding: 20px 26px 60px;
    background:
      linear-gradient(rgba(16, 12, 8, .04), rgba(8, 6, 4, .20)),
      url("{% static 'img/card-leather.jpg' %}") #241d15;
    background-size: auto, 400px auto;
    border: 1px solid rgba(201, 162, 39, .25); border-radius: 3px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 230, 150, .06);
  }
  h2.sect {
    margin: 0 0 4px; color: var(--gold); font: 400 20px/1.2 var(--display);
    letter-spacing: .1em; font-variant: small-caps; padding-bottom: 7px;
    border-bottom: 1px solid #2b2319;
  }
  h3.sub {
    margin: 20px 0 9px; color: var(--gold); font: 400 13px/1 var(--display);
    letter-spacing: .12em; font-variant: small-caps; padding-bottom: 5px;
    border-bottom: 1px solid #2b2319;
  }
  .note { color: var(--dim); font: italic 14px/1.6 var(--body); margin: 9px 0 18px; }

  /* --- one field --------------------------------------------------------------- */
  .field { margin: 0 0 17px; }
  .field > label, .kvhead {
    display: block; color: var(--gold); font: 400 13px/1.5 var(--display);
    letter-spacing: .08em; font-variant: small-caps;
  }
  .field .req { color: var(--accent); }
  .field .help { color: var(--dim); font: italic 12.5px/1.5 var(--body);
                 margin: 1px 0 6px; }
  .field .help i { color: var(--gold-dim); font-style: italic; }
  /* The half of this page that is the point: which engine mechanism reads the value,
     or the honest admission that nothing does. Quiet, monospace, always there. */
  .consumer {
    margin-top: 4px; color: var(--gold-dim);
    font: 11px/1.4 ui-monospace, Consolas, monospace;
  }
  .consumer.none { color: #7a6a5a; font-style: italic;
                   font-family: var(--body); font-size: 11.5px; }

  input, textarea, select {
    width: 100%; padding: 7px 10px; font: 14px var(--body); color: var(--ink);
    background: linear-gradient(var(--sunk), #14100c); border: 1px solid #2e251a;
    border-radius: 2px; box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 72px; resize: vertical; line-height: 1.55; }
  input[type=checkbox] { width: auto; box-shadow: none; accent-color: #c9a86a; }

  /* --- the validation banner --------------------------------------------------- */
  #problems {
    border: 1px solid #4a2620; background: rgba(110,31,31,.14);
    border-left: 3px solid var(--alarm); border-radius: 2px;
    padding: 11px 15px; margin: 0 0 18px; color: #d08a7c; font-size: 14px;
  }
  #problems.clean {
    border-color: rgba(47,95,66,.7); border-left-color: var(--brew);
    background: rgba(111,207,143,.07); color: var(--ink);
  }
  #problems b { color: var(--alarm); font: 400 15px/1.4 var(--display);
                letter-spacing: .06em; font-variant: small-caps; }
  #problems.clean b { color: var(--brew); }
  #problems .note { margin: 0; display: inline; }
  #problems ul { margin: 7px 0 0; padding-left: 17px; }
  #problems li { margin: 3px 0; cursor: pointer; line-height: 1.5; }
  #problems li:hover { color: #f0b9ad; }
  #problems code { color: var(--gold-dim);
                   font: 11.5px/1.4 ui-monospace, Consolas, monospace; }

  /* --- the level table --------------------------------------------------------- */
  table.levels { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.levels th {
    color: var(--gold); font: 400 11.5px/1.4 var(--display); letter-spacing: .1em;
    font-variant: small-caps; text-align: left; font-weight: 400;
    padding: 3px 6px; border-bottom: 1px solid #2b2319;
  }
  table.levels td { padding: 2px 4px; border-bottom: 1px solid #241d15; }
  table.levels td.lv { width: 34px; text-align: center; color: var(--gold-dim);
                       font-variant-numeric: tabular-nums; }
  table.levels input { padding: 4px 7px; font-size: 13px; }
  table.levels td.col input { width: 82px; }
  table.levels tr:hover td.lv { color: var(--gold); }
  .toolrow { display: flex; align-items: center; gap: 10px; margin-bottom: 9px;
             flex-wrap: wrap; }

  /* --- repeating structures ----------------------------------------------------- */
  .rowcard {
    border: 1px solid rgba(201,168,106,.22); border-left: 2px solid var(--gold-dim);
    border-radius: 2px; padding: 13px 16px; margin-bottom: 12px;
    background: rgba(0,0,0,.22);
  }
  .rowcard > h4 {
    margin: 0 0 10px; color: var(--gold); font: 400 15px/1.2 var(--display);
    letter-spacing: .07em; font-variant: small-caps;
    display: flex; align-items: baseline; gap: 10px;
  }
  .rowcard > h4 .grow { flex: 1; }
  .rowcard > h4 code { color: var(--dim);
                       font: 12px/1.4 ui-monospace, Consolas, monospace; }
  .kv { display: grid; grid-template-columns: minmax(140px, 1fr) 2.2fr auto;
        gap: 7px; margin-bottom: 6px; align-items: start; }
  .pathcard { margin-bottom: 18px; padding: 16px 18px; }
  .pathcard > h4 { font-size: 18px; border-bottom: 1px solid #2b2319;
                   padding-bottom: 8px; }

  /* One ability, and the four separate maps it lives in shown as one line: what it is
     called on the tier, what it resolves to, whether it is a passive, what it toggles. */
  .tier { margin-top: 12px; padding-top: 9px; border-top: 1px dashed rgba(201,168,106,.2); }
  .tier > b { color: var(--gold); font: 400 13px/1 var(--display);
              letter-spacing: .1em; font-variant: small-caps; }
  .tier .when { color: var(--dim); font: italic 12px/1.5 var(--body); }
  .ability { display: grid; grid-template-columns: 1.4fr 1.2fr 66px 1fr 32px;
             gap: 7px; align-items: center; margin-bottom: 5px; }
  .ability .lbl { color: var(--dim); font: 400 10.5px/1.4 var(--display);
                  letter-spacing: .12em; font-variant: small-caps; }
  .ability input { padding: 5px 8px; font-size: 13px; }
  .ability .mid { text-align: center; }
  .mono { font: 12.5px/1.55 ui-monospace, Consolas, monospace; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 10px;
    background: rgba(217,192,138,.07); border: 1px solid var(--gold-dim);
    color: var(--dim); font: 12px/1.5 var(--body);
  }
  @media (max-width: 1080px) {
    body { height: auto; min-height: 100vh; overflow: visible; }
    main { grid-template-columns: 1fr; }
    .leaf { overflow-y: visible; }
    .ability { grid-template-columns: 1fr; }
    .ability .lbl { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Class builder
    <small>Everything a Pathfinder class is, as fields. A simple class fills in the first
      sections and stops; Blood Bending fills in all nine.</small></h1>
  <div class="who" id="where"></div>
  <a class="back" href="/">← the shelf</a>
</header>

<div class="strip">
  <label>Start from</label>
  <select id="scaffold"></select>
  <button class="quiet" id="load-scaffold">Load template</button>
  <label>or open</label>
  <select id="existing"></select>
  <button class="quiet" id="load-existing">Open</button>
  <span class="grow"></span>
  <span id="saved"></span>
  <button class="go" id="save">Keep this class</button>
</div>

<main>
  <nav id="nav"></nav>
  <section class="leaf">
    <div id="problems" class="clean">Checking…</div>
    <div id="body"></div>
  </section>
</main>

<script>
const CAT = {{ state_json|safe }};
const SECTIONS = CAT.schema;
// Which section a validation message belongs to, worked out from the dotted path the
// message opens with. The messages are written for a person, so the mapping is the one
// piece of coupling between them and the form — kept to the root key alone.
const SECTION_OF = {};
SECTIONS.forEach(s => s.fields.forEach(f => { SECTION_OF[f.name] = s.id; }));

let CLS = {};
let PROBLEMS = [];
let current = SECTIONS[0].id;

const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const csrf = () => document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "";

// --- the model -----------------------------------------------------------------------
// One plain object holding the class exactly as it will be saved. Every input writes into
// it and nothing else holds state, so the JSON tab and the form cannot disagree.

function setField(name, value) {
  if (value === "" || value === null || value === undefined) delete CLS[name];
  else CLS[name] = value;
  check();
}

function listFrom(text) {
  return String(text || "").split(",").map(s => s.trim()).filter(Boolean);
}

// --- drawing -------------------------------------------------------------------------

function drawNav() {
  const counts = {};
  PROBLEMS.forEach(p => {
    const id = SECTION_OF[rootOf(p)];
    if (id) counts[id] = (counts[id] || 0) + 1;
  });
  const tab = (id, title) => `<button class="tab ${id === current ? "on" : ""}"
      data-sec="${id}"><span class="grow">${esc(title)}</span>${
      counts[id] ? `<span class="badge">${counts[id]}</span>` : ""}</button>`;
  let plain = "", adv = "";
  SECTIONS.forEach(s => {
    const html = tab(s.id, s.title);
    if (s.advanced) adv += html; else plain += html;
  });
  $("#nav").innerHTML = plain
    + `<div class="railhead">Advanced<em>A simple class needs none of these</em></div>`
    + adv
    + `<div class="railhead">Raw<em>The file as it will be written</em></div>`
    + tab("__json", "JSON");
  $("#nav").querySelectorAll("button").forEach(b =>
    b.onclick = () => { current = b.dataset.sec; draw(); });
}

function rootOf(problem) {
  return String(problem).split(":")[0].split(/[.[]/)[0].trim();
}

function drawProblems() {
  const box = $("#problems");
  if (!PROBLEMS.length) {
    box.className = "clean";
    box.innerHTML = `<b>This class is sound.</b> <span class="note">It will load, a
      character can be made in it, and it levels to twenty.</span>`;
    return;
  }
  box.className = "";
  box.innerHTML = `<b>${PROBLEMS.length} thing${PROBLEMS.length > 1 ? "s" : ""} to
    put right.</b> <span class="note">Nothing is kept until they are gone.</span>
    <ul>${PROBLEMS.map((p, i) => {
      const head = String(p).split(":")[0];
      const rest = String(p).slice(head.length + 1);
      return `<li data-i="${i}"><code>${esc(head)}</code> ${esc(rest)}</li>`;
    }).join("")}</ul>`;
  box.querySelectorAll("li").forEach(li => li.onclick = () => {
    const id = SECTION_OF[rootOf(PROBLEMS[li.dataset.i])];
    if (id) { current = id; draw(); }
  });
}

function drawWho() {
  $("#where").innerHTML = `${esc(CLS.name || "unnamed")}
    <span>${esc(CLS.id || "no id")}</span>`;
}

function draw() {
  drawNav();
  drawProblems();
  drawWho();
  if (current === "__json") return drawJson();
  const sec = SECTIONS.find(s => s.id === current);
  const host = $("#body");
  host.innerHTML = `<h2 class="sect">${esc(sec.title)}</h2>
    <p class="note">${esc(sec.blurb)}</p><div id="fields"></div>`;
  const fields = $("#fields");
  sec.fields.forEach(f => fields.appendChild(drawField(f)));
}

function labelFor(f) {
  return `<label>${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ""}</label>
    ${f.help ? `<div class="help">${esc(f.help)}${
      f.example ? ` <i>e.g. ${esc(f.example)}</i>` : ""}</div>` : ""}`;
}

function drawField(f) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  wrap.innerHTML = labelFor(f);
  const value = CLS[f.name];

  if (f.type === "table") wrap.appendChild(drawLevels());
  else if (f.type === "paths") wrap.appendChild(drawPaths());
  else if (f.type === "group") wrap.appendChild(drawGroup(f));
  else if (f.type === "object") wrap.appendChild(drawObject(f));
  else if (f.type === "map") wrap.appendChild(drawMap(f));
  else wrap.appendChild(drawInput(f, value, v => setField(f.name, v)));

  // Which engine mechanism reads this, or the honest admission that none does. The
  // second line is the reason the first exists: a field the app silently ignores is
  // exactly the thing an author has to be told about, not shielded from.
  const c = document.createElement("div");
  if (f.consumer) {
    c.className = "consumer";
    c.textContent = "read by " + f.consumer;
  } else {
    c.className = "consumer none";
    c.textContent = "recorded only — no engine mechanism reads this";
  }
  wrap.appendChild(c);
  return wrap;
}

/** One scalar input, by type. `onchange` receives the value in the shape the file holds. */
function drawInput(f, value, onchange, small) {
  let el;
  if (f.type === "choice") {
    el = document.createElement("select");
    el.innerHTML = `<option value=""></option>` + (f.choices || []).map(c =>
      `<option value="${esc(c)}" ${String(value) === String(c) ? "selected" : ""}>
        ${esc(c)}</option>`).join("");
    el.onchange = () => onchange(el.value);
  } else if (f.type === "bool") {
    el = document.createElement("select");
    el.innerHTML = ["", "true", "false"].map(c =>
      `<option value="${c}" ${String(value) === c ? "selected" : ""}>
        ${c || "—"}</option>`).join("");
    el.onchange = () => onchange(el.value === "" ? "" : el.value === "true");
  } else if (f.type === "textarea") {
    el = document.createElement("textarea");
    el.value = value == null ? "" : value;
    el.oninput = () => onchange(el.value);
  } else if (f.type === "list") {
    el = document.createElement("input");
    el.value = Array.isArray(value) ? value.join(", ") : (value || "");
    el.placeholder = (f.choices || []).slice(0, 3).join(", ");
    el.oninput = () => onchange(listFrom(el.value));
  } else {
    el = document.createElement("input");
    el.value = value == null ? "" : value;
    if (f.type === "number") el.type = "number";
    el.oninput = () => onchange(
      f.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value);
  }
  if (small) el.style.margin = "0";
  return el;
}

// --- repeating structures --------------------------------------------------------------

function drawGroup(f) {
  const host = document.createElement("div");
  const rows = Array.isArray(CLS[f.name]) ? CLS[f.name] : [];
  rows.forEach((row, i) => {
    const card = document.createElement("div");
    card.className = "rowcard";
    card.innerHTML = `<h4><span class="grow">${esc(f.label)} ${i + 1}</span>
      <button class="mini drop" data-del="${i}">remove</button></h4>`;
    (f.of || []).forEach(sub => {
      const line = document.createElement("div");
      line.className = "field";
      line.innerHTML = labelFor(sub);
      if (sub.type === "object") line.appendChild(drawSubObject(sub, row));
      else line.appendChild(drawInput(sub, row[sub.name], v => {
        if (v === "" || v === null) delete row[sub.name]; else row[sub.name] = v;
        check();
      }));
      card.appendChild(line);
    });
    card.querySelector("[data-del]").onclick = () => {
      rows.splice(i, 1); check(); draw();
    };
    host.appendChild(card);
  });
  const add = document.createElement("button");
  add.className = "mini add";
  add.textContent = "Add " + f.label.toLowerCase().replace(/s$/, "");
  add.onclick = () => {
    CLS[f.name] = rows.concat([{}]);
    check(); draw();
  };
  host.appendChild(add);
  return host;
}

function drawSubObject(f, parent) {
  const host = document.createElement("div");
  host.className = "rowcard";
  const obj = parent[f.name] && typeof parent[f.name] === "object" ? parent[f.name] : {};
  (f.of || []).forEach(sub => {
    const line = document.createElement("div");
    line.className = "field";
    line.innerHTML = labelFor(sub);
    line.appendChild(drawInput(sub, obj[sub.name], v => {
      if (v === "" || v === null) delete obj[sub.name]; else obj[sub.name] = v;
      if (Object.keys(obj).length) parent[f.name] = obj; else delete parent[f.name];
      check();
    }));
    host.appendChild(line);
  });
  return host;
}

function drawObject(f) {
  const host = document.createElement("div");
  const on = CLS[f.name] && typeof CLS[f.name] === "object";
  const toggle = document.createElement("button");
  toggle.className = on ? "mini drop" : "mini add";
  toggle.textContent = on ? "Remove this block" : "Add this block";
  toggle.onclick = () => {
    if (on) delete CLS[f.name]; else CLS[f.name] = {};
    check(); draw();
  };
  if (on) {
    const card = document.createElement("div");
    card.className = "rowcard";
    (f.of || []).forEach(sub => {
      const line = document.createElement("div");
      line.className = "field";
      line.innerHTML = labelFor(sub);
      line.appendChild(drawInput(sub, CLS[f.name][sub.name], v => {
        if (v === "" || v === null) delete CLS[f.name][sub.name];
        else CLS[f.name][sub.name] = v;
        check();
      }));
      card.appendChild(line);
    });
    host.appendChild(card);
  }
  host.appendChild(toggle);
  return host;
}

/** A name → text map: features, ability text, resolves, toggles, upgrades. */
function drawMap(f, obj, onchange) {
  const host = document.createElement("div");
  const target = obj || (CLS[f.name] && typeof CLS[f.name] === "object" ? CLS[f.name] : {});
  const entries = Object.entries(target);
  if (entries.length) {
    const head = document.createElement("div");
    head.className = "kv";
    head.innerHTML = `<span class="lbl kvhead">${esc(f.key_label || "Name")}</span>
      <span class="lbl kvhead">${esc(f.value_label || "Text")}</span><span></span>`;
    host.appendChild(head);
  }
  entries.forEach(([k, v]) => {
    const line = document.createElement("div");
    line.className = "kv";
    const key = document.createElement("input");
    key.value = k;
    key.placeholder = f.key_label || "Name";
    key.onchange = () => {
      const was = Object.entries(target);
      for (const kk of Object.keys(target)) delete target[kk];
      was.forEach(([ek, ev]) => { target[ek === k ? key.value : ek] = ev; });
      commitMap(f, target, onchange); draw();
    };
    const val = document.createElement(String(v || "").length > 60 ? "textarea" : "input");
    val.value = v == null ? "" : v;
    val.placeholder = f.value_label || "Text";
    val.oninput = () => { target[key.value] = val.value; commitMap(f, target, onchange); };
    const del = document.createElement("button");
    del.className = "mini drop";
    del.textContent = "×";
    del.onclick = () => { delete target[k]; commitMap(f, target, onchange); draw(); };
    line.append(key, val, del);
    host.appendChild(line);
  });
  const add = document.createElement("button");
  add.className = "mini add";
  add.textContent = "Add entry";
  add.onclick = () => {
    target[""] = "";
    commitMap(f, target, onchange);
    draw();
  };
  host.appendChild(add);
  return host;
}

function commitMap(f, target, onchange) {
  if (onchange) onchange(target);
  else if (Object.keys(target).length) CLS[f.name] = target;
  else delete CLS[f.name];
  check();
}

// --- the level table --------------------------------------------------------------------
// Twenty rows and any number of die columns, because a class table is exactly that: what a
// level grants, and whatever dice the class prints in a column of its own.

function levelRows() {
  if (!Array.isArray(CLS.levels)) CLS.levels = [];
  return CLS.levels;
}

function columnsOf() {
  const out = [];
  levelRows().forEach(r => Object.keys(r || {}).forEach(k => {
    if (k !== "level" && k !== "grants" && !k.startsWith("_") && !out.includes(k))
      out.push(k);
  }));
  return out;
}

function drawLevels() {
  const host = document.createElement("div");
  const cols = columnsOf();
  const rows = levelRows();
  const byLevel = {};
  rows.forEach(r => { if (r && r.level != null) byLevel[Number(r.level)] = r; });

  let head = `<tr><th>Lv</th><th>What this level grants</th>`
    + cols.map(c => `<th>${esc(c)}
        <button class="mini drop" data-dropcol="${esc(c)}">×</button></th>`).join("")
    + `</tr>`;
  let body = "";
  for (let n = 1; n <= CAT.max_level; n++) {
    const r = byLevel[n];
    body += `<tr><td class="lv">${n}</td>
      <td><input data-lv="${n}" data-key="grants" value="${
        esc((r && r.grants || []).join(", "))}"></td>`
      + cols.map(c => `<td class="col"><input data-lv="${n}" data-key="${esc(c)}"
          value="${esc(r && r[c] || "")}"></td>`).join("")
      + `</tr>`;
  }
  host.innerHTML = `<div class="toolrow">
      <button class="mini add" id="addcol">Add a die column</button>
      <span class="help" style="margin:0">A column is any name you like — Fist, Blood,
        Squall. An effect can read one and multiply it.</span></div>
    <table class="levels"><thead>${head}</thead><tbody>${body}</tbody></table>`;

  host.querySelectorAll("input[data-lv]").forEach(inp => {
    inp.oninput = () => {
      const n = Number(inp.dataset.lv);
      let row = byLevel[n];
      if (!row) {
        row = { level: n, grants: [] };
        byLevel[n] = row;
        rows.push(row);
        rows.sort((a, b) => Number(a.level) - Number(b.level));
      }
      if (inp.dataset.key === "grants") row.grants = listFrom(inp.value);
      else if (inp.value.trim()) row[inp.dataset.key] = inp.value.trim();
      else delete row[inp.dataset.key];
      check();
    };
  });
  host.querySelector("#addcol").onclick = () => {
    const name = prompt("Column name (fist, blood, squall):", "");
    if (!name) return;
    for (let n = 1; n <= CAT.max_level; n++) {
      if (!byLevel[n]) { const r = { level: n, grants: [] }; byLevel[n] = r; rows.push(r); }
      byLevel[n][name.trim()] = byLevel[n][name.trim()] || "1d6";
    }
    rows.sort((a, b) => Number(a.level) - Number(b.level));
    check(); draw();
  };
  host.querySelectorAll("[data-dropcol]").forEach(b => b.onclick = () => {
    rows.forEach(r => delete r[b.dataset.dropcol]);
    check(); draw();
  });
  return host;
}

// --- paths ------------------------------------------------------------------------------
// The hard part, and the reason this is a page rather than a bench form. A path is a
// repeating structure four levels deep: paths → tiers → abilities → effects. Adding an
// ability wires up its `resolves` entry and its text at the same moment, because those
// three are one act to an author and three maps in the file.

function pathsObj() {
  if (!CLS.paths || typeof CLS.paths !== "object") CLS.paths = {};
  return CLS.paths;
}

function drawPaths() {
  const host = document.createElement("div");
  const paths = pathsObj();
  const spec = {};
  (SECTIONS.find(s => s.id === "paths").fields.find(f => f.name === "paths").of || [])
    .forEach(f => { spec[f.name] = f; });

  Object.entries(paths).forEach(([pid, path]) => {
    const card = document.createElement("div");
    card.className = "rowcard pathcard";
    card.innerHTML = `<h4><span class="grow">${esc(path.name || pid)}
      <code>${esc(pid)}</code></span>
      <button class="mini drop" data-delpath="1">remove path</button></h4>`;

    ["name", "role", "summary", "global_rule"].forEach(key => {
      const line = document.createElement("div");
      line.className = "field";
      line.innerHTML = labelFor(spec[key]);
      line.appendChild(drawInput(spec[key], path[key], v => {
        if (v === "") delete path[key]; else path[key] = v;
        check();
      }));
      card.appendChild(line);
    });

    // Tiers. Each ability line carries the four facts that are separate maps in the file:
    // what it is called on the tier, which ability it resolves to, whether it is a passive
    // (never usable), and which condition it toggles.
    path.tiers = path.tiers && typeof path.tiers === "object" ? path.tiers : {};
    path.abilities = path.abilities || {};
    path.resolves = path.resolves || {};
    for (let t = 1; t <= CAT.max_tier; t++) {
      const names = Array.isArray(path.tiers[String(t)]) ? path.tiers[String(t)] : [];
      const tier = document.createElement("div");
      tier.className = "tier";
      tier.innerHTML = `<b>Tier ${t}</b> <span class="when">usable once the character has
        reached ${esc(CAT.track_phrase)} ${t} on this path</span>
        ${names.length ? `<div class="ability" style="margin-top:6px">
          <span class="lbl">Name on the tier</span><span class="lbl">Resolves to</span>
          <span class="lbl mid">Passive</span><span class="lbl">Toggles condition</span>
          <span></span></div>` : ""}`;
      names.forEach((name, i) => {
        const line = document.createElement("div");
        line.className = "ability";

        const nm = document.createElement("input");
        nm.value = name;
        nm.onchange = () => { renameAbility(path, name, nm.value); check(); draw(); };

        const res = document.createElement("input");
        res.value = path.resolves[name] || "";
        res.setAttribute("list", "abilitylist");
        res.onchange = () => { path.resolves[name] = res.value; check(); };

        const holder = document.createElement("span");
        holder.className = "mid";
        const pas = document.createElement("input");
        pas.type = "checkbox";
        pas.checked = (path.passive || []).includes(name);
        pas.onchange = () => {
          const set = new Set(path.passive || []);
          pas.checked ? set.add(name) : set.delete(name);
          if (set.size) path.passive = [...set]; else delete path.passive;
          check();
        };
        holder.appendChild(pas);

        const tog = document.createElement("input");
        tog.value = (path.toggles || {})[name] || "";
        tog.placeholder = "a condition name";
        tog.onchange = () => {
          path.toggles = path.toggles || {};
          if (tog.value.trim()) path.toggles[name] = tog.value.trim();
          else delete path.toggles[name];
          if (!Object.keys(path.toggles).length) delete path.toggles;
          check();
        };

        const del = document.createElement("button");
        del.className = "mini drop";
        del.textContent = "×";
        del.onclick = () => {
          names.splice(i, 1);
          if (!names.length) delete path.tiers[String(t)];
          check(); draw();
        };
        line.append(nm, res, holder, tog, del);
        tier.appendChild(line);
      });
      const add = document.createElement("button");
      add.className = "mini add";
      add.textContent = "Add an ability at tier " + t;
      add.onclick = () => {
        const name = prompt("What is it called?", "");
        if (!name) return;
        path.tiers[String(t)] = names.concat([name]);
        // The three maps an author thinks of as one act: it is on the tier, it resolves to
        // itself, and it has a paragraph waiting to be written.
        path.resolves[name] = name;
        if (!(name in path.abilities)) path.abilities[name] = "";
        check(); draw();
      };
      tier.appendChild(add);
      card.appendChild(tier);
    }

    ["abilities", "upgrades", "core", "needs"].forEach(key => {
      const line = document.createElement("div");
      line.className = "field";
      line.innerHTML = `<h3 class="sub">${esc(spec[key].label)}</h3>
        ${spec[key].help ? `<div class="help">${esc(spec[key].help)}</div>` : ""}`;
      if (spec[key].type === "list") {
        line.appendChild(drawInput(spec[key], path[key], v => {
          if (!v || !v.length) delete path[key]; else path[key] = v;
          check();
        }));
      } else {
        line.appendChild(drawMap(spec[key], path[key] || {}, target => {
          if (Object.keys(target).length) path[key] = target; else delete path[key];
        }));
      }
      const c = document.createElement("div");
      c.className = spec[key].consumer ? "consumer" : "consumer none";
      c.textContent = spec[key].consumer
        ? "read by " + spec[key].consumer
        : "recorded only — no engine mechanism reads this";
      line.appendChild(c);
      card.appendChild(line);
    });

    // Effects, as JSON. The effect vocabulary has its own builder on the homebrew page;
    // duplicating it here would be a second form to keep level with the first, so this is
    // the honest shape: the text the file holds, checked live by the same validator.
    const fx = document.createElement("div");
    fx.className = "field";
    fx.innerHTML = `<h3 class="sub">${esc(spec.effects.label)}</h3>
      <div class="help">${esc(spec.effects.help)}</div>`;
    const area = document.createElement("textarea");
    area.className = "mono";
    area.style.minHeight = "150px";
    area.value = JSON.stringify(path.effects || {}, null, 1);
    area.onchange = () => {
      try {
        const parsed = JSON.parse(area.value || "{}");
        path.effects = parsed;
        area.style.borderColor = "";
        check();
      } catch (e) {
        area.style.borderColor = "var(--alarm)";
      }
    };
    fx.appendChild(area);
    const fxc = document.createElement("div");
    fxc.className = "consumer";
    fxc.textContent = "read by " + spec.effects.consumer;
    fx.appendChild(fxc);
    card.appendChild(fx);

    card.querySelector("[data-delpath]").onclick = () => {
      delete paths[pid];
      if (!Object.keys(paths).length) delete CLS.paths;
      check(); draw();
    };
    host.appendChild(card);
  });

  const add = document.createElement("button");
  add.className = "mini add";
  add.textContent = "Add a path";
  add.onclick = () => {
    const id = prompt("Path id — lower case, it is what the sheet stores:", "");
    if (!id) return;
    paths[id.trim().toLowerCase()] = {
      name: id.trim(), tiers: {}, abilities: {}, resolves: {},
    };
    check(); draw();
  };
  host.appendChild(add);

  const names = new Set();
  Object.values(paths).forEach(p =>
    Object.keys(p.abilities || {}).forEach(n => names.add(n)));
  const list = document.createElement("datalist");
  list.id = "abilitylist";
  list.innerHTML = [...names].map(n => `<option value="${esc(n)}">`).join("");
  host.appendChild(list);
  return host;
}

/** Rename an ability everywhere it is named, which is four maps and two lists. */
function renameAbility(path, was, now) {
  now = String(now || "").trim();
  if (!now || now === was) return;
  Object.keys(path.tiers).forEach(t => {
    path.tiers[t] = path.tiers[t].map(n => (n === was ? now : n));
  });
  ["resolves", "toggles", "upgrades", "needs"].forEach(key => {
    if (path[key] && was in path[key]) {
      path[key][now] = path[key][was];
      delete path[key][was];
    }
  });
  ["passive", "core", "undescribed"].forEach(key => {
    if (Array.isArray(path[key])) path[key] = path[key].map(n => (n === was ? now : n));
  });
}

// --- the JSON tab -------------------------------------------------------------------------

function drawJson() {
  const host = $("#body");
  host.innerHTML = `<h2 class="sect">JSON</h2>
    <p class="note">The file exactly as it will be written. Paste one in and press Apply
      to bring an existing class into the form.</p>
    <textarea id="raw" class="mono" style="min-height:56vh"></textarea>
    <div class="toolrow" style="margin-top:9px">
      <button class="quiet" id="apply">Apply</button>
      <span class="help" style="margin:0" id="rawnote"></span></div>`;
  $("#raw").value = JSON.stringify(CLS, null, 1);
  $("#apply").onclick = () => {
    try {
      const parsed = JSON.parse($("#raw").value);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed))
        throw new Error("a class is a JSON object");
      CLS = parsed;
      $("#rawnote").textContent = "";
      check(); draw();
    } catch (e) {
      $("#rawnote").textContent = "That does not parse: " + e.message;
    }
  };
}

// --- validation and saving ------------------------------------------------------------

let timer = null;
function check() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const res = await fetch("/api/classes/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf() },
      body: JSON.stringify({ class: CLS }),
    });
    const data = await res.json();
    PROBLEMS = data.problems || [];
    drawNav();
    drawProblems();
    drawWho();
  }, 350);
}

async function save() {
  const res = await fetch("/api/classes/save", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRFToken": csrf() },
    body: JSON.stringify({ class: CLS }),
  });
  const data = await res.json();
  const saved = $("#saved");
  if (data.ok) {
    saved.className = "done";
    saved.textContent = "Kept — it is playable now, and the forge will offer it.";
    saved.title = data.path;
    if (data.existing) fillExisting(data.existing);
  } else {
    PROBLEMS = data.problems || ["The save failed and said nothing, which is a bug."];
    saved.className = "";
    saved.textContent = "Not kept.";
    drawNav(); drawProblems();
  }
}

function fillExisting(rows) {
  $("#existing").innerHTML = rows.map(r =>
    `<option value="${esc(r.id)}">${esc(r.name)}${r.mine ? " (yours)" : ""}</option>`
  ).join("");
}

// --- start ---------------------------------------------------------------------------

$("#scaffold").innerHTML = CAT.scaffolds.map(s =>
  `<option value="${esc(s.id)}" title="${esc(s.blurb)}">${esc(s.label)}</option>`).join("");
fillExisting(CAT.existing);
$("#saved").textContent = "Yours are written to " + CAT.homebrew_dir;

$("#load-scaffold").onclick = async () => {
  const res = await fetch("/api/classes/scaffold/" + $("#scaffold").value);
  const data = await res.json();
  if (data.class) { CLS = data.class; current = SECTIONS[0].id; check(); draw(); }
};
$("#load-existing").onclick = async () => {
  const res = await fetch("/api/classes/open/" + encodeURIComponent($("#existing").value));
  const data = await res.json();
  if (data.class) { CLS = data.class; current = SECTIONS[0].id; check(); draw(); }
};
$("#save").onclick = save;

(async () => {
  const res = await fetch("/api/classes/scaffold/" + CAT.scaffolds[0].id);
  CLS = (await res.json()).class || {};
  check();
  draw();
})();
</script>
