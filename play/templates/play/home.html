/* --- Playing from a phone -------------------------------------------------------
 *
 * The app ships as one executable and its standing constraint is "no terminal, no
 * pip install, no Python knowledge required to run it". Serving to the network used to
 * need `desktop.py --lan`, which broke that for the one feature whose whole point is
 * convenience — so the socket is bound on demand by this button instead of at launch.
 *
 * The code is drawn by `pathfindergm/qr.py` rather than fetched from a generator: the
 * address it encodes is a private one on the player's own network, and putting that
 * through somebody else's server to get a picture back would be sending the location of
 * their game to a stranger for no reason at all.
 */
let LAN = null;

function phonePanel() {
  if (!LAN) return `<p class="note">Checking…</p>`;
  if (LAN.error) return `<div class="problems"><div>${esc(LAN.error)}</div></div>`;
  if (!LAN.open) {
    return `<p class="note">The game listens only to this machine until you say
      otherwise. Open the door and this page shows a code your phone's camera can
      follow — you stay on your own Wi-Fi and nothing goes to the internet.</p>
      <button class="go" id="lanopen">Open the door</button>`;
  }
  const extra = (LAN.addresses || []).slice(1);
  return `<div class="phonewrap">
    <div class="qr">${LAN.qr || ""}</div>
    <div class="phonesaid">
      <p class="note">Point your phone's camera at this. Same Wi-Fi as this machine —
        Windows may ask you to allow the app through the firewall the first time.</p>
      <div class="lanurl">${esc(LAN.url || "no network address found")}</div>
      <p class="note">If the camera will not focus, type that in — the pass is the ten
        characters after <code>k=</code>, and it is new every time you open the door.</p>
      ${extra.length ? `<p class="note">This machine has more than one address. If the
        first does not work, try:${extra.map(a =>
          `<br><span class="lanalt">${esc(a)}</span>`).join("")}</p>` : ""}
      <button class="quiet" id="lanclose">Close the door</button>
    </div>
  </div>`;
}

async function lanFetch(url, method) {
  try {
    const r = await fetch(url, method === "POST" ? {
      method: "POST", headers: { "Content-Type": "application/json",
        "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "" },
      body: "{}",
    } : undefined);
    const body = await r.text();
    let d; try { d = JSON.parse(body); } catch { d = { error: body.slice(0, 160) }; }
    LAN = r.ok ? d : { open: false, error: d.error || `HTTP ${r.status}` };
  } catch (err) {
    LAN = { open: false, error: String(err) };
  }
  render();
}

async function saveModelSettings() {
  const roles = {};
  document.querySelectorAll("[data-role]").forEach(el => {
    roles[el.dataset.role] = roles[el.dataset.role] || {};
    roles[el.dataset.role][el.dataset.field] = el.value;
  });
  const keys = {};
  document.querySelectorAll("[data-key]").forEach(el => {
    // An untouched field is blank because the real key is never sent here. Blank has
    // to mean "leave it alone", or opening this page and saving would wipe every key.
    if (el.value.trim()) keys[el.dataset.key] = el.value.trim();
  });
  const r = await fetch("/api/settings/models", {
    method: "POST", headers: { "Content-Type": "application/json",
      "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "" },
    body: JSON.stringify({ roles, keys }),
  });
  const body = await r.text();
  let d; try { d = JSON.parse(body); } catch { d = { problems: [body.slice(0, 160)] }; }
  if (!r.ok) {
    $("#modelerr").innerHTML = `<div class="problems">${
      (d.problems || ["could not save"]).map(p => `<div>${esc(p)}</div>`).join("")}</div>`;
    return;
  }
  SETTINGS = d;
  render();
  const said = $("#modelsaid");
  if (said) said.textContent = "Saved. The next turn uses it.";
}

function paneCharacters() {
  const forge = `<button class="go" data-forge style="margin-bottom:18px">
    Forge a character</button>`;
  // Said plainly, and only once. A button whose whole effect is a row further down a
  // page you were not looking at is a button that reads as broken.
  const made = MADE && STATE.recent.find(c => c.id === MADE);
  const banner = made ? `<div class="madebanner"><b>${esc(made.name)}</b> is on the
    roster — ${esc(made.line)}. They are waiting for a game; press
    <em>Play as ${esc(made.name)}</em> below, or pick a world from the shelf.</div>` : "";
  if (!STATE.recent.length) return forge + `<p class="note">Nobody has been played yet.</p>`;
  return banner + continueBlock() + forge + `
    <h2 class="sect">Everyone played</h2>
    <p class="note">The dead stay on the roster — they are the reason the next game went
      the way it did.</p>
    <div class="cards">${STATE.recent.map(c => `
      <div class="card ${c.id === MADE ? "justmade" : ""}">
        <h3>${esc(c.name)}</h3>
        <em class="${c.unreadable ? "line bad" : ""}">${esc(c.line)}${
          c.world && !c.unreadable ? ` · ${esc(c.world)}` : ""}</em>
        <div class="stat">${esc(c.hp)} hp · <b>${c.turns_played}</b> turns played</div>
        <div style="margin-top:9px">
          ${c.active ? `<span class="pill now">in play</span>` : ""}
          ${c.status === "dead" ? `<span class="pill dead">died${
            c.epitaph ? " — " + esc(c.epitaph) : ""}</span>` : ""}
          <!-- A character whose sheet no longer validates. The card says so and offers
               no way to play them, rather than the whole page being a 500 — which is
               what one of these used to do to every other character on the roster. -->
          ${c.unreadable ? `<span class="pill dead">the sheet cannot be read</span>` : ""}
          ${c.playable ? `<button class="quiet" data-resume="${esc(c.id)}">${
            c.active ? "Go to the table" : "Play as " + esc(c.name)
          }</button>` : ""}
          <!-- Back to the shop on purpose. The outfitter was reachable only on the way
               out of the forge, so a character who did not spend their purse then had no
               way back to it — and since 2026-09-19 the purse is the WHOLE gear budget
               (the class kits are gone, item 24), which makes an unspent one a character
               with nothing but their hands. -->
          ${c.playable && !c.unreadable ? `<button class="quiet"
            data-outfit="${esc(c.id)}" data-outfit-world="${esc(c.world_source || "")}"
            title="Spend what is left of their purse">Outfit</button>` : ""}
          ${c.active ? "" : `<button class="quiet danger"
            data-remove="${esc(c.id)}" data-name="${esc(c.name)}"
            title="Take them off the roster">Delete</button>`}
        </div>
      </div>`).join("")}</div>
    <div id="err"></div>`;
}

// --- The forge: guided character creation ------------------------------------------------
// One scrolling page rather than a step wizard: a character sheet being filled in, which
// is what the thing is. The server is the authority on every rule — the counters here are
// a courtesy, and the submit round-trips the whole form and renders every problem at once.
let FORGE = null;   // { opts, form } while the forge is open

// The whole race card, on demand: the forge's cards show one clipped line and a
// details button, so twelve races fit on a screen.
function showRaceCard(id) {
  const r = FORGE && FORGE.opts.races.find(x => x.id === id);
  if (!r) return;
  let box = document.getElementById("racecard");
  if (!box) {
    box = document.createElement("div"); box.id = "racecard";
    box.addEventListener("click", ev => { if (ev.target === box || ev.target.closest("[data-closecard]")) box.classList.remove("on"); });
    document.body.appendChild(box);
  }
  const mods = Object.entries(r.mods || {}).map(([a, v]) => `${a.toUpperCase()} ${v > 0 ? "+" : ""}${v}`).join(", ")
    || (r.choose || []).map(c => `${c.amount > 0 ? "+" : ""}${c.amount} ${c.from}`).join(", ") || "no adjustments";
  box.innerHTML = `<div class="sheet">
    <h3>${esc(r.name)}${r.of ? ` <span class="pill now">of ${esc(r.of)}</span>` : ""}</h3>
    <div class="why">${esc(r.type || "humanoid")} · ${esc(r.size)} · ${r.speed} ft · ${esc(mods)} · ${r.rp} RP (${esc(r.power || "")})</div>
    ${r.description ? `<p>${esc(r.description)}</p>` : ""}
    <p><b>Traits.</b> ${(r.trait_lines || r.traits || []).map(esc).join(" · ") || "none"}</p>
    ${(r.languages || []).length ? `<p><b>Languages.</b> ${r.languages.map(esc).join(", ")}</p>` : ""}
    ${(r.heritages || []).length ? `<p><b>Peoples.</b> ${r.heritages.map(h => esc(h.name)).join(", ")}</p>` : ""}
    ${(r.not_yet || []).length ? `<p class="why">Not on the sheet yet: ${r.not_yet.map(esc).join("; ")}.</p>` : ""}
    <div style="margin-top:12px"><button class="quiet" data-closecard>close</button></div>
  </div>`;
  box.classList.add("on");
}

function featName(fid) {
  const found = FORGE?.opts.feats.find(x => x.id === fid);
  return found ? found.name : fid;
}

function featMatches() {
  // A fragment rather than part of paneForge, so typing can repaint only this box:
  // re-rendering the whole pane on every keystroke throws the caret out of the input.
  const q = (FORGE.featq || "").trim().toLowerCase();
  if (q.length < 2) return `<p class="note">Type two letters to search. Chosen feats
    sit above as buttons — click one to take it back off.</p>`;
  const hits = FORGE.opts.feats.filter(x =>
    !FORGE.form.feats.includes(x.id) && x.name.toLowerCase().includes(q)).slice(0, 24);
  if (!hits.length) return `<p class="note">No feat matches “${esc(FORGE.featq)}”.</p>`;
  return `<div class="featlist">${hits.map(x => `
    <button class="featrow" data-craddfeat="${esc(x.id)}"><b>${esc(x.name)}</b>${
      x.prereq ? `<span>${esc(x.prereq)}</span>` : ""}</button>`).join("")}</div>`;
}

function domainMatches() {
  // The same shape as `featMatches`, and for the same reason: 153 domains is a search box,
  // not a list, and repainting the whole pane on every keystroke throws the caret out.
  const q = (FORGE.domainq || "").trim().toLowerCase();
  const all = FORGE.opts.domains || [];
  const taken = FORGE.form.domains || [];
  const want = FORGE.opts.domains_wanted || 2;
  if (taken.length >= want) return `<p class="note">Two chosen. Click one above to take it
    back off.</p>`;
  const hits = all.filter(d => !taken.includes(d.name) &&
    (!q || d.name.toLowerCase().includes(q))).slice(0, 24);
  if (!hits.length) return `<p class="note">No domain matches “${esc(FORGE.domainq || "")}”.</p>`;
  return `<div class="featlist">${hits.map(d => `
    <button class="featrow" data-cradddomain="${esc(d.name)}"><b>${esc(d.name)}</b>
      <span>${d.spells} spell${d.spells === 1 ? "" : "s"}${
        d.first ? ` · ${esc(d.first)} at 1st` : ""}</span></button>`).join("")}</div>`;
}

// The same two rows as `sheet.pronouns_for_gender`. A house-rule set is its own answer:
// "ze/hir" is both what somebody is and what they are called, which is why it is offered
// as a gender rather than as a second question.
const PRONOUNS_FOR = { woman: "she/her", man: "he/him" };

function forgeDefaults(opts) {
  return {
    name: "", race: "", choices: [], heritage: "", pronouns: "", gender: "",
    // Where they were before the first turn. Empty is a real answer — every character
    // made before backgrounds existed has none, and the forge must still build one.
    background: "",
    class: "", abilities: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
    skills: [], feats: [], spellbook: [], domains: [], paths: [],
  };
}

function pointsSpent(f, opts) {
  return Object.values(f.abilities).reduce(
    (n, v) => n + (opts.point_costs[v] ?? 0), 0);
}

// A score as the character will actually have it: what was bought, plus what the race
// does to it. `rules/creation.py` applies the racial adjustment and only then reads the
// modifier, so anything here that reads a raw score disagrees with the server about the
// character being built.
function finalAbility(f, opts, ab) {
  const race = opts.races.find(r => r.id === f.race);
  let v = f.abilities[ab];
  if (race) {
    v += (race.mods && race.mods[ab]) || 0;
    // One pick per `choose` slot of the race document — a human's one "+2 any", the
    // Race Builder's standard three a world's people is drafted with.
    (race.choose || []).forEach((c, i) => { if (f.choices[i] === ab) v += c.amount; });
  }
  return v;
}

// The abilities one `choose` slot may land on.
const POOLS = { physical: ["str", "dex", "con"], mental: ["int", "wis", "cha"],
                any: ["str", "dex", "con", "int", "wis", "cha"] };

function abilityMod(f, opts, ab) {
  return Math.floor((finalAbility(f, opts, ab) - 10) / 2);
}

function ranksBudget(f, opts) {
  const cls = opts.classes.find(c => c.id === f.class);
  if (!cls) return 0;
  // Post-racial, matching `creation.py`. Read raw, a human blood bender with 18 Int and
  // the racial +2 in Int was shown "10 / 9" in red for a tenth skill the server accepts
  // without complaint — and an elf, whose +2 Int is fixed in `mods` rather than chosen,
  // was short a rank in every build with no way to see why.
  const intMod = abilityMod(f, opts, "int");
  // Asked of the race document's budget, never of its name — `f.race === "human"`
  // was the question here, and a world's own people could never answer it.
  const race = opts.races.find(r => r.id === f.race);
  return Math.max(1, cls.skill_ranks + intMod) + ((race && race.budget && race.budget.ranks) || 0);
}

function featBudget(f, opts) {
  const race = opts.races.find(r => r.id === f.race);
  return 1 + ((race && race.budget && race.budget.feats) || 0) + (f.class === "fighter" ? 1 : 0);
}

function spellCap(f, opts) {
  const spec = opts.spells_known[f.class];
  if (spec === undefined) return 0;
  // Same post-racial reading as `ranksBudget`, and the same disagreement before it: a
  // human wizard who puts the racial +2 in Int is owed a fourth first-level spell by
  // `creation.py` and was shown a cap of three.
  if (spec === "3 + int_mod") return 3 + abilityMod(f, opts, "int");
  return spec;
}

function paneForge() {
  const { opts, form: f } = FORGE;
  const race = opts.races.find(r => r.id === f.race);
  const cls = opts.classes.find(c => c.id === f.class);

  const rb = ranksBudget(f, opts), fb = featBudget(f, opts), sc = spellCap(f, opts);
  const abfinal = ab => finalAbility(f, opts, ab);
  return `<div class="forge">
    <button class="quiet" data-unforge>← back</button>

         two things went wrong with that. The field had no input at all for a long while,

         And when it did get one, it still could not reach the bug it was meant to: a
         character stood in front of a mirror and was given a man's chest, in a paragraph

        }">${g}</button>`).join("")}

        ? esc(PRONOUNS_FOR[f.gender] || f.gender) : "&nbsp;"}</span>

    <div class="cards tight races">${opts.races.map(r => `
      <button class="card pick ${f.race === r.id ? "on" : ""}" data-crrace="${r.id}"
              ${opts.race_rp && r.rp > opts.race_rp ? `disabled title="${r.rp} RP: above this table's ${opts.race_rp} RP tier"` : ""}
              style="${opts.race_rp && r.rp > opts.race_rp ? "opacity:.45" : ""}">
        <h3>${esc(r.name)}${r.of ? ` <span class="pill now">of ${esc(r.of)}</span>` : ""}${
          r.converted ? ` <span class="unread">unreviewed</span>` : ""}</h3>
        <div class="stat">${esc(r.size)} · ${r.speed} ft · ${
          Object.entries(r.mods || {}).map(([a, v]) => `${a.toUpperCase()} ${v > 0 ? "+" : ""}${v}`).join(", ")
          || (r.choose || []).map(c => `${c.amount > 0 ? "+" : ""}${c.amount} ${c.from}`).join(", ")

      </button>`).join("")}</div>
    ${race && (race.choose || []).length ? `
      <p class="note" style="margin-top:44px">A ${esc(race.name.toLowerCase())} places ${race.choose.length === 1
        ? "+2 where they choose" : "the Race Builder's standard adjustments — each on a different ability"}:</p>
      ${race.choose.map((c, i) => `<div style="margin:4px 0">
        <span class="note" style="display:inline-block;width:110px">${c.amount > 0 ? "+" : ""}${c.amount} ${esc(c.from)}</span>
        ${POOLS[c.from].map(ab => `
        <button class="quiet" data-crbonus="${ab}" data-crslot="${i}" style="${
          f.choices[i] === ab ? "border-color:var(--accent);color:#f0dcae" : ""
        }">${ab.toUpperCase()}</button>`).join(" ")}</div>`).join("")}` : ""}
    ${race && (race.not_yet || []).length ? `<p class="note">Not on the sheet yet:
      ${race.not_yet.map(esc).join("; ")}.</p>` : ""}
    ${(race && (race.heritages || []).length) ? `
      <p class="note" style="margin-top:12px">The peoples of ${esc(race.of || "this world")} who are

      <div>${race.heritages.map(h => `

      <p class="note" style="margin-top:12px">A people of ${esc(opts.races.find(r => r.of)?.of || "this world")}

      <div>${opts.heritages.map(h => `

    <div class="cards">${opts.classes.map(c => `

        <em>${esc(c.summary || "")}</em>
        <div class="stat">${esc(c.die_label || `d${c.hit_die}`)} ·
          ${esc(String(c.bab).replace("_", " "))} BAB ·
          ${c.skill_ranks}+Int skills${c.caster ? " · caster" : ""}</div>
        <div class="traits">${(c.features || []).map(esc).join(" · ")}</div>

    ${cls && (cls.paths || []).length ? `
      <h2 class="sect">Paths</h2>
      <p class="note">A ${esc(cls.name)} follows two paths, and the order is the

        take its Control Blood 1 abilities at 1st level. The <b>second</b> is

        decide the other later.</p>
      <div class="slotrow">
        <div class="pathslot ${f.paths[0] ? "filled" : ""}">
          <span class="slotname">Path A</span>
          <b>${f.paths[0] ? esc(f.paths[0]) : "not chosen"}</b>
          <em>from 1st level</em>
        </div>
        <div class="pathslot ${f.paths[1] ? "filled" : ""}">
          <span class="slotname">Path B</span>
          <b>${f.paths[1] ? esc(f.paths[1]) : "not chosen"}</b>
          <em>from ${cls.unlocks_b || 11}th level</em>
        </div>
      </div>
      <div class="cards tight">${cls.paths.map(x => {
        const at = f.paths.indexOf(x);
        return `<button class="card pick ${at >= 0 ? "on" : ""}"
                data-crpath="${esc(x)}"
                ${at < 0 && f.paths.length >= 2 ? "disabled style=opacity:.4" : ""}>
          <h3>${esc(x)}</h3>

    <h2 class="sect">Abilities</h2>
    <p class="note">Point buy, ${opts.point_budget ? `${opts.point_budget} points — the Rulesets bench under Homebrew sets the tier, Unlimited included` : "unlimited"}. The race lands after.
      ${opts.ability_cap
        ? `No score above ${opts.ability_cap} before race.`
        : `No ceiling on a single score — the budget is the only wall.`}</p>

    <input type="text" id="featsearch" data-cr="featsearch" value="${esc(FORGE.featq || "")}"

        || `<span class="note">None chosen yet.</span>`}</div>
      <input type="text" id="domainsearch" data-cr="domainsearch"

      <div class="budget ${f.spellbook.length > sc ? "over" : ""}">

      <input type="text" data-cr="spellstext" value="${esc(f.spellbook.join(", "))}"

    <div id="forgeproblems"></div>
    <div style="display:flex;gap:12px;margin-top:18px">
      <button class="go" data-crsubmit="begin">Create &amp; outfit →</button>
      <button class="quiet" data-crsubmit="">Create for the roster</button>
    </div>
  </div>`;
}

async function forgeSubmit(begin) {
  const f = FORGE.form;
  // Never `begin` here: the outfitting step comes between the sheet and the road, so
  // the character goes onto the roster and the outfit page begins the game itself.
  const payload = { ...f, begin: false, world: (FORGE && FORGE.world) || "" };
  delete payload.featstext; delete payload.spellstext; delete payload.domainsearch;
  const say = lines => { $("#forgeproblems").innerHTML = `<div class="problems">${
    lines.map(p => `<div>${esc(p)}</div>`).join("")}</div>`; };

  let r, d;
  try {
    r = await fetch("/api/character/create", {
      method: "POST", headers: { "Content-Type": "application/json",
        "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "" },
      body: JSON.stringify(payload),
    });
  } catch (err) {
    say([`The app could not be reached: ${err}`]); return;
  }
  // Not `await r.json()` on its own. A server error answers with Django's HTML debug
  // page, that throws a SyntaxError inside this async handler, and an unhandled
  // rejection is invisible: the button did nothing, said nothing, and logged nothing.
  // A crash the user cannot see is worse than the crash. Blood Bending's "2d8" hit die
  // was reaching `int()` and 500ing exactly here.
  const body = await r.text();
  try {
    d = JSON.parse(body);
  } catch {
    const summary = (body.match(/<title>([\s\S]*?)<\/title>/i)?.[1] || "")
      .replace(/\s+/g, " ").trim();
    say([`The server failed with ${r.status} and did not answer in JSON.`,
         summary || body.slice(0, 200)]);
    return;
  }
  if (!r.ok) {
    say(d.problems || [d.error || "something refused"]);
    return;
  }
  if (begin) {
    window.location.href = `/outfit/?character=${encodeURIComponent(d.id)}&world=${
      encodeURIComponent((FORGE && FORGE.world) || "")}`;
    return;
  }
  // The roster block on this page is server-rendered state; a reload is the one honest
  // refresh that cannot drift from it. It reloads onto the *characters* tab naming who
  // was just made, because the plain reload landed on the shelf of worlds — the new
  // character was on a tab nobody had opened, and the button read as doing nothing.
  window.location.href = `/?made=${encodeURIComponent(d.id)}`;
}


function render() {
  tabs();
  // The forge wins over the tab: it is reachable from the shelf, from a world and
  // from the roster, and wherever it was opened is where closing it returns you.
  // The setup banner rides above every tab, not just Settings: the player's first
  // move is Available worlds, and a warning only visible behind a tab they have no
  // reason to open would be found after the refusal rather than before it.
  $("#pane").innerHTML = setupBanner() + (
    FORGE ? paneForge()
    : TAB === "worlds" ? paneWorlds()
    : TAB === "settings" ? paneSettings()
    : TAB === "homebrew" ? paneHomebrew()
    : paneCharacters());
}

document.addEventListener("input", e => {
  if (!FORGE || !e.target.dataset) return;
  const f = FORGE.form, key = e.target.dataset.cr;
  if (key === "name" || key === "heritage") { f[key] = e.target.value; return; }
  // Repaints only the results box: a full render on every keystroke would throw the
  // caret out of the very input being typed in.
  if (key === "featsearch") {
    FORGE.featq = e.target.value;
    const box = $("#featmatches");
    if (box) box.innerHTML = featMatches();
    return;
  }
  if (key === "domainsearch") {
    FORGE.domainq = e.target.value;
    const box = $("#domainmatches");
    if (box) box.innerHTML = domainMatches();
    return;
  }
  // The comma list parses on input and renders on submit, so typing is never fought.
  if (key === "spellstext") {
    f.spellbook = e.target.value.split(",").map(s => s.trim()).filter(Boolean); return;
  }
});

document.addEventListener("change", e => {
  const sel = e.target.closest('[data-field="provider"]');
  if (sel && SETTINGS) {
    // The host that goes with the provider you just picked, unless you have typed one.
    const spec = SETTINGS.providers.find(p => p.id === sel.value);
    const host = document.querySelector(
      `[data-role="${sel.dataset.role}"][data-field="host"]`);
    if (spec && host) host.value = spec.host || "";
    const role = SETTINGS.roles.find(r => r.id === sel.dataset.role);
    if (role) role.provider = sel.value;
    render();
    return;
  }
}, true);

document.addEventListener("change", e => {
  if (!FORGE || !e.target.dataset || !e.target.dataset.crskill) return;
  const f = FORGE.form, s = e.target.dataset.crskill;
  f.skills = e.target.checked
    ? [...new Set([...f.skills, s])]
    : f.skills.filter(x => x !== s);
  render();
});

function askToDelete(who) {
  return new Promise(resolve => {
    const veil = document.createElement("div");
    veil.className = "askveil";
    veil.innerHTML = `<div class="askbox" role="dialog" aria-modal="true">
      <h3>Delete ${esc(who)}?</h3>
      <p>They come off the roster, and their game is deleted with them.
        This cannot be undone.</p>
      <div class="askrow">
        <button class="quiet" data-ask="no">Keep them</button>
        <button class="go danger" data-ask="yes">Delete ${esc(who)}</button>
      </div></div>`;
    const done = answer => { veil.remove(); document.removeEventListener("keydown", key);
                             resolve(answer); };
    const key = e => { if (e.key === "Escape") done(false); };
    veil.addEventListener("click", e => {
      const b = e.target.closest("[data-ask]");
      if (b) done(b.dataset.ask === "yes");
      else if (e.target === veil) done(false);   // clicking away is not consent
    });
    document.addEventListener("keydown", key);
    document.body.appendChild(veil);
    veil.querySelector('[data-ask="no"]').focus();
  });
}

// Deleting a character. Two presses, never one: a roster row is the record of a game
// somebody played, and the confirm names them so a misclick on the wrong card is
// caught by reading rather than by regret.
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-remove]");
  if (!btn) return;
  const who = btn.dataset.name || "this character";
  // Asked in the page, not by `confirm()`. The native dialog is suppressed in the
  // app's own browser pane — a real mouse click produced no prompt and no delete, so
  // the button read as broken — and CLAUDE.md is explicit that anything working in a
  // browser has to work in the packaged desktop build.
  if (!await askToDelete(who)) return;
  try {
    const r = await fetch("/api/character/delete", {
      method: "POST", headers: { "Content-Type": "application/json",
        "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "" },
      body: JSON.stringify({ id: btn.dataset.remove }),
    });
    const body = await r.text();
    let d; try { d = JSON.parse(body); } catch { d = { error: body.slice(0, 160) }; }
    if (!r.ok) { alert(d.error || "could not delete"); return; }
    window.location.href = "/";       // the roster is server-rendered
  } catch (err) { alert(String(err)); }
});

document.addEventListener("click", async e => {
  if (e.target.closest("#lanopen")) { LAN = null; render(); return lanFetch("/api/lan/open", "POST"); }
  if (e.target.closest("#lanclose")) { LAN = null; render(); return lanFetch("/api/lan/close", "POST"); }

  const tab = e.target.closest("[data-tab]");
  if (tab) {
    TAB = tab.dataset.tab; WORLD = null; BENCH = null;
    if (TAB === "settings" && !SETTINGS) {
      render();
      SETTINGS = await (await fetch("/api/settings/models")).json();
    }
    // Asked when the tab is opened rather than at page load: it is the only thing on
    // this page that needs to know whether a socket is bound, and the front page should
    // not be doing that work for players who never open Settings.
    if (TAB === "settings" && !LAN) lanFetch("/api/lan");
    render(); return;
  }

  // First run. Handled before everything else because the banner sits above every
  // pane, so its button can be clicked from any tab.
  const go = e.target.closest("[data-go]");
  if (go) {
    TAB = go.dataset.go; WORLD = null; BENCH = null; FORGE = null;
    if (TAB === "settings" && !SETTINGS) {
      render();
      SETTINGS = await (await fetch("/api/settings/models")).json();
    }
    render(); return;
  }
  if (e.target.closest('[data-setup="recheck"]')) { await refreshSetup(); return; }
  if (e.target.closest("[data-install]")) { await installOllama(); return; }
  const pull = e.target.closest("[data-pull]");
  if (pull) { await pullModel(pull.dataset.pull); return; }

  if (e.target.closest("[data-import]")) {
    // The button opens the hidden input; the input's own change event does the work.
    // Reset first, or picking the same file twice in a row fires no change at all —
    // which reads as the button having stopped working.
    const input = document.getElementById("worldfile");
    if (input) { input.value = ""; input.click(); }
    return;
  }

  if (e.target.closest("[data-forge]")) {
    // The world the character is for. From a world's page, that world; from the
    // shelf or the roster, the world of the game in progress, else the first on the
    // shelf — the shelf's own button opened a forge with no world at all, and so with
    // none of the world's races (2026-09-08). The forge shows the choice and lets it
    // change, which refetches the races that world offers.
    const playing = STATE.continue && STATE.worlds.find(w => w.name === STATE.continue.world);
    const first = STATE.worlds.find(w => w.playable);
    const worldId = WORLD ? WORLD.id : (playing ? playing.id : (first ? first.id : ""));
    const opts = await (await fetch("/api/create/options" + (worldId ? `?world=${encodeURIComponent(worldId)}` : ""))).json();
    FORGE = { opts, form: forgeDefaults(opts), world: worldId };
    render(); return;
  }
  if (e.target.closest("[data-unforge]")) { FORGE = null; render(); return; }
  if (FORGE) {
    const f = FORGE.form;
    const world = e.target.closest("[data-crworld]");
    if (world) {
      // A different world offers different races; the rest of the form stands.
      FORGE.world = world.dataset.crworld;
      FORGE.opts = await (await fetch(`/api/create/options?world=${encodeURIComponent(FORGE.world)}`)).json();
      if (!FORGE.opts.races.some(r => r.id === f.race)) { f.race = ""; f.choices = []; f.heritage = ""; }
      render(); return;
    }
    const info = e.target.closest("[data-crinfo]");
    if (info) { e.preventDefault(); e.stopPropagation(); showRaceCard(info.dataset.crinfo); return; }
    const race = e.target.closest("[data-crrace]");
    if (race) { f.race = race.dataset.crrace; f.choices = []; render(); return; }
    const heritage = e.target.closest("[data-crheritage]");
    if (heritage) {
      f.heritage = f.heritage === heritage.dataset.crheritage ? "" : heritage.dataset.crheritage;
      render(); return;
    }
    // `hasAttribute`, not truthiness: "no background" is a real choice and its button
    // carries an empty value, which `closest("[data-crbackground]").dataset` reads as
    // "" — indistinguishable from no match if this asked whether the value was set.
    const bg = e.target.closest("[data-crbackground]");
    if (bg) { f.background = bg.dataset.crbackground || ""; render(); return; }
    const cls = e.target.closest("[data-crclass]");
    // Paths belong to the class that offers them, so changing class drops them.
    if (cls) { f.class = cls.dataset.crclass; f.paths = []; render(); return; }
    const path = e.target.closest("[data-crpath]");
    if (path) {
      const name = path.dataset.crpath;
      // Order is the meaning, so a path is appended and never sorted: the first
      // taken is Path A and the second Path B. A third is refused here as well as by
      // the server, because a disabled button the page still honours is a lie.
      f.paths = f.paths.includes(name)
        ? f.paths.filter(x => x !== name)
        : f.paths.length >= 2 ? f.paths : [...f.paths, name];
      render(); return;
    }
    const bonus = e.target.closest("[data-crbonus]");
    if (bonus) {
      const slot = Number(bonus.dataset.crslot || 0);
      f.choices = [...f.choices];
      f.choices[slot] = bonus.dataset.crbonus;
      render(); return;
    }
    const gender = e.target.closest("[data-crgender]");
    if (gender) {
      f.gender = gender.dataset.crgender;
      // Kept in step here as well as on the server, so the sheet the player is shown
      // never disagrees with the one that gets saved.
      f.pronouns = PRONOUNS_FOR[f.gender] || f.gender;
      render(); return;
    }
    const addfeat = e.target.closest("[data-craddfeat]");
    if (addfeat) {
      f.feats = [...new Set([...f.feats, addfeat.dataset.craddfeat])];
      render();
      // Back into the search, because the next feat is usually the next thing typed.
      const s = $("#featsearch"); if (s) { s.focus(); s.select(); }
      return;
    }
    const unfeat = e.target.closest("[data-crunfeat]");
    if (unfeat) {
      f.feats = f.feats.filter(x => x !== unfeat.dataset.crunfeat);
      render(); return;
    }
    const adddomain = e.target.closest("[data-cradddomain]");
    if (adddomain) {
      f.domains = [...new Set([...(f.domains || []), adddomain.dataset.cradddomain])];
      render();
      const box = $("#domainsearch"); if (box) { box.focus(); box.select(); }
      return;
    }
    const undomain = e.target.closest("[data-crundomain]");
    if (undomain) {
      f.domains = (f.domains || []).filter(x => x !== undomain.dataset.crundomain);
      render(); return;
    }
    const up = e.target.closest("[data-abup]");
    if (up) { f.abilities[up.dataset.abup] += 1; render(); return; }
    const dn = e.target.closest("[data-abdn]");
    if (dn) { f.abilities[dn.dataset.abdn] -= 1; render(); return; }
    const sub = e.target.closest("[data-crsubmit]");
    if (sub) { await forgeSubmit(sub.dataset.crsubmit === "begin"); return; }
  }

  const world = e.target.closest("[data-world]");
  if (world) {
    const card = STATE.worlds.find(w => w.id === world.dataset.world);
    if (!card.playable) { return; }
    WORLD = card; DETAIL = null; PICKED = null; render();
    DETAIL = await (await fetch(`/api/world/${encodeURIComponent(card.id)}`)).json();
    render();
    return;
  }
  if (e.target.closest("[data-back]")) { WORLD = null; render(); return; }

  const pregen = e.target.closest("[data-pregen]");
  if (pregen) { PICKED = pregen.dataset.pregen; render(); return; }

  const start = e.target.closest("[data-start]");
  if (start && !start.disabled) {
    try {
      await post("/api/start", { world: start.dataset.start, source: PICKED });
      location.href = "/play/";
    } catch (err) { if (!blockedByModel(err)) $("#err").textContent = err.message; }
    return;
  }

  const resume = e.target.closest("[data-resume]");
  if (resume) {
    try {
      await post("/api/resume", { id: resume.dataset.resume });
      location.href = "/play/";
    } catch (err) {
      if (!blockedByModel(err)) { const el = $("#err"); if (el) el.textContent = err.message; }
    }
    return;
  }

  // Back to the outfitter for a character already on the roster. Same page the forge
  // sends you to, reached on purpose rather than only on the way past (item 24).
  const outfit = e.target.closest("[data-outfit]");
  if (outfit) {
    const world = outfit.dataset.outfitWorld || "";
    location.href = `/outfit/?character=${encodeURIComponent(outfit.dataset.outfit)}` +
      (world ? `&world=${encodeURIComponent(world)}` : "");
    return;
  }

  const spellRow = e.target.closest("[data-spell]");
  if (spellRow) {
    OPEN_SPELL = OPEN_SPELL === spellRow.dataset.spell ? "" : spellRow.dataset.spell;
    render();
    return;
  }
  if (e.target.closest("#sp-clear")) {
    SP = { q: "", school: "", descriptor: "", tag: "", class: "", level: "" };
    await loadSpells();
    return;
  }

  const tier = e.target.closest("[data-hbtier]");
  if (tier) { await setHouseRule({ point_buy: Number(tier.dataset.hbtier) }); return; }
  const stack = e.target.closest("[data-hbstack]");
  if (stack) { await setHouseRule({ magic_stacking: !RULES.rules.magic_stacking }); return; }
  if (e.target.closest("#savemodels")) { await saveModelSettings(); return; }
  const cap = e.target.closest("[data-hbcap]");
  if (cap) { await setHouseRule({ ability_cap: Number(cap.dataset.hbcap) }); return; }
  const racerp = e.target.closest("[data-hbracerp]");
  if (racerp) { await setHouseRule({ race_rp: Number(racerp.dataset.hbracerp) }); return; }
  const core = e.target.closest("[data-hbcore]");
  if (core) { await setHouseRule({ core_races: RULES.rules.core_races === false }); return; }
  const gmv = e.target.closest("[data-hbgmview]");
  if (gmv) { await setHouseRule({ gm_view: !RULES.rules.gm_view }); return; }
  const know = e.target.closest("[data-hbknow]");
  if (know) { await setHouseRule({ knowledge_offer: !RULES.rules.knowledge_offer }); return; }
  const cont = e.target.closest("[data-hbcontent]");
  if (cont) { await setHouseRule({ content: RULES.rules.content === "explicit" ? "fade" : "explicit" }); return; }
  const imp = e.target.closest("[data-importraces]");
  if (imp) {
    imp.disabled = true;
    try {
      const d = await post("/api/homebrew/races/import", { world: imp.dataset.importraces });
      BENCH = await (await fetch("/api/bench/races")).json();
      BENCH.note = d.written.length
        ? `${d.written.length} race${d.written.length === 1 ? "" : "s"} written to the bench: ${d.written.join(", ")}.`
        : `${d.races.length ? d.races.join(", ") + " already on the bench" : "That world describes no people as a body"}${
            d.heritages.length ? ` — ${d.heritages.join(", ")} are heritages, offered by name in the forge` : ""}.`;
    } catch (err) { BENCH.note = err.message; }
    render();
    return;
  }

  const bench = e.target.closest("[data-bench]");
  if (bench && !bench.disabled) {
    BENCH = await (await fetch(`/api/bench/${encodeURIComponent(bench.dataset.bench)}`)).json();
    if (BENCH.bench.id === "rulesets") {
      RULES = await (await fetch("/api/homebrew/rules")).json();
      render(); return;
    }
    if (BENCH.bench.builder === "effects") {
      if (!CAT) CAT = await (await fetch("/api/effects/catalogue")).json();
      if (!KINDS) {
        const d = await (await fetch("/api/kinds")).json();
        KINDS = Object.fromEntries(d.kinds.map(k => [k.id, k]));
      }
    }
    DRAFT = emptyDraft();
    EDITING = ""; LINES = [];
    if (BENCH.bench.id === "spells") { OPEN_SPELL = ""; await loadSpells(); return; }
    render();
    return;
  }

  const add = e.target.closest("[data-add]");
  if (add) {
    // A new effect starts as the first type of the first category, so the form is never
    // empty and the player sees what a filled-in effect looks like immediately.
    const first = CAT.categories[0].types[0].id;
    listAt(add.dataset.add).push({ type: first });
    await repreview();
    return;
  }
  const gone = e.target.closest("[data-remove]");
  if (gone) {
    const { list, index } = at(gone.dataset.remove);
    list.splice(index, 1);
    await repreview();
    return;
  }
  const open = e.target.closest("[data-open]");
  // A race opens on its own page of pickers rather than in the generated form.
  if (open && BENCH && BENCH.bench.id === "races") {
    location.href = `${BENCH.bench.builder_url}?open=${encodeURIComponent(open.dataset.open)}`;
    return;
  }
  if (open && BENCH && BENCH.bench.builder) {
    const d = await (await fetch(
      `/api/bench/${encodeURIComponent(BENCH.bench.id)}/open/${
        encodeURIComponent(open.dataset.open)}`)).json();
    if (d.error) { render(); return; }
    // Everything the entry carries, not four named keys. A creature opened into a draft
    // that kept only name/kind/description/effects would save those four over a stat
    // block and silently drop its hit points on the way through.
    DRAFT = Object.assign({}, d);
    DRAFT.effects = d.effects || [];
    EDITING = d.id;
    await repreview();
    return;
  }
  if (e.target.closest("#d-new")) {
    DRAFT = emptyDraft();
    EDITING = ""; LINES = []; render();
    return;
  }
  if (e.target.closest("#d-save")) {
    try {
      const d = await post(`/api/bench/${encodeURIComponent(BENCH.bench.id)}/save`,
                           Object.assign({}, DRAFT));
      DRAFT = emptyDraft();
      EDITING = "";
      LINES = [];
      BENCH = await (await fetch(
        `/api/bench/${encodeURIComponent(BENCH.bench.id)}`)).json();
      render();
      $("#d-msg").textContent = d.lines && d.lines.length
        ? `Saved: ${d.lines.join(" · ")}` : "Saved.";
    } catch (err) { $("#d-msg").innerHTML =
      `<span style="color:var(--alarm)">${esc(err.message)}</span>`; }
    return;
  }
  if (e.target.closest("[data-backbench]")) { BENCH = null; render(); return; }
});

// The draft is edited in place and re-previewed; the server owns validation and the
// rendered line, so what the builder shows is what a card will show.
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "sp-q") {
    SP.q = t.value;
    clearTimeout(window._spTimer);
    window._spTimer = setTimeout(loadSpells, 300);
    return;
  }
  // Stored by declared field name. The three `t.id ===` lines this replaced could only
  // ever know about the three inputs written into the template.
  if (t.dataset && t.dataset.draft) {
    const name = t.dataset.draft;
    if (t.dataset.item !== undefined) {
      const on = new Set(DRAFT[name] || []);
      t.checked ? on.add(t.dataset.item) : on.delete(t.dataset.item);
      // Held in the declared order rather than click order, so re-opening a saved entry
      // shows the same list it was saved as and the file produces no diff of its own.
      const order = fieldsFor().find(f => f.name === name);
      DRAFT[name] = (order ? order.choices : [...on]).filter(c => on.has(c));
      return;
    }
    DRAFT[name] = t.type === "number" && t.value !== ""
      ? Number(t.value) : t.value;
    return;
  }
  if (!t.dataset || !t.dataset.fx) return;
  const { spec } = at(t.dataset.fx);
  const key = t.dataset.field;
  if (t.dataset.part) {
    spec[key] = spec[key] || {};
    spec[key][t.dataset.part] = t.value;
  } else {
    spec[key] = t.value;
  }
  clearTimeout(window._fxTimer);
  window._fxTimer = setTimeout(repreview, 350);
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.sp) { SP[t.dataset.sp] = t.value; await loadSpells(); return; }
  if (t.dataset && t.dataset.cat !== undefined && t.dataset.cat !== "") {
    // Changing the kind resets the type, because the fields are different — carrying the
    // old values over would leave a form half-filled with values that no longer apply.
    const { spec } = at(t.dataset.cat);
    const cat = CAT.categories.find(c => c.id === t.value);
    Object.keys(spec).forEach(k => delete spec[k]);
    spec.type = cat.types[0].id;
    await repreview();
    return;
  }
  if (t.dataset && t.dataset.type !== undefined && t.dataset.type !== "") {
    const { spec } = at(t.dataset.type);
    Object.keys(spec).forEach(k => delete spec[k]);
    spec.type = t.value;
    await repreview();
    return;
  }
  if (t.dataset && t.dataset.fx) {
    const { spec } = at(t.dataset.fx);
    if (t.dataset.part) {
      spec[t.dataset.field] = spec[t.dataset.field] || {};
      spec[t.dataset.field][t.dataset.part] = t.value;
    } else {
      spec[t.dataset.field] = t.value;
    }
    await repreview();
  }
});

// Delegated on the document, because the pane is re-rendered from scratch on every state
// change and a listener bound to the input itself dies with the markup it was bound to.
document.addEventListener("change", async e => {
  const input = e.target.closest("#worldfile");
  if (!input || !input.files || !input.files[0]) return;
  const file = input.files[0];
  // Re-queried on every call, not captured once: `render()` replaces the pane wholesale,
  // so the node this message goes in is a different node after the shelf refreshes.
  const tell = (text, bad) => {
    const say = document.getElementById("importsay");
    if (say) { say.textContent = text; say.style.color = bad ? "var(--alarm)" : "var(--brew)"; }
  };
  tell(`Reading ${file.name}…`, false);

  // FormData rather than JSON: a world export is megabytes, and base64 in a JSON body
  // would inflate it by a third for no reason.
  const form = new FormData();
  form.append("world", file);
  try {
    const r = await fetch("/api/worlds/import", {
      method: "POST",
      headers: { "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "" },
      body: form,
    });
    // Read as text first. A 500 returns Django's HTML error page, and `r.json()` on that
    // throws a parse error that says nothing about what actually went wrong.
    const raw = await r.text();
    let data = {};
    try { data = JSON.parse(raw); } catch { data = { error: `HTTP ${r.status}` }; }
    if (!r.ok) { tell(data.error || `HTTP ${r.status}`, true); return; }
    STATE.worlds = (await (await fetch("/api/worlds")).json()).worlds;
    render();
    tell(`${data.world.name} is on the shelf. Pick it to start a game there.`, false);
  } catch (err) {
    tell(err.message, true);
  }
});

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "",
    },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) {
    const err = new Error(data.error || ("HTTP " + r.status));
    // The whole body, not just its message. The model gate refuses with the setup
    // report attached so the caller can put the player in front of the fix rather
    // than in front of a sentence describing it.
    err.data = data;
    throw err;
  }
  return data;
}

render();
// Asked on every load, never cached: Ollama can be stopped, a model deleted and a role
// repointed between one visit to this page and the next, and a cached "ready" would
// send the player to a table that cannot write them a scene. One HTTP call.
refreshSetup();
// Settings is rendered from SETTINGS, which is otherwise only fetched when the tab is
// clicked. Arriving on it by redirect skips that click, and the pane would sit on
// "Reading the model settings…" forever.
if (SENT_TO_SETUP && !SETTINGS) {
  fetch("/api/settings/models").then(r => r.json()).then(d => { SETTINGS = d; render(); });
}
</script>
<!-- The build the player is actually running, so a finding is never filed
     against a version that no longer exists. Stamped at package time. -->
<div style="position:fixed; right:10px; bottom:6px; font-size:11px; opacity:.45;
            font-family:monospace; pointer-events:none;">build {{ build }}</div>
<!-- The heartbeat that lets the packaged exe tell an open window from a closed
     one. Every page carries it; tests/test_packaging.py fails if one does not. -->
<script src="{% static 'js/keepalive.js' %}"></script>
</body>
</html>
