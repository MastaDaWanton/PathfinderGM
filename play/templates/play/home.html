{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathfinder GM</title>
<style>
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 400; font-display: swap;
    src: local("Cinzel"), url("{% static 'fonts/Cinzel-Regular.woff2' %}") format("woff2");
  }
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 600; font-display: swap;
    src: local("Cinzel SemiBold"), url("{% static 'fonts/Cinzel-SemiBold.woff2' %}") format("woff2");
  }
  :root {
    --display: "Cinzel", "Trajan Pro", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --body: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --bg: #0f0d0b; --panel: #17130f; --edge: #3a2f22; --ink: #e6dcc6;
    --dim: #8e816a; --accent: #c9a86a; --alarm: #a8443a;
    --gold: #d9c08a; --gold-dim: #7a6543; --sunk: #0c0a08;
    --brew: #6fcf8f; --brew-dim: #2f5f42;
  }
  * { box-sizing: border-box; }
  body {
    /* Fixed frame, scrolling panes — the same rule the table and the bench needed.
       A grid or flex child will not shrink below its content without `min-height: 0`. */
    margin: 0; color: var(--ink); font: 16px/1.6 var(--body);
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    background:
      linear-gradient(rgba(10, 8, 6, .40), rgba(7, 5, 4, .58)),
      url("{% static 'img/grimoire-leather.jpg' %}") center / cover no-repeat fixed #0d0b09;
  }

  header {
    border-bottom: 1px solid var(--gold-dim); padding: 0 30px;
    background: linear-gradient(#1b1510, #120e0a);
    display: flex; align-items: flex-end; gap: 26px; flex-wrap: wrap;
  }
  h1 {
    margin: 20px 0; color: var(--gold); white-space: nowrap;
    font: 400 30px/1 var(--display); letter-spacing: .1em; font-variant: small-caps;
  }
  h1 small { display: block; margin-top: 6px; color: var(--dim);
             font: italic 12px/1 var(--body); letter-spacing: .02em;
             font-variant: normal; }
  nav { display: flex; gap: 2px; align-self: flex-end; flex-wrap: wrap; }
  .tab {
    background: linear-gradient(#171209, #100d08); color: var(--dim); cursor: pointer;
    border: 1px solid var(--edge); border-bottom: none; padding: 11px 22px 10px;
    border-radius: 3px 3px 0 0; font: 400 16px/1 var(--display);
    letter-spacing: .07em; font-variant: small-caps; position: relative; top: 1px;
  }
  .tab:hover:not(.on) { color: var(--ink); }
  .tab.on {
    color: var(--gold); background: linear-gradient(#241c12, var(--panel));
    border-color: var(--gold-dim); box-shadow: inset 0 2px 0 rgba(217,192,138,.22);
  }
  .tab b { display: inline-block; margin-left: 7px; color: var(--dim);
           font: 600 11px/1 var(--body); }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 30px 40px; }
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* --- continue --- */
  .continue {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    background: linear-gradient(#1d2a22, #141c17); border: 1px solid var(--brew-dim);
    border-radius: 3px; padding: 18px 22px; margin-bottom: 26px;
  }
  .continue .who { flex: 1; min-width: 220px; }
  .continue .who b { display: block; color: var(--brew);
    font: 400 24px/1.2 var(--display); letter-spacing: .04em; font-variant: small-caps; }
  .continue .who span { color: var(--dim); font-size: 14px; }
  a.go, button.go {
    display: inline-block; text-decoration: none; cursor: pointer;
    font: 400 17px/1 var(--display); letter-spacing: .1em; font-variant: small-caps;
    padding: 14px 30px; border-radius: 2px; color: var(--brew);
    background: linear-gradient(#1f3327, #16241c); border: 1px solid var(--brew-dim);
  }
  a.go:hover, button.go:hover { border-color: var(--brew); color: #b6f0ca; }
  button.quiet {
    cursor: pointer; font: 400 14px/1 var(--display); letter-spacing: .08em;
    font-variant: small-caps; padding: 10px 18px; border-radius: 2px;
    color: var(--gold); background: linear-gradient(#2a2114, #1a140c);
    border: 1px solid var(--gold-dim);
  }
  button.quiet:hover:not(:disabled) { border-color: var(--accent); color: #f0dcae; }
  button.quiet:disabled { opacity: .35; cursor: not-allowed; }

  /* --- cards --- */
  .cards { display: grid; gap: 32px;
           grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    background: linear-gradient(#191309, #120e09); border: 1px solid var(--edge);
    border-radius: 3px; padding: 16px 18px; text-align: left;
    box-shadow: inset 0 0 40px rgba(0,0,0,.5);
  }
  .card.pick { cursor: pointer; }
  .card.pick:hover { border-color: var(--accent); }
  .card.on { border-color: var(--gold); }
  .card.bad { border-color: #5a2f2a; }
  .card h3 {
    margin: 0 0 4px; color: var(--gold); font: 400 21px/1.2 var(--display);
    letter-spacing: .04em; font-variant: small-caps;
  }
  .card em { display: block; color: var(--dim); font: italic 13px/1.5 var(--body);
             margin-bottom: 9px; }
  .card .stat { color: var(--dim); font: 13px/1.6 var(--body); }
  .card .stat b { color: var(--ink); font-weight: 600; }
  .pill {
    display: inline-block; margin: 0 5px 5px 0; padding: 3px 9px; border-radius: 10px;
    background: rgba(217,192,138,.07); border: 1px solid var(--gold-dim);
    color: var(--dim); font: 12px/1.4 var(--body);
  }
  .pill.now { border-color: var(--brew-dim); color: var(--brew); }
  .pill.dead { border-color: #5a2f2a; color: #cf9d95; }
  .pill.soon { opacity: .5; }

  h2.sect {
    margin: 28px 0 12px; color: var(--gold); font: 400 16px/1 var(--display);
    letter-spacing: .12em; font-variant: small-caps; padding-bottom: 6px;
    border-bottom: 1px solid #2b2319;
  }
  h2.sect:first-child { margin-top: 0; }
  .note { color: var(--dim); font: italic 14px/1.6 var(--body); margin: 0 0 14px; }
  .bad-note { color: #cf9d95; font-size: 13px; }
  #err { color: var(--alarm); min-height: 1.4em; margin-top: 12px; font-size: 14px; }

  .rows { max-height: 340px; overflow-y: auto; margin-top: 10px; }
  .rows table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rows td { padding: 4px 6px; border-bottom: 1px solid #241d15; }
  .rows td:nth-child(2) { color: var(--dim); width: 22%; }
  .rows td:last-child { color: var(--dim); text-align: right; }
  /* Yours reads green, the shipped tables read plain, so nothing on this page can be
     mistaken for something you wrote. */
  .rows tr.mine td { color: var(--brew); }
  .rows tr.mine td:nth-child(2) { color: var(--brew-dim); }
  .rows tr.open { cursor: pointer; }
  .rows tr.open:hover td { background: rgba(217,192,138,.05); color: var(--ink); }
  /* Converted mechanically and never read by a person. Worth saying: 161 entries were
     turned into effects by a parser, and the parse is a starting point, not an answer. */
  .unread { color: var(--gold-dim); font: italic 10px/1 var(--body);
            border: 1px solid var(--gold-dim); border-radius: 8px; padding: 1px 6px; }
  .spellbody { padding: 12px 8px 16px !important; }
  .spellbody p { margin: 0 0 10px; color: var(--ink); font-size: 14px; line-height: 1.6;
                 white-space: pre-wrap; }
  .spellbody .terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr));
                      gap: 3px 14px; }
  .spellbody .t { display: flex; justify-content: space-between; gap: 10px;
                  border-bottom: 1px solid #241d15; padding: 2px 0; font-size: 12px; }
  .spellbody .t span { color: var(--dim); }
  .spellbody .t b { color: var(--ink); font-weight: 600; text-align: right; }
  .waiting {
    margin-top: 9px; padding: 8px 10px; border-radius: 2px; color: #cfc4ab;
    background: rgba(217,192,138,.05); border-left: 2px solid var(--gold-dim);
    font: italic 12px/1.5 var(--body);
  }
  code { color: var(--dim); font: 12px/1.4 ui-monospace, monospace; }

  /* --- the effect builder --- */
  .build { background: linear-gradient(#191309, #120e09); border: 1px solid var(--edge);
           border-radius: 3px; padding: 18px 20px; margin-bottom: 20px; }
  .build label { display: block; color: var(--dim); font: 12px/1.6 var(--body);
                 letter-spacing: .04em; margin-bottom: 3px; }
  .build input[type=text], .build textarea, .build select {
    width: 100%; padding: 8px 10px; font: 14px var(--body); color: var(--ink);
    background: var(--sunk); border: 1px solid var(--edge); border-radius: 2px;
    margin-bottom: 11px;
  }
  .build textarea { min-height: 74px; resize: vertical; line-height: 1.55; }
  .build input:focus, .build select:focus, .build textarea:focus {
    outline: none; border-color: var(--gold-dim); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .fx-card {
    border: 1px solid var(--edge); border-left: 2px solid var(--gold-dim);
    border-radius: 2px; padding: 12px 14px; margin-bottom: 11px;
    background: rgba(0,0,0,.22);
  }
  .fx-card > header {
    display: flex; align-items: baseline; gap: 10px; padding: 0; border: none;
    background: none; margin-bottom: 10px;
  }
  .fx-card .line {
    flex: 1; color: var(--brew); font: 14px/1.4 var(--body);
  }
  .fx-card .line.bad { color: #cf9d95; }
  .fx-card .drop { cursor: pointer; background: none; border: none; color: var(--dim);
                   font: 16px/1 var(--body); padding: 0 4px; }
  .fx-card .drop:hover { color: var(--alarm); }
  .fx-card.nested { margin-left: 18px; border-left-color: var(--brew-dim); }
  .addfx {
    cursor: pointer; width: 100%; padding: 11px; border-radius: 2px;
    color: var(--gold); background: linear-gradient(#221a10, #15100a);
    border: 1px dashed var(--gold-dim); font: 400 14px/1 var(--display);
    letter-spacing: .1em; font-variant: small-caps;
  }
  .addfx:hover { border-color: var(--accent); border-style: solid; }
  .warn { color: #cfc4ab; font: italic 12px/1.5 var(--body); margin: -6px 0 10px; }
  .ok { color: var(--brew); font-size: 14px; }

  /* --- The forge: character creation ------------------------------------------- */
  .forge h2.sect { margin-top: 26px; }
  .forge .cards.tight { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 26px; }
  .forge .card.pick.on { border-color: var(--accent);
                         box-shadow: 0 0 18px rgba(201,168,106,.12); }
  .forge input[type=text] {
    width: 100%; color: var(--ink); padding: 10px 13px; font: inherit;
    border-radius: 2px; background: linear-gradient(var(--sunk), #14100c);
    border: 1px solid #2e251a; box-shadow: inset 0 2px 6px rgba(0,0,0,.6);
  }
  .forge input[type=text]:focus { outline: none; border-color: var(--accent); }
  .forge .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .abrow { display: flex; align-items: center; justify-content: space-between;
           gap: 8px; padding: 6px 0; border-bottom: 1px dotted #2a2620; }
  .abrow b { width: 42px; color: var(--gold); font: 400 14px/1 var(--display);
             letter-spacing: .1em; font-variant: small-caps; }
  .abrow .val { width: 60px; text-align: center; color: var(--accent);
                font: 400 21px/1 var(--display); }
  .abrow .fin { color: var(--dim); font-size: 12px; width: 84px; text-align: right; }
  .abrow button { width: 26px; height: 26px; padding: 0; line-height: 1;
                  letter-spacing: 0; font: 400 16px/1 Georgia, serif; }
  .budget { display: flex; justify-content: space-between; margin: 8px 0 2px;
            color: var(--dim); font-size: 13px; }
  .budget b { color: var(--accent); }
  .budget.over b { color: var(--alarm); }
  .skillgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
               gap: 2px 16px; }
  .skillgrid label { display: flex; gap: 7px; align-items: center; padding: 3px 0;
                     cursor: pointer; font-size: 14px; }
  .skillgrid label.classskill { color: var(--gold); }
  .skillgrid input { accent-color: #c9a86a; }
  .problems { border: 1px solid #4a2620; background: rgba(110,31,31,.12);
              border-radius: 2px; padding: 10px 14px; margin: 12px 0; color: #d08a7c; }
  .problems div { padding: 2px 0; }
  .forge .traits { color: var(--dim); font-size: 12.5px; font-style: italic; }

  /* --- Second pass: obsidian crystal, matching the table ------------------------ */
  .card {
    isolation: isolate; position: relative;
    background:
      linear-gradient(rgba(16, 12, 8, .04), rgba(8, 6, 4, .20)),
      url("{% static 'img/card-leather.jpg' %}") #241d15;
    background-size: auto, 400px auto;
    border-color: rgba(201, 162, 39, .25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .6),
                inset 0 1px 0 rgba(255, 230, 150, .08);
    transition: transform .4s cubic-bezier(.25, .8, .25, 1),
                border-color .3s ease, box-shadow .4s ease;
  }
  /* The glowing edge, widened into metal. A five-pixel bevel ring drawn as a
     gradient — struck light at the top-left, falling to shadow, kicking back
     to light along the bottom lip, which is what makes a band read as raised
     rather than painted — masked to a ring so the leather shows through the
     middle, glowing faintly, and sitting at z-index 2: over the surface,
     under the clasps and corner pieces at 3, which bolt through it. */
  .card::before {
    content: ""; position: absolute; inset: -4px; pointer-events: none;
    border-radius: inherit; z-index: 2; padding: 5px;
    background: linear-gradient(135deg,
      #f0d9a0 0%, #b98f4e 16%, #6b4f28 42%, #3a2c17 60%, #c9a86a 86%, #f4e3b2 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    box-shadow: 0 0 16px rgba(255, 176, 84, .16), 0 3px 8px rgba(0, 0, 0, .55);
  }
  .card.pick:hover, .card:hover {
    border-color: rgba(232, 197, 71, .45);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .7),
                0 0 20px rgba(201, 162, 39, .15),
                inset 0 1px 0 rgba(255, 230, 150, .12);
  }

  /* Engraved bronze on the leather: shadow above the stroke, light below. */
  .card h3 {
    color: #b6905e;
    text-shadow: 0 -1px 1px rgba(0, 0, 0, .92), 0 1px 0 rgba(255, 225, 175, .16);
  }

  .card.pick:hover { transform: translateY(-4px); }
  .card.pick.on, .card.on {
    border-color: rgba(232, 197, 71, .55);
    box-shadow: 0 0 22px rgba(201, 162, 39, .18),
                inset 0 1px 0 rgba(255, 230, 150, .12);
  }
  header { background: rgba(20, 16, 12, .72);
           -webkit-backdrop-filter: blur(14px) saturate(130%);
           backdrop-filter: blur(14px) saturate(130%); }
  /* 4. Embers, third generation: thicker and deeper. Four layers now — a new
     nearest sheet of big soft coals drifting fast in front, then the bright
     motes, the mid-field, and the far dust behind its half-pixel blur. Every
     sheet carries more particles than before, each with a soft outer halo
     stop so a mote reads as a glowing coal rather than a pixel. The sway is
     still baked into the rise so the loop stays seamless, and each layer
     still flickers on its own prime-numbered clock. */
  #embers { position: fixed; inset: 0; pointer-events: none; z-index: 0;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to top, #000 0%, #000 55%,
                                                transparent 96%);
            mask-image: linear-gradient(to top, #000 0%, #000 55%,
                                        transparent 96%); }
  #embers i { position: absolute; left: 0; right: 0; top: 0; height: 200%;
              will-change: transform; }
  #embers i:nth-child(1) {          /* nearest: big soft coals */
    background-image:
      radial-gradient(4.5px 4.5px at 18% 22%, rgba(255,160,70,.5), rgba(255,120,40,.14) 55%, transparent 75%),
      radial-gradient(5px 5px at 74% 64%, rgba(255,180,90,.42), rgba(255,130,50,.12) 55%, transparent 75%),
      radial-gradient(4px 4px at 44% 88%, rgba(255,150,60,.46), rgba(255,110,40,.12) 55%, transparent 75%);
    background-size: 300px 300px;
    filter: blur(.6px);
    animation: emberrise 18s linear infinite, emberflick 4.1s ease-in-out infinite;
  }
  #embers i:nth-child(2) {          /* near: bright, warm, quick */
    background-image:
      radial-gradient(3px 3px at 22% 12%, rgba(255,170,80,.9), rgba(255,140,60,.2) 55%, transparent 75%),
      radial-gradient(2.6px 2.6px at 68% 38%, rgba(255,195,105,.75), rgba(255,150,70,.18) 55%, transparent 75%),
      radial-gradient(3.4px 3.4px at 45% 68%, rgba(255,150,60,.8), rgba(255,120,40,.2) 55%, transparent 75%),
      radial-gradient(2.4px 2.4px at 88% 82%, rgba(255,205,120,.65), transparent 70%),
      radial-gradient(2.8px 2.8px at 8% 90%, rgba(255,175,85,.75), rgba(255,140,60,.18) 55%, transparent 75%),
      radial-gradient(2.2px 2.2px at 55% 25%, rgba(255,185,95,.6), transparent 70%),
      radial-gradient(2.6px 2.6px at 33% 45%, rgba(255,165,75,.7), transparent 70%);
    background-size: 260px 260px;
    animation: emberrise 26s linear infinite, emberflick 5.3s ease-in-out infinite;
    animation-delay: -6s, -1s;
  }
  #embers i:nth-child(3) {          /* mid */
    background-image:
      radial-gradient(2px 2px at 15% 25%, rgba(240,180,95,.6), transparent 70%),
      radial-gradient(1.8px 1.8px at 55% 55%, rgba(232,170,80,.5), transparent 70%),
      radial-gradient(2.2px 2.2px at 80% 15%, rgba(250,190,100,.55), transparent 70%),
      radial-gradient(1.7px 1.7px at 35% 85%, rgba(232,197,71,.5), transparent 70%),
      radial-gradient(1.9px 1.9px at 95% 65%, rgba(240,180,90,.45), transparent 70%),
      radial-gradient(1.6px 1.6px at 62% 92%, rgba(245,185,95,.45), transparent 70%),
      radial-gradient(2px 2px at 5% 55%, rgba(238,178,88,.5), transparent 70%);
    background-size: 340px 340px;
    animation: emberrise 52s linear infinite, emberflick 7.1s ease-in-out infinite;
    animation-delay: -13s, -2s;
  }
  #embers i:nth-child(4) {          /* far: dust motes behind the haze */
    background-image:
      radial-gradient(1.2px 1.2px at 30% 20%, rgba(220,180,110,.45), transparent 70%),
      radial-gradient(1.2px 1.2px at 70% 45%, rgba(201,162,39,.4), transparent 70%),
      radial-gradient(1.4px 1.4px at 10% 60%, rgba(230,190,120,.35), transparent 70%),
      radial-gradient(1.2px 1.2px at 50% 92%, rgba(220,170,90,.35), transparent 70%),
      radial-gradient(1.3px 1.3px at 90% 78%, rgba(210,170,100,.35), transparent 70%),
      radial-gradient(1.1px 1.1px at 42% 8%, rgba(215,175,105,.32), transparent 70%);
    background-size: 460px 460px;
    filter: blur(.5px);
    animation: emberrise 96s linear infinite, emberflick 9.7s ease-in-out infinite;
    animation-delay: -40s, -5s;
  }
  @keyframes emberrise {
    0%   { transform: translate(0, 0); }
    23%  { transform: translate(9px, -11.5%); }
    47%  { transform: translate(-7px, -23.5%); }
    74%  { transform: translate(12px, -37%); }
    100% { transform: translate(0, -50%); }
  }
  @keyframes emberflick {
    0%, 100% { opacity: .85; }
    31%      { opacity: .55; }
    52%      { opacity: 1; }
    78%      { opacity: .65; }
  }
                          to { transform: translateY(-220px); } }
  @keyframes candleGlow {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 8px rgba(201,162,39,.25)); }
    50% { filter: brightness(1.08) drop-shadow(0 0 14px rgba(232,197,71,.4)); }
  }
  .abrow .val, .budget b { animation: candleGlow 4s ease-in-out infinite; }
  header, main { position: relative; z-index: 1; }

  /* Third pass: the ironmongery — the user's own renders, keyed to true
     transparency and mirrored as files because CSS cannot flip a background.
     See table.html for the full note. */
  .card::after {
    content: ""; position: absolute; inset: -34px; pointer-events: none; z-index: 3;
    background-image:
      url("{% static 'img/clasp-tl.png' %}"),
      url("{% static 'img/clasp-tr.png' %}"),
      url("{% static 'img/clasp-bl.png' %}"),
      url("{% static 'img/clasp-br.png' %}"),
      url("{% static 'img/boss-top.png' %}"),
      url("{% static 'img/boss-bottom.png' %}"),
      url("{% static 'img/boss-left.png' %}"),
      url("{% static 'img/boss-right.png' %}");
    /* Geometry that clasps rather than covers: the pseudo-element reaches
       34px past the card so every centre boss sits astride the border line —
       half proud of the edge, half over the leather. The corners keep their
       old 9px overhang via inward offsets. */
    background-position: left 25px top 25px, right 25px top 25px,
                         left 25px bottom 25px, right 25px bottom 25px,
                         center top 16px, center bottom 16px,
                         left 16px center, right 16px center;
    background-repeat: no-repeat;
    background-size: 96px auto, 96px auto, 96px auto, 96px auto,
                     56px auto, 56px auto, auto 56px, auto 56px;
    filter: drop-shadow(0 4px 5px rgba(0, 0, 0, .5));
  }


  /* The carried candle. A warm pool of light that follows the cursor and
     flickers like a flame in a draught — irregular steps, not a sine wave,
     because real fire does not breathe evenly. Screen-blended so it lights
     what is under it instead of painting over it; transform-only follow, fed
     by one pointermove writing --cx/--cy. Gone on touch screens (no cursor to
     carry it) and under prefers-reduced-motion with everything else. */
  #cursorlight {
    position: fixed; left: 0; top: 0; width: 360px; height: 360px;
    margin: -180px 0 0 -180px; pointer-events: none; z-index: 60;
    transform: translate(var(--cx, -600px), var(--cy, -600px));
    background: radial-gradient(circle,
      rgba(255, 190, 100, .13), rgba(232, 170, 80, .05) 42%, transparent 68%);
    mix-blend-mode: screen;
    animation: carriedflame 2.8s steps(1, end) infinite;
  }
  @keyframes carriedflame {
    0%   { opacity: .85; scale: 1; }
    9%   { opacity: 1;   scale: 1.05; }
    21%  { opacity: .78; scale: .97; }
    33%  { opacity: .95; scale: 1.02; }
    46%  { opacity: .82; scale: .99; }
    58%  { opacity: 1;   scale: 1.06; }
    71%  { opacity: .75; scale: .96; }
    84%  { opacity: .92; scale: 1.03; }
    100% { opacity: .85; scale: 1; }
  }
  @media (hover: none) { #cursorlight { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="embers" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="cursorlight" aria-hidden="true"></div>

<header>
  <h1>Pathfinder GM<small>a world by World Bible, played here</small></h1>
  <nav id="tabs"></nav>
</header>

<main><div class="wrap" id="pane"></div></main>

<script>
const STATE = {{ state_json|safe }};
let TAB = "worlds";
let WORLD = null;        // the world card opened, if any
let DETAIL = null;       // its campaigns and characters
let BENCH = null;        // the homebrew bench opened, if any
let PICKED = null;       // pregen chosen when starting a new game
let CAT = null;          // the effect catalogue, fetched once
let KINDS = null;        // what each kind of content holds, from rules/registry.py
let DRAFT = {};          // the entry being edited, keyed by declared field name

// The fields this bench declares. One place to ask, so nothing has to remember whether
// `KINDS` has loaded yet.
function fieldsFor() {
  const k = BENCH && KINDS ? KINDS[BENCH.bench.id] : null;
  return k ? k.fields : [];
}

// A blank entry with every declared field present and empty. Present, not absent: a list
// field left off the payload cannot be told from one the user cleared, and the server
// would keep the old value — the trap CLAUDE.md names as "empty is not the same as absent".
function emptyDraft() {
  const out = { id: "" };
  fieldsFor().forEach(f => {
    out[f.name] = f.type === "effects" || f.type === "list" ? [] : "";
  });
  return out;
}
let EDITING = "";        // what was opened, so a save replaces rather than duplicates
let LINES = [];          // rendered preview of each effect, from the server
let OPEN_SPELL = "";     // the spell whose full text is expanded

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


// The carried candle follows the pointer. Written as CSS variables on the light itself
// rather than left/top, so the browser only ever composites a transform.
{
  const light = document.getElementById("cursorlight");
  if (light) document.addEventListener("pointermove", e => {
    light.style.setProperty("--cx", `${e.clientX}px`);
    light.style.setProperty("--cy", `${e.clientY}px`);
  }, { passive: true });
}

const TABS = [
  { id: "worlds", name: "Available worlds", count: () => STATE.worlds.length },
  { id: "homebrew", name: "Homebrew", count: () => STATE.authored },
  { id: "characters", name: "Recent characters", count: () => STATE.recent.length },
];

function tabs() {
  $("#tabs").innerHTML = TABS.map(t =>
    `<button class="tab ${t.id === TAB ? "on" : ""}" data-tab="${t.id}">
       ${esc(t.name)}<b>${t.count()}</b></button>`).join("");
}

function continueBlock() {
  const c = STATE.continue;
  if (!c) return "";
  return `<div class="continue">
    <div class="who">
      <b>${esc(c.character)}</b>
      <span>${esc(c.world)}${c.location ? ` · ${esc(c.location)}` : ""}${
        c.biome ? ` · ${esc(c.biome)}` : ""} — ${esc(c.hp)} hp,
        ${c.turns} turn${c.turns === 1 ? "" : "s"} played</span>
    </div>
    ${c.ended ? `<span class="pill dead">this game has ended</span>`
              : `<a class="go" href="/play/">Continue</a>`}
    <a class="go" style="color:var(--gold);border-color:var(--gold-dim);
       background:linear-gradient(#2a2114,#1a140c)" href="/craft/">Crafting bench</a>
  </div>`;
}

function paneWorlds() {
  if (WORLD) return paneOneWorld();
  return continueBlock() + `
    <h2 class="sect">Worlds on the shelf</h2>
    <p class="note">World Bible writes these; this app plays in them. Drop an export into
      your worlds folder and it appears here.</p>
    <div class="cards">${STATE.worlds.map(w => `
      <button class="card pick ${w.playable ? "" : "bad"}" data-world="${esc(w.id)}">
        <h3>${esc(w.name)}</h3>
        <em>${esc(w.premise || "no premise recorded")}</em>
        ${w.playable ? `<div class="stat">
            <b>${w.entities}</b> entities · <b>${w.events}</b> events</div>
          <div style="margin-top:8px">${w.settlements.slice(0, 4).map(s =>
            `<span class="pill">${esc(s)}</span>`).join("")}</div>`
          : `<div class="bad-note">${esc(w.problem)}</div>`}
        ${w.shipped ? `<div class="stat" style="margin-top:8px">ships with the app</div>` : ""}
      </button>`).join("")}
    </div>`;
}

function paneOneWorld() {
  const w = WORLD, d = DETAIL || { campaigns: [], characters: [], pregens: [] };
  return `<button class="quiet" data-back="1">← all worlds</button>
    <h2 class="sect">${esc(w.name)}</h2>
    <p class="note">${esc(w.premise || "")} — ${w.entities} entities, ${w.events} events.
      ${w.peoples.length ? "Peoples: " + w.peoples.map(esc).join(", ") + "." : ""}</p>

    <h2 class="sect">Games</h2>
    ${d.campaigns.length ? `<div class="cards">${d.campaigns.map(c => `
      <div class="card">
        <h3>${esc(c.character)}</h3>
        <em>${esc(c.kind)}${c.ended ? " · ended" : ""}</em>
        <div class="stat"><b>${c.turns}</b> turns · <b>${c.lines}</b> lines ·
          ${esc(c.hp)} hp</div>
        <div style="margin-top:9px">
          ${c.active ? `<span class="pill now">in play</span>` : ""}
          ${c.status === "dead" ? `<span class="pill dead">dead</span>` : ""}
          ${c.character_id && c.status !== "dead"
            ? `<button class="quiet" data-resume="${esc(c.character_id)}">${
                c.active ? "Go to the table" : "Resume"}</button>` : ""}
        </div>
      </div>`).join("")}</div>`
      : `<p class="note">Nothing has been played here yet.</p>`}

    <h2 class="sect">Start something new</h2>
    <p class="note">Sandbox play: no plot, no ending — the world goes on and the GM
      answers what you do. Authored campaigns are not built yet.</p>
    <div class="cards">${(d.pregens || []).map(p => `
      <button class="card pick ${PICKED === p.source ? "on" : ""}"
              data-pregen="${esc(p.source)}">
        <h3>${esc(p.name)}</h3>
        <em>${esc(p.line)} · ${p.hp} hp</em>
        ${p.notes ? `<div class="stat">${esc(p.notes)}</div>` : ""}
      </button>`).join("")}</div>
    <p class="note" style="margin-top:14px">Full 1st-edition character creation is the
      next piece; until it lands these are who there is to play.</p>
    <button class="go" data-start="${esc(w.id)}" ${PICKED ? "" : "disabled"}
            style="${PICKED ? "" : "opacity:.4;cursor:not-allowed"}">
      Begin a sandbox${PICKED ? "" : " — pick somebody first"}</button>
    <div id="err"></div>`;
}


// --- the effect builder ------------------------------------------------------------------
//
// Every form here is generated from the catalogue in rules/effectspec.py. Nothing about a
// field is written in this file, so adding an effect type is one entry in that module and
// the form for it appears — the editor and the engine cannot drift, because they read the
// same definition.

function typeOf(id) {
  for (const c of CAT.categories) for (const t of c.types) if (t.id === id) return [c, t];
  return [null, null];
}

function optionsFor(f) {
  return (CAT.vocab[f.vocab] || []).map(o =>
    `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join("");
}

function fieldHtml(f, spec, path) {
  const v = spec[f.id];
  const at = `data-fx="${path}" data-field="${esc(f.id)}"`;
  const lbl = `<label>${esc(f.label)}${f.required ? "" : " <em>(optional)</em>"}</label>`;

  if (f.kind === "choice") {
    return `${lbl}<select ${at}><option value="">—</option>${
      (CAT.vocab[f.vocab] || []).map(o =>
        `<option value="${esc(o.id)}" ${String(v) === o.id ? "selected" : ""}>${
          esc(o.name)}</option>`).join("")}</select>`;
  }
  if (f.kind === "duration") {
    const d = v || {};
    return `${lbl}<div class="row2">
      <input type="text" ${at} data-part="amount" value="${esc(d.amount ?? "")}"
             placeholder="1d4, 8">
      <select ${at} data-part="unit">
        <option value="">—</option>${(CAT.vocab.duration_unit || []).map(o =>
          `<option value="${esc(o.id)}" ${d.unit === o.id ? "selected" : ""}>${
            esc(o.name)}</option>`).join("")}</select></div>`;
  }
  if (f.kind === "effects") {
    const list = v || [];
    return `${lbl}
      ${list.map((child, i) => effectHtml(child, `${path}.${f.id}.${i}`, true)).join("")}
      <button class="addfx" data-add="${path}.${f.id}" style="padding:7px;margin-bottom:11px">
        + ${esc(f.label)}</button>`;
  }
  const ph = f.hint ? ` placeholder="${esc(f.hint)}"` : "";
  return `${lbl}<input type="text" ${at} value="${esc(v ?? "")}"${ph}>`;
}

function effectHtml(spec, path, nested) {
  const [cat, type] = typeOf(spec.type);
  const info = LINES.find(l => l.path === path);
  return `<div class="fx-card ${nested ? "nested" : ""}">
    <header>
      <span class="line ${info && info.problems.length ? "bad" : ""}">${
        info ? esc(info.problems.length ? info.problems[0] : info.line) : "…"}</span>
      <button class="drop" data-remove="${path}" title="Remove">×</button>
    </header>
    <div class="row2">
      <div><label>Kind</label>
        <select data-cat="${path}">${CAT.categories.map(c =>
          `<option value="${esc(c.id)}" ${cat && c.id === cat.id ? "selected" : ""}>${
            esc(c.name)}</option>`).join("")}</select></div>
      <div><label>Type</label>
        <select data-type="${path}">${(cat ? cat.types : []).map(t =>
          `<option value="${esc(t.id)}" ${t.id === spec.type ? "selected" : ""}>${
            esc(t.name)}</option>`).join("")}</select></div>
    </div>
    ${type && type.blocked
      ? `<div class="warn">${esc(type.blocked)}</div>` : ""}
    ${type ? type.fields.map(f => fieldHtml(f, spec, path)).join("") : ""}
  </div>`;
}

function at(path) {
  // "0.on_failure.1" -> the nested spec, and its containing array.
  const bits = String(path).split(".");
  let list = DRAFT.effects, spec = null;
  for (let i = 0; i < bits.length; i++) {
    if (/^\d+$/.test(bits[i])) { spec = list[Number(bits[i])]; }
    else { spec[bits[i]] = spec[bits[i]] || []; list = spec[bits[i]]; }
  }
  return { list, spec, index: Number(bits[bits.length - 1]) };
}

function listAt(path) {
  if (path === "") return DRAFT.effects;
  const bits = String(path).split(".");
  let list = DRAFT.effects, spec = null;
  for (const b of bits) {
    if (/^\d+$/.test(b)) spec = list[Number(b)];
    else { spec[b] = spec[b] || []; list = spec[b]; }
  }
  return list;
}

// One input, drawn from what rules/registry.py says the field is. Six types cover every
// kind: text, textarea, number, choice, list and effects.
//
// `data-draft` carries the field name, so the input handler stores by name instead of
// matching three hardcoded element ids. That is what made the form specific to consumables
// in the first place — `if (t.id === "d-name")` cannot know about `cr` or `hit_die`.
function draftField(f) {
  const v = DRAFT[f.name];
  const help = f.help ? `<div class="note" style="margin:-4px 0 8px">${esc(f.help)}</div>` : "";
  const label = `<label>${esc(f.label)}${f.required ? " *" : ""}</label>`;

  if (f.type === "effects") {
    return `${label}${help}
      ${(v || []).map((e, i) => effectHtml(e, String(i), false)).join("")}
      <button class="addfx" data-add="">+ Add an effect</button>`;
  }
  if (f.type === "textarea") {
    return `${label}${help}<textarea data-draft="${esc(f.name)}">${esc(v || "")}</textarea>`;
  }
  if (f.type === "choice") {
    return `${label}${help}<select data-draft="${esc(f.name)}">
      <option value="">—</option>
      ${f.choices.map(c => `<option value="${esc(c)}" ${
        c === v ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;
  }
  if (f.type === "list") {
    // Checkboxes rather than a free-text box, because these lists are closed vocabularies
    // — biomes, climates — and a typo in one is a filter that silently matches nothing.
    return `${label}${help}<div class="checks">${f.choices.map(c => `
      <label class="chk"><input type="checkbox" data-draft="${esc(f.name)}"
        data-item="${esc(c)}" ${(v || []).includes(c) ? "checked" : ""}> ${esc(c)}</label>`
      ).join("")}</div>`;
  }
  const type = f.type === "number" ? "number" : "text";
  return `${label}${help}<input type="${type}" data-draft="${esc(f.name)}"
    value="${esc(v === undefined || v === null ? "" : v)}">`;
}

function paneBuild(b) {
  // The form for this bench, from the server's declaration of it. Previously four inputs
  // written into this template, which is why only the two benches those four suited had a
  // builder at all — a creature has a CR and a size and neither had anywhere to go.
  const kind = (KINDS || {})[b.id];
  const fields = kind ? kind.fields : [];
  return `<div class="build">
    ${EDITING ? `<p class="note" style="margin-top:0">Editing <b style="color:var(--ink)">${
      esc(DRAFT.name)}</b>${DRAFT.source === "shipped"
        ? " — a shipped entry. Saving writes your version alongside it."
        : ""}  <button class="quiet" id="d-new" style="padding:4px 10px">start fresh</button></p>`
      : ""}
    ${fields.map(draftField).join("\n")}

    <div style="margin-top:16px;display:flex;gap:12px;align-items:center">
      <button class="go" id="d-save">Save</button>
      <span id="d-msg" class="ok"></span>
    </div>
  </div>`;
}

async function repreview() {
  // The server validates and renders, so the card line here is the card line there.
  const flat = [];
  const walk = (list, prefix) => list.forEach((e, i) => {
    const path = prefix === "" ? String(i) : `${prefix}.${i}`;
    flat.push({ path, spec: e });
    for (const key of ["on_failure", "on_success"]) {
      if (Array.isArray(e[key])) walk(e[key], `${path}.${key}`);
    }
  });
  walk(DRAFT.effects, "");
  if (!flat.length) { LINES = []; render(); return; }
  try {
    const d = await post("/api/effects/preview", { effects: flat.map(f => f.spec) });
    LINES = d.effects.map((r, i) => ({ ...r, path: flat[i].path }));
  } catch (e) { LINES = []; }
  render();
}

// --- spell search ------------------------------------------------------------------------
//
// Descriptors and tags are separate filters even though both read as labels, because they
// answer different questions: whether fire immunity stops it, and whether it is the sort
// of thing you are looking for.

let SP = { q: "", school: "", descriptor: "", tag: "", class: "", level: "" };
let SPELLS = null;

function dropdown(id, label, counts, chosen) {
  const opts = Object.entries(counts || {})
    .map(([k, n]) => `<option value="${esc(k)}" ${k === chosen ? "selected" : ""}>${
      esc(k)} (${n})</option>`).join("");
  return `<div><label>${esc(label)}</label>
    <select data-sp="${id}"><option value="">any</option>${opts}</select></div>`;
}

function paneSpells() {
  const v = (SPELLS && SPELLS.vocab) || {};
  const levels = Array.from({ length: 10 }, (_, i) => i);
  return `<div class="build">
    <label>Search</label>
    <input type="text" id="sp-q" value="${esc(SP.q)}"
           placeholder="name or description — burning, cure, teleport">
    <div class="row3">
      ${dropdown("school", "School", v.schools, SP.school)}
      ${dropdown("descriptor", "Descriptor", v.descriptors, SP.descriptor)}
      ${dropdown("tag", "Tag", v.tags, SP.tag)}
    </div>
    <div class="row3">
      ${dropdown("class", "On the list of", v.classes, SP.class)}
      <div><label>At level</label>
        <select data-sp="level"><option value="">any</option>${levels.map(l =>
          `<option value="${l}" ${String(l) === SP.level ? "selected" : ""}>${l}</option>`
        ).join("")}</select></div>
      <div><label>&nbsp;</label>
        <button class="quiet" id="sp-clear" style="width:100%">Clear filters</button></div>
    </div>
    ${SP.tag && v.tag_notes && v.tag_notes[SP.tag]
      ? `<p class="warn">${esc(SP.tag)} — ${esc(v.tag_notes[SP.tag])} A tag is ours, not
         Pathfinder's; no rule reads it.</p>` : ""}
    <p class="note" style="margin-bottom:0">${
      SPELLS ? `<b style="color:var(--ink)">${SPELLS.count}</b> shown` : "…"}</p>
  </div>
  ${SPELLS ? `<div class="rows" style="max-height:none">
    <table>${SPELLS.spells.map(sp => `
      <tr class="open" data-spell="${esc(sp.id)}">
        <td>${esc(sp.name)}</td>
        <td>${esc(sp.school)}</td>
        <td style="text-align:left;color:var(--dim)">${esc(sp.line)}</td>
      </tr>
      ${OPEN_SPELL === sp.id ? `<tr><td colspan="3" class="spellbody">
        <p>${esc(sp.description).slice(0, 1400)}</p>
        <div class="terms">
          ${["casting_time","range","area","effect","targets","duration",
             "saving_throw","spell_resistance"].map(k => sp[k]
            ? `<div class="t"><span>${esc(k.replace("_"," "))}</span><b>${esc(sp[k])}</b></div>`
            : "").join("")}
          <div class="t"><span>components</span><b>${esc((sp.components||[]).join(", ") || "—")}</b></div>
          <div class="t"><span>source</span><b>${esc(sp.source)}</b></div>
        </div>
        ${sp.tags.length ? `<div style="margin-top:9px">${sp.tags.map(t =>
          `<span class="pill">${esc(t)}</span>`).join("")}</div>` : ""}
      </td></tr>` : ""}`).join("")}</table></div>` : ""}`;
}

async function loadSpells() {
  const qs = new URLSearchParams();
  for (const [k, val] of Object.entries(SP)) if (val) qs.set(k === "q" ? "q" : k, val);
  SPELLS = await (await fetch(`/api/spells?${qs}`)).json();
  render();
}

function paneHomebrew() {
  if (BENCH) {
    const b = BENCH.bench;
    return `<button class="quiet" data-backbench="1">← all benches</button>
      <h2 class="sect">${esc(b.name)}</h2>
      <p class="note">${esc(b.blurb)}</p>
      ${b.waiting ? `<div class="waiting" style="margin-bottom:14px">${esc(b.waiting)}</div>` : ""}
      <p class="note"><b style="color:var(--ink)">${b.yours || "nothing"}</b> authored by
        you${b.shipped ? `, <b style="color:var(--ink)">${b.shipped}</b> ${esc(b.shipped_label)}`
        : ""}. Yours go in <code>${esc(b.path)}</code>.</p>
      ${b.id === "spells" ? paneSpells() : ""}
      ${b.builder === "effects" ? paneBuild(b) : ""}
      ${BENCH.rows.length ? `<div class="rows"><table>${BENCH.rows.map(r =>
        `<tr class="${r.mine ? "mine" : ""} ${r.id ? "open" : ""}"
             ${r.id ? `data-open="${esc(r.id)}"` : ""}>
           <td>${esc(r.name)}${r.unreviewed ? ` <span class="unread">unreviewed</span>` : ""}</td>
           <td>${r.mine ? "yours" : esc(r.kind)}</td>
           <td>${esc(r.note)}</td></tr>`).join("")}</table></div>
        ${b.builder ? `<p class="note" style="margin-top:10px">Click a row to open it.
          Editing something that ships writes your version alongside it — the shipped file
          is never changed, so a corrected table in a later build is not shadowed by a
          stale copy of yours.</p>` : ""}`
        : `<p class="note">Nothing here yet.</p>`}`;
  }
  return `<h2 class="sect">Workbenches</h2>
    <p class="note">Content you author sits over what ships, never replacing it. The rules
      a homebrew class brings with it are specified in docs/homebrew-rules.md.</p>
    <div class="cards">${STATE.benches.map(b => `
      <button class="card ${b.ready ? "pick" : ""}" data-bench="${esc(b.id)}"
              ${b.ready ? "" : "disabled"} style="${b.ready ? "" : "opacity:.45"}">
        <h3>${esc(b.name)}</h3>
        <em>${esc(b.blurb)}</em>
        ${b.ready
          ? `<span class="pill ${b.yours ? "now" : ""}">${
               b.yours ? `${b.yours} yours` : "nothing authored yet"}</span>
             ${b.shipped ? `<span class="pill">${b.shipped} ${esc(b.shipped_label)}</span>` : ""}`
          : `<span class="pill soon">not built yet</span>`}
        ${b.waiting ? `<div class="waiting">${esc(b.waiting)}</div>` : ""}
      </button>`).join("")}</div>`;
}

function paneCharacters() {
  const forge = `<button class="go" data-forge style="margin-bottom:18px">
    Forge a character</button>`;
  if (!STATE.recent.length) return forge + `<p class="note">Nobody has been played yet.</p>`;
  return continueBlock() + forge + `
    <h2 class="sect">Everyone played</h2>
    <p class="note">The dead stay on the roster — they are the reason the next game went
      the way it did.</p>
    <div class="cards">${STATE.recent.map(c => `
      <div class="card">
        <h3>${esc(c.name)}</h3>
        <em>${esc(c.line)}${c.world ? ` · ${esc(c.world)}` : ""}</em>
        <div class="stat">${esc(c.hp)} hp · <b>${c.turns_played}</b> turns played</div>
        <div style="margin-top:9px">
          ${c.active ? `<span class="pill now">in play</span>` : ""}
          ${c.status === "dead" ? `<span class="pill dead">died${
            c.epitaph ? " — " + esc(c.epitaph) : ""}</span>` : ""}
          ${c.playable ? `<button class="quiet" data-resume="${esc(c.id)}">${
            c.active ? "Go to the table" : "Play as " + esc(c.name)
          }</button>` : ""}
        </div>
      </div>`).join("")}</div>
    <div id="err"></div>`;
}

// --- The forge: guided character creation ------------------------------------------------
// One scrolling page rather than a step wizard: a character sheet being filled in, which
// is what the thing is. The server is the authority on every rule — the counters here are
// a courtesy, and the submit round-trips the whole form and renders every problem at once.
let FORGE = null;   // { opts, form } while the forge is open

function forgeDefaults(opts) {
  return {
    name: "", race: "", bonus_ability: "", heritage: "", pronouns: "",
    class: "", abilities: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
    skills: [], feats: [], spellbook: [],
  };
}

function pointsSpent(f, opts) {
  return Object.values(f.abilities).reduce(
    (n, v) => n + (opts.point_costs[v] ?? 0), 0);
}

function ranksBudget(f, opts) {
  const cls = opts.classes.find(c => c.id === f.class);
  if (!cls) return 0;
  const intMod = Math.floor((f.abilities.int - 10) / 2);
  return Math.max(1, cls.skill_ranks + intMod) + (f.race === "human" ? 1 : 0);
}

function featBudget(f) {
  return 1 + (f.race === "human" ? 1 : 0) + (f.class === "fighter" ? 1 : 0);
}

function spellCap(f, opts) {
  const spec = opts.spells_known[f.class];
  if (spec === undefined) return 0;
  if (spec === "3 + int_mod") return 3 + Math.floor((f.abilities.int - 10) / 2);
  return spec;
}

function paneForge() {
  const { opts, form: f } = FORGE;
  const race = opts.races.find(r => r.id === f.race);
  const cls = opts.classes.find(c => c.id === f.class);
  const spent = pointsSpent(f, opts);
  const rb = ranksBudget(f, opts), fb = featBudget(f), sc = spellCap(f, opts);
  const abfinal = ab => {
    let v = f.abilities[ab];
    if (race) {
      v += race.mods?.[ab] || 0;
      if (race.any && f.bonus_ability === ab) v += race.any;
    }
    return v;
  };
  return `<div class="forge">
    <button class="quiet" data-unforge>← the roster</button>
    <h2 class="sect">Who are they?</h2>
    <div class="two">
      <div><input type="text" data-cr="name" value="${esc(f.name)}"
        placeholder="Their name"></div>
      <div><input type="text" data-cr="heritage" value="${esc(f.heritage)}"
        placeholder="Heritage — Zhilakai, Nahyrin… (optional)"></div>
    </div>

    <h2 class="sect">Race</h2>
    <div class="cards tight">${opts.races.map(r => `
      <button class="card pick ${f.race === r.id ? "on" : ""}" data-crrace="${r.id}">
        <h3>${esc(r.name)}</h3>
        <div class="traits">${r.traits.map(esc).join(" · ")}</div>
      </button>`).join("")}</div>
    ${race && race.any ? `
      <p class="note">A ${esc(race.name.toLowerCase())} puts +2 where they choose:</p>
      <div>${["str","dex","con","int","wis","cha"].map(ab => `
        <button class="quiet" data-crbonus="${ab}" style="${
          f.bonus_ability === ab ? "border-color:var(--accent);color:#f0dcae" : ""
        }">${ab.toUpperCase()}</button>`).join(" ")}</div>` : ""}

    <h2 class="sect">Class</h2>
    <div class="cards">${opts.classes.map(c => `
      <button class="card pick ${f.class === c.id ? "on" : ""}" data-crclass="${c.id}">
        <h3>${esc(c.name)}</h3>
        <em>${esc(c.summary || "")}</em>
        <div class="stat">d${c.hit_die} · ${esc(String(c.bab).replace("_", " "))} BAB ·
          ${c.skill_ranks}+Int skills${c.caster ? " · caster" : ""}</div>
        <div class="traits">${(c.features || []).map(esc).join(" · ")}</div>
      </button>`).join("")}</div>

    <h2 class="sect">Abilities</h2>
    <p class="note">Point buy, ${opts.point_budget} points. The race lands after.</p>
    <div class="budget ${spent > opts.point_budget ? "over" : ""}">
      <span>spent</span><b>${spent} / ${opts.point_budget}</b></div>
    ${["str","dex","con","int","wis","cha"].map(ab => `
      <div class="abrow"><b>${ab.toUpperCase()}</b>
        <button data-abdn="${ab}" ${f.abilities[ab] <= 7 ? "disabled" : ""}>−</button>
        <span class="val">${f.abilities[ab]}</span>
        <button data-abup="${ab}" ${f.abilities[ab] >= 18 ? "disabled" : ""}>+</button>
        <span class="fin">${race ? `becomes ${abfinal(ab)}` : ""}</span>
      </div>`).join("")}

    <h2 class="sect">Skills</h2>
    <div class="budget ${f.skills.length > rb ? "over" : ""}">
      <span>ranks${cls ? ` (${cls.skill_ranks} class${f.race === "human" ? " +1 human" : ""} + Int)` : ""}</span>
      <b>${f.skills.length} / ${rb}</b></div>
    <div class="skillgrid">${opts.skills.map(s => `
      <label class="${cls && cls.class_skills.includes(s) ? "classskill" : ""}">
        <input type="checkbox" data-crskill="${esc(s)}" ${
          f.skills.includes(s) ? "checked" : ""}> ${esc(s)}</label>`).join("")}</div>

    <h2 class="sect">Feats</h2>
    <div class="budget ${f.feats.length > fb ? "over" : ""}">
      <span>one for everyone${f.race === "human" ? ", one for a human" : ""}${
        f.class === "fighter" ? ", one for a fighter" : ""}</span>
      <b>${f.feats.length} / ${fb}</b></div>
    <input type="text" data-cr="featstext" value="${esc(f.feats.join(", "))}"
      placeholder="By name, comma-separated — Power Attack, Toughness…">
    <p class="note">The Feats bench on the homebrew tab lists all 1,474 with prerequisites.</p>

    ${sc ? `<h2 class="sect">Spells known</h2>
      <div class="budget ${f.spellbook.length > sc ? "over" : ""}">
        <span>level 0-1 ${esc(f.class)} spells</span><b>${f.spellbook.length} / ${sc}</b></div>
      <input type="text" data-cr="spellstext" value="${esc(f.spellbook.join(", "))}"
        placeholder="By id, comma-separated — magic-missile, shield…">
      <p class="note">The Spells bench can filter the list to level 1 ${esc(f.class)} spells.</p>` : ""}

    <div id="forgeproblems"></div>
    <div style="display:flex;gap:12px;margin-top:18px">
      <button class="go" data-crsubmit="begin">Create &amp; play</button>
      <button class="quiet" data-crsubmit="">Create for the roster</button>
    </div>
  </div>`;
}

async function forgeSubmit(begin) {
  const f = FORGE.form;
  const payload = { ...f, begin: !!begin };
  delete payload.featstext; delete payload.spellstext;
  const r = await fetch("/api/character/create", {
    method: "POST", headers: { "Content-Type": "application/json",
      "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "" },
    body: JSON.stringify(payload),
  });
  const d = await r.json();
  if (!r.ok) {
    $("#forgeproblems").innerHTML = `<div class="problems">${
      (d.problems || [d.error || "something refused"]).map(p =>
        `<div>${esc(p)}</div>`).join("")}</div>`;
    return;
  }
  if (begin) { window.location.href = "/play/"; return; }
  // The roster block on this page is server-rendered state; a reload is the one honest
  // refresh that cannot drift from it.
  window.location.reload();
}


function render() {
  tabs();
  $("#pane").innerHTML =
    TAB === "worlds" ? paneWorlds()
    : TAB === "homebrew" ? paneHomebrew()
    : FORGE ? paneForge()
    : paneCharacters();
}

document.addEventListener("input", e => {
  if (!FORGE || !e.target.dataset) return;
  const f = FORGE.form, key = e.target.dataset.cr;
  if (key === "name" || key === "heritage") { f[key] = e.target.value; return; }
  // The comma lists parse on input and render on submit, so typing is never fought.
  if (key === "featstext") {
    f.feats = e.target.value.split(",").map(s => s.trim()).filter(Boolean); return;
  }
  if (key === "spellstext") {
    f.spellbook = e.target.value.split(",").map(s => s.trim()).filter(Boolean); return;
  }
});

document.addEventListener("change", e => {
  if (!FORGE || !e.target.dataset || !e.target.dataset.crskill) return;
  const f = FORGE.form, s = e.target.dataset.crskill;
  f.skills = e.target.checked
    ? [...new Set([...f.skills, s])]
    : f.skills.filter(x => x !== s);
  render();
});

document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { TAB = tab.dataset.tab; WORLD = null; BENCH = null; render(); return; }

  if (e.target.closest("[data-forge]")) {
    const opts = await (await fetch("/api/create/options")).json();
    FORGE = { opts, form: forgeDefaults(opts) };
    render(); return;
  }
  if (e.target.closest("[data-unforge]")) { FORGE = null; render(); return; }
  if (FORGE) {
    const f = FORGE.form;
    const race = e.target.closest("[data-crrace]");
    if (race) { f.race = race.dataset.crrace; f.bonus_ability = ""; render(); return; }
    const cls = e.target.closest("[data-crclass]");
    if (cls) { f.class = cls.dataset.crclass; render(); return; }
    const bonus = e.target.closest("[data-crbonus]");
    if (bonus) { f.bonus_ability = bonus.dataset.crbonus; render(); return; }
    const up = e.target.closest("[data-abup]");
    if (up) { f.abilities[up.dataset.abup] += 1; render(); return; }
    const dn = e.target.closest("[data-abdn]");
    if (dn) { f.abilities[dn.dataset.abdn] -= 1; render(); return; }
    const sub = e.target.closest("[data-crsubmit]");
    if (sub) { await forgeSubmit(sub.dataset.crsubmit === "begin"); return; }
  }

  const world = e.target.closest("[data-world]");
  if (world) {
    const card = STATE.worlds.find(w => w.id === world.dataset.world);
    if (!card.playable) { return; }
    WORLD = card; DETAIL = null; PICKED = null; render();
    DETAIL = await (await fetch(`/api/world/${encodeURIComponent(card.id)}`)).json();
    render();
    return;
  }
  if (e.target.closest("[data-back]")) { WORLD = null; render(); return; }

  const pregen = e.target.closest("[data-pregen]");
  if (pregen) { PICKED = pregen.dataset.pregen; render(); return; }

  const start = e.target.closest("[data-start]");
  if (start && !start.disabled) {
    try {
      await post("/api/start", { world: start.dataset.start, source: PICKED });
      location.href = "/play/";
    } catch (err) { $("#err").textContent = err.message; }
    return;
  }

  const resume = e.target.closest("[data-resume]");
  if (resume) {
    try {
      await post("/api/resume", { id: resume.dataset.resume });
      location.href = "/play/";
    } catch (err) { const el = $("#err"); if (el) el.textContent = err.message; }
    return;
  }

  const spellRow = e.target.closest("[data-spell]");
  if (spellRow) {
    OPEN_SPELL = OPEN_SPELL === spellRow.dataset.spell ? "" : spellRow.dataset.spell;
    render();
    return;
  }
  if (e.target.closest("#sp-clear")) {
    SP = { q: "", school: "", descriptor: "", tag: "", class: "", level: "" };
    await loadSpells();
    return;
  }

  const bench = e.target.closest("[data-bench]");
  if (bench && !bench.disabled) {
    BENCH = await (await fetch(`/api/bench/${encodeURIComponent(bench.dataset.bench)}`)).json();
    if (BENCH.bench.builder === "effects") {
      if (!CAT) CAT = await (await fetch("/api/effects/catalogue")).json();
      if (!KINDS) {
        const d = await (await fetch("/api/kinds")).json();
        KINDS = Object.fromEntries(d.kinds.map(k => [k.id, k]));
      }
    }
    DRAFT = emptyDraft();
    EDITING = ""; LINES = [];
    if (BENCH.bench.id === "spells") { OPEN_SPELL = ""; await loadSpells(); return; }
    render();
    return;
  }

  const add = e.target.closest("[data-add]");
  if (add) {
    // A new effect starts as the first type of the first category, so the form is never
    // empty and the player sees what a filled-in effect looks like immediately.
    const first = CAT.categories[0].types[0].id;
    listAt(add.dataset.add).push({ type: first });
    await repreview();
    return;
  }
  const gone = e.target.closest("[data-remove]");
  if (gone) {
    const { list, index } = at(gone.dataset.remove);
    list.splice(index, 1);
    await repreview();
    return;
  }
  const open = e.target.closest("[data-open]");
  if (open && BENCH && BENCH.bench.builder) {
    const d = await (await fetch(
      `/api/bench/${encodeURIComponent(BENCH.bench.id)}/open/${
        encodeURIComponent(open.dataset.open)}`)).json();
    if (d.error) { render(); return; }
    // Everything the entry carries, not four named keys. A creature opened into a draft
    // that kept only name/kind/description/effects would save those four over a stat
    // block and silently drop its hit points on the way through.
    DRAFT = Object.assign({}, d);
    DRAFT.effects = d.effects || [];
    EDITING = d.id;
    await repreview();
    return;
  }
  if (e.target.closest("#d-new")) {
    DRAFT = emptyDraft();
    EDITING = ""; LINES = []; render();
    return;
  }
  if (e.target.closest("#d-save")) {
    try {
      const d = await post(`/api/bench/${encodeURIComponent(BENCH.bench.id)}/save`,
                           Object.assign({}, DRAFT));
      DRAFT = emptyDraft();
      EDITING = "";
      LINES = [];
      BENCH = await (await fetch(
        `/api/bench/${encodeURIComponent(BENCH.bench.id)}`)).json();
      render();
      $("#d-msg").textContent = d.lines && d.lines.length
        ? `Saved: ${d.lines.join(" · ")}` : "Saved.";
    } catch (err) { $("#d-msg").innerHTML =
      `<span style="color:var(--alarm)">${esc(err.message)}</span>`; }
    return;
  }
  if (e.target.closest("[data-backbench]")) { BENCH = null; render(); return; }
});

// The draft is edited in place and re-previewed; the server owns validation and the
// rendered line, so what the builder shows is what a card will show.
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "sp-q") {
    SP.q = t.value;
    clearTimeout(window._spTimer);
    window._spTimer = setTimeout(loadSpells, 300);
    return;
  }
  // Stored by declared field name. The three `t.id ===` lines this replaced could only
  // ever know about the three inputs written into the template.
  if (t.dataset && t.dataset.draft) {
    const name = t.dataset.draft;
    if (t.dataset.item !== undefined) {
      const on = new Set(DRAFT[name] || []);
      t.checked ? on.add(t.dataset.item) : on.delete(t.dataset.item);
      // Held in the declared order rather than click order, so re-opening a saved entry
      // shows the same list it was saved as and the file produces no diff of its own.
      const order = fieldsFor().find(f => f.name === name);
      DRAFT[name] = (order ? order.choices : [...on]).filter(c => on.has(c));
      return;
    }
    DRAFT[name] = t.type === "number" && t.value !== ""
      ? Number(t.value) : t.value;
    return;
  }
  if (!t.dataset || !t.dataset.fx) return;
  const { spec } = at(t.dataset.fx);
  const key = t.dataset.field;
  if (t.dataset.part) {
    spec[key] = spec[key] || {};
    spec[key][t.dataset.part] = t.value;
  } else {
    spec[key] = t.value;
  }
  clearTimeout(window._fxTimer);
  window._fxTimer = setTimeout(repreview, 350);
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.sp) { SP[t.dataset.sp] = t.value; await loadSpells(); return; }
  if (t.dataset && t.dataset.cat !== undefined && t.dataset.cat !== "") {
    // Changing the kind resets the type, because the fields are different — carrying the
    // old values over would leave a form half-filled with values that no longer apply.
    const { spec } = at(t.dataset.cat);
    const cat = CAT.categories.find(c => c.id === t.value);
    Object.keys(spec).forEach(k => delete spec[k]);
    spec.type = cat.types[0].id;
    await repreview();
    return;
  }
  if (t.dataset && t.dataset.type !== undefined && t.dataset.type !== "") {
    const { spec } = at(t.dataset.type);
    Object.keys(spec).forEach(k => delete spec[k]);
    spec.type = t.value;
    await repreview();
    return;
  }
  if (t.dataset && t.dataset.fx) {
    const { spec } = at(t.dataset.fx);
    if (t.dataset.part) {
      spec[t.dataset.field] = spec[t.dataset.field] || {};
      spec[t.dataset.field][t.dataset.part] = t.value;
    } else {
      spec[t.dataset.field] = t.value;
    }
    await repreview();
  }
});

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "",
    },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

render();
</script>
</body>
</html>
