{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crafting — Pathfinder GM</title>
<style>
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 400; font-display: swap;
    src: local("Cinzel"), url("{% static 'fonts/Cinzel-Regular.woff2' %}") format("woff2");
  }
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 600; font-display: swap;
    src: local("Cinzel SemiBold"), url("{% static 'fonts/Cinzel-SemiBold.woff2' %}") format("woff2");
  }
  :root {
    --display: "Cinzel", "Trajan Pro", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --body: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --bg: #0f0d0b; --panel: #17130f; --edge: #3a2f22; --ink: #e6dcc6;
    --dim: #8e816a; --accent: #c9a86a; --alarm: #a8443a;
    --gold: #d9c08a; --gold-dim: #7a6543; --blood: #6e1f1f; --sunk: #0c0a08;
    /* The brew's own colour, used for the cauldron glow and the output card. */
    --brew: #6fcf8f; --brew-dim: #2f5f42;
  }
  * { box-sizing: border-box; }
  body {
    /* A fixed height, not a minimum. With `min-height` the grid row was free to grow to
       the shelf's full 3000px and the whole page scrolled; the panels have to be bounded
       before `overflow-y` on `.inner` can do anything. */
    margin: 0; color: var(--ink); font: 16px/1.6 var(--body);
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    background:
      linear-gradient(rgba(10, 8, 6, .40), rgba(7, 5, 4, .58)),
      url("{% static 'img/grimoire-leather.jpg' %}") center / cover no-repeat fixed #0d0b09;
  }

  /* --- banner and discipline tabs --- */
  header {
    border-bottom: 1px solid var(--gold-dim);
    background:
      linear-gradient(rgba(14, 10, 7, .22), rgba(8, 6, 4, .44)),
      url("{% static 'img/card-leather.jpg' %}") #1d1710;
    background-size: auto, 340px auto;
    padding: 0 26px; display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap;
  }
  h1 {
    font: 400 27px/1 var(--display); letter-spacing: .09em; font-variant: small-caps;
    color: var(--gold); margin: 16px 0; white-space: nowrap;
  }
  .back {
    margin-left: auto; margin-bottom: 15px; color: var(--dim); text-decoration: none;
    font: 14px/1 var(--body); border-bottom: 1px solid transparent;
  }
  .back:hover { color: var(--accent); border-bottom-color: var(--gold-dim); }
  nav { display: flex; gap: 2px; align-self: flex-end; flex-wrap: wrap; }
  .tab {
    background: linear-gradient(#171209, #100d08); color: var(--dim); cursor: pointer;
    border: 1px solid var(--edge); border-bottom: none; padding: 10px 18px 9px;
    border-radius: 3px 3px 0 0; font: 400 15px/1 var(--display);
    letter-spacing: .07em; font-variant: small-caps; position: relative; top: 1px;
  }
  .tab:hover:not(.on) { color: var(--ink); }
  .tab.on {
    color: var(--gold);
    background:
      linear-gradient(rgba(20, 15, 9, .05), rgba(12, 9, 6, .22)),
      url("{% static 'img/card-leather.jpg' %}") #241d15;
    background-size: auto, 340px auto;
    border-color: var(--gold-dim); box-shadow: inset 0 2px 0 rgba(217,192,138,.22);
  }
  .tab small { display: block; font: italic 11px/1 var(--body); letter-spacing: 0;
               font-variant: normal; margin-top: 4px; opacity: .7; }

  /* --- three columns, per the reference layout --- */
  main {
    flex: 1; display: grid; gap: 16px; padding: 18px 22px 0;
    /* The shelf takes the slack, not the chain. The chain column was `1fr` and so ate
       every spare pixel — 1086px of it on a 1922px screen, holding eleven small station
       buttons and a cauldron, while 162 jars queued up four-across in the column beside
       it. The chain is a fixed amount of furniture and is sized to it; the shelf is the
       part that gets better with room. */
    grid-template-columns: minmax(320px, 1fr) minmax(300px, 420px) minmax(300px, 380px);
    /* Stretch, not start: with `start` the three columns ended up 650, 423 and 509 tall
       and the bench read as three unrelated boxes rather than one workspace. */
    align-items: stretch; min-height: 0;
  }
  /* Narrow enough for one column, the bench is taller than the screen, so the page
     scrolls as a whole instead of three panels scrolling inside a fixed frame. */
  @media (max-width: 1180px) {
    body { height: auto; min-height: 100vh; overflow: visible; }
    main { grid-template-columns: 1fr; }
    .panel > .inner { overflow-y: visible; }
  }

  .panel {
    background:
      linear-gradient(rgba(16, 12, 8, .04), rgba(8, 6, 4, .20)),
      url("{% static 'img/card-leather.jpg' %}") #241d15;
    background-size: auto, 400px auto;
    border: 1px solid rgba(201, 162, 39, .25);
    border-radius: 3px; box-shadow: inset 0 0 40px rgba(0,0,0,.45),
    0 8px 32px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 230, 150, .06);
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel > h2 {
    margin: 0; padding: 12px 16px 10px; color: var(--gold);
    font: 400 17px/1 var(--display); letter-spacing: .11em; font-variant: small-caps;
    text-align: center; border-bottom: 1px solid var(--gold-dim);
  }
  .panel > .inner { padding: 14px 16px; overflow-y: auto; }

  /* --- the shelf --- */
  #filter {
    width: 100%; margin-bottom: 10px; padding: 9px 11px; font: 15px var(--body);
    color: var(--ink); background: var(--sunk); border: 1px solid var(--edge);
    border-radius: 2px;
  }
  #filter:focus { outline: none; border-color: var(--gold-dim); }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
           gap: 7px; }
  .jar {
    background: linear-gradient(#231a10, #14100a); border: 1px solid var(--edge);
    border-radius: 3px; padding: 7px 5px 6px; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .jar:hover { border-color: var(--accent); }
  .jar.locked { opacity: .34; cursor: not-allowed; }
  .jar.locked:hover { border-color: var(--edge); }
  .jar.chosen { border-color: var(--brew); box-shadow: 0 0 9px rgba(111,207,143,.28); }
  .jar .glyph { font-size: 21px; line-height: 1; filter: saturate(.75); }
  .jar b { font: 600 10px/1.2 var(--body); color: var(--ink); letter-spacing: .01em;
           word-break: break-word; }
  /* Tier reads as a colour on the jar's foot, so the shelf sorts by eye. */
  .jar .tier { height: 3px; width: 26px; border-radius: 2px; }
  h4.sect {
    margin: 14px 0 8px; color: var(--gold); font: 400 13px/1 var(--display);
    letter-spacing: .12em; font-variant: small-caps; padding-bottom: 5px;
    border-bottom: 1px solid #2b2319;
  }
  h4.sect:first-child { margin-top: 0; }
  /* A made thing reads green, like the brew it came out of, so the shelf says at a
     glance which half is bottomless herbs and which half is stock you can run out of. */
  .jar.made { border-color: var(--brew-dim); background: linear-gradient(#16281d, #101a14); }
  .jar.made b { color: #bfe8cd; }
  .jar .count {
    position: absolute; top: -6px; right: -6px; min-width: 17px; padding: 1px 4px;
    border-radius: 9px; background: #1d3428; border: 1px solid var(--brew-dim);
    color: var(--brew); font: 600 10px/1.5 var(--body);
  }
  .jar { position: relative; }
  .jar .conc { font: italic 9px/1.2 var(--body); color: var(--dim); }
  /* A jar the chain as written cannot take. Dimmed but not as far as `.locked`, because
     this one is still pressable: adding a grind can make it legal, and it has to stay
     visibly different from a herb that is simply beyond your tier. The reason is in the
     jar's title, so hovering says which rule and which step. */
  .jar.refused { opacity: .45; border-color: #4a2b26; }
  .jar.refused:hover { opacity: 1; border-color: var(--alarm); }
  .jar.refused b { color: #c39a92; }
  .jar.refused .glyph { filter: saturate(.15) brightness(.8); }
  .jar .nomark {
    position: absolute; top: -5px; left: -5px; width: 15px; height: 15px;
    border-radius: 8px; background: #2a1512; border: 1px solid #6b322a;
    color: var(--alarm); font: 700 9px/13px var(--body);
  }
  /* Chosen wins over refused: a jar already in the pot must read as in the pot, even
     while the chain is momentarily illegal — that is how you see what to fix. */
  .jar.refused.chosen { opacity: 1; border-color: var(--brew); }
  /* Locked stays the dimmest thing on the shelf. `.refused` is declared after `.locked`
     at equal specificity, so it silently won and 24 beyond-your-tier jars brightened from
     .34 to .45 — a cue quietly weakened by a rule that was not about it. */
  .jar.locked.refused { opacity: .34; }
  .jar.locked.refused:hover { opacity: .34; border-color: #4a2b26; }
  /* Wraps. Without this the concentrate buttons kept extending left off the panel
     instead of starting a second line, so the ones past the edge were unreachable. */
  .onlymine { display: flex; align-items: center; gap: 6px; margin: 6px 0 2px;
              font-size: 12.5px; color: var(--dim); cursor: pointer; }
  .onlymine input { accent-color: #6fcf8f; }
  .stockrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
              margin-bottom: 8px; }
  .mini {
    flex: 1; background: linear-gradient(#22190f, #150f09); border: 1px solid var(--edge);
    border-radius: 2px; padding: 5px 9px; cursor: pointer; color: var(--gold);
    font: 400 12px/1.3 var(--display); letter-spacing: .05em; font-variant: small-caps;
  }
  .mini:hover:not(:disabled) { border-color: var(--brew); color: var(--brew); }
  .mini:disabled { opacity: .35; cursor: not-allowed; }
  .none { color: var(--dim); font-style: italic; font-size: 13px; }
  /* The ground you are standing on, which is what the forage table is built from. */
  .ground {
    background: rgba(111,207,143,.06); border: 1px solid var(--brew-dim);
    border-radius: 3px; padding: 9px 11px; margin-bottom: 11px;
  }
  .ground b { color: var(--brew); font: 400 15px/1.2 var(--display);
              letter-spacing: .06em; font-variant: small-caps; }
  .ground em { display: block; color: var(--dim); font: italic 12px/1.4 var(--body);
               margin: 2px 0 8px; }
  .ground select {
    width: 100%; margin-bottom: 7px; padding: 6px 8px; font: 13px var(--body);
    color: var(--ink); background: var(--sunk); border: 1px solid var(--edge);
    border-radius: 2px;
  }
  /* The forage slider. Live-updating label, and a warning that appears when the hours
     start costing the character something. */
  .ground .hours { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; }
  .ground .hours label { color: var(--dim); font-size: 12px; }
  .ground .hours input[type=range] { flex: 1; accent-color: var(--gold); }
  .ground .hours b { min-width: 22px; text-align: right; color: var(--gold);
                     font-variant-numeric: tabular-nums; }
  #hourwarn:empty { display: none; }
  #hourwarn { margin-bottom: 6px; }
  .ground .row2 { display: flex; gap: 6px; flex-wrap: wrap; }
  .ground .row2 > button { flex: 1 1 auto; }
  /* The reason the Forage button is dead, in the alarm colour the bench already uses for
     a chain it will not make, so a refusal reads the same wherever it comes from. */
  .ground .busy { color: var(--alarm); margin-bottom: 6px; }
  /* The debug teleport sits with the real buttons but must never look like one. */
  .ground .row2 > #debugtoggle { flex: 0 0 auto; opacity: .4; font-size: 11px; }
  .ground .row2 > #debugtoggle:hover { opacity: 1; }
  #tablewrap { max-height: 176px; overflow-y: auto; margin-top: 8px; }
  #tablewrap table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #tablewrap td { padding: 2px 4px; border-bottom: 1px solid #241d15; }
  #tablewrap td:first-child { color: var(--dim); white-space: nowrap; width: 1%; }
  #tablewrap td:last-child { text-align: right; color: var(--dim); }
  .jar .held { font: 600 9px/1.2 var(--body); color: var(--brew); }
  .t1 { background: #6b6b6b; } .t2 { background: #4f8a52; } .t3 { background: #3f6fa8; }
  .t4 { background: #8154a8; } .t5 { background: #b8863a; }

  /* --- the chain --- */
  .stations { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 4px; }
  .station {
    background: linear-gradient(#221a10, #15100a); border: 1px solid var(--edge);
    border-radius: 3px; padding: 9px 12px; cursor: pointer; text-align: center;
    font: 400 13px/1.2 var(--display); letter-spacing: .05em; font-variant: small-caps;
    color: var(--ink); min-width: 84px;
  }
  .station:hover:not(.locked) { border-color: var(--accent); }
  .station.locked { opacity: .35; cursor: not-allowed; }
  .station .glyph { display: block; font-size: 19px; margin-bottom: 3px; }
  .station em { display: block; font: italic 10px/1.2 var(--body); color: var(--dim);
                font-variant: normal; letter-spacing: 0; margin-top: 3px; }

  .chain {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 62px;
    padding: 11px; margin: 10px 0 4px; border: 1px dashed var(--gold-dim);
    border-radius: 3px; background: rgba(0,0,0,.28);
  }
  .chain .empty { color: var(--dim); font-style: italic; font-size: 14px; }
  .step {
    background: linear-gradient(#2a2114, #1a140c); border: 1px solid var(--gold-dim);
    border-radius: 3px; padding: 7px 12px; cursor: pointer; color: var(--gold);
    font: 400 13px/1 var(--display); letter-spacing: .06em; font-variant: small-caps;
  }
  .step:hover { border-color: var(--alarm); color: #d9a49c; }
  .arrow { color: var(--gold-dim); }

  /* --- the pot --- */
  /* Centred in whatever height is left rather than sitting at the top of it. The three
     columns are deliberately the same height, so the chain column always has slack; with
     the pot pinned to the top that slack read as a gap at the bottom of the panel instead
     of as space around the cauldron. */
  /* `flex: 1` as well as `display: flex`: `.inner` is sized to its content by default, so
     the slack in this column sat *outside* it and the pot had no room to centre in. The
     empty space belongs to the inner box or the centring does nothing. */
  .panel .inner.chainside { display: flex; flex-direction: column; flex: 1; }
  .pot { text-align: center; padding: 16px 0 10px; flex: 1;
         display: flex; flex-direction: column; justify-content: center; }
  .cauldron { font-size: 54px; line-height: 1; filter: drop-shadow(0 0 14px rgba(111,207,143,.30)); }
  .pot .in {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px;
  }
  .chip {
    background: rgba(111,207,143,.09); border: 1px solid var(--brew-dim);
    border-radius: 2px; padding: 4px 9px; font-size: 13px; cursor: pointer;
    color: #bfe8cd;
  }
  .chip:hover { border-color: var(--alarm); color: #d9a49c; }

  /* --- preview --- */
  .out-title {
    background: linear-gradient(#1d3428, #14231b); border: 1px solid var(--brew-dim);
    border-radius: 3px; padding: 11px 13px; text-align: center; margin-bottom: 12px;
  }
  .out-title b { display: block; color: var(--brew); font: 400 19px/1.25 var(--display);
                 letter-spacing: .04em; font-variant: small-caps; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 14px;
          margin-bottom: 12px; }
  .meta span { color: var(--dim); }
  h3 {
    color: var(--gold); font: 400 14px/1 var(--display); letter-spacing: .1em;
    font-variant: small-caps; margin: 14px 0 7px; padding-bottom: 5px;
    border-bottom: 1px solid #2b2319;
  }
  .fx { margin: 0; padding-left: 18px; }
  .fx li { margin-bottom: 8px; font-size: 14px; line-height: 1.55; }
  .fx li.bad { color: #cf9d95; }
  .fx li.gone { color: #9dc9a8; }
  /* Which ingredient a line came from, quiet enough not to compete with the mechanic. */
  .fx .from { color: var(--dim); font-size: 12px; }
  .fx .from::after { content: " ·"; }
  /* The save reads as the thing that gates the harm rather than as another effect beside
     it. Before this the card listed "Fortitude DC 25" as its own bullet, so a poison's
     save floated free of the Constitution damage it governs. */
  .fx .save {
    color: var(--alarm); font-weight: 600; white-space: nowrap;
    border-bottom: 1px dotted rgba(168,68,58,.55);
  }
  h3.warn { color: #cf9d95; border-bottom-color: #3a2320; }
  .prose { color: var(--dim); font: italic 12.5px/1.55 var(--body); margin: 0 0 9px; }
  .prose b { color: var(--ink); font-style: normal; font-weight: 600; }
  .problems { color: #cf9d95; font-size: 14px; }
  .problems li { margin-bottom: 5px; }
  .inferred { color: var(--dim); font-style: italic; font-size: 12px; }

  /* --- action bar --- */
  footer {
    border-top: 1px solid var(--gold-dim); margin-top: 16px; padding: 14px 22px 18px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(#100d09, #0b0907);
  }
  button.act {
    font: 400 16px/1 var(--display); letter-spacing: .09em; font-variant: small-caps;
    padding: 13px 26px; border-radius: 2px; cursor: pointer; color: var(--gold);
    background: linear-gradient(#2a2114, #1a140c); border: 1px solid var(--gold-dim);
  }
  button.act:hover:not(:disabled) { border-color: var(--accent); color: #f0dcae; }
  /* The batch count, sitting with Craft rather than in the panels: it is part of pressing
     the button, not part of building the chain. */
  .batch { display: flex; align-items: center; gap: 6px; }
  .batch label { color: var(--dim); font: 400 17px/1 var(--display); }
  .batch input {
    width: 68px; padding: 12px 8px; text-align: center; border-radius: 2px;
    font: 400 16px/1 var(--display); font-variant-numeric: tabular-nums;
    color: var(--gold); background: var(--sunk); border: 1px solid var(--gold-dim);
  }
  .batch input:focus { outline: none; border-color: var(--accent); }
  .batch #batchmax { padding: 13px 14px; font-size: 13px; }
  .batch.off { display: none; }
  button.act:disabled { opacity: .4; cursor: not-allowed; }
  button.act.go { border-color: var(--brew-dim); color: var(--brew); }
  button.act.go:hover:not(:disabled) { border-color: var(--brew); color: #b6f0ca; }
  .mastery { margin-left: auto; display: flex; align-items: center; gap: 12px;
             font-size: 14px; color: var(--dim); }
  .mbar { width: 190px; height: 9px; border-radius: 2px; background: #221c14;
          overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.7); }
  .mbar > i { display: block; height: 100%;
              background: linear-gradient(90deg, #8a6f3e, var(--accent)); }
  /* A full bar that does not level looks broken unless the page says what is missing.
     The deed was in the track state all along and was simply never drawn: a character
     could sit at 110 of 100 MP with nothing on screen explaining why they were still
     Herbalist 4. Tinted like a lock rather than an error — it is a goal, not a fault. */
  .mwaits { color: var(--accent); font-style: italic; }
  #err { color: var(--alarm); font-size: 14px; min-height: 1em; }

  .locked-note {
    padding: 40px 26px; text-align: center; color: var(--dim); font-style: italic;
    grid-column: 1 / -1;
  }
  .locked-note b { display: block; color: var(--gold); font-style: normal;
    font: 400 21px/1.3 var(--display); letter-spacing: .06em; font-variant: small-caps;
    margin-bottom: 8px; }
  /* The carried candle becomes literal: the cursor is the candlestick, its
     hotspot on the flame tip, so the pointer's point is the point of light —
     and the glow that follows the pointer blooms exactly from the flame.
     Text fields keep the beam: you cannot place a caret with a candle. */
  body, a, button, select, label, summary,
  .sugg, .pick, .tab, .card.pick, .prepbtn, .opensheet {
    cursor: url("{% static 'img/cursor-candle.png' %}") 24 0, auto;
  }
  input[type=text], textarea, .dieface { cursor: text; }
</style>
</head>
<body>

<header>
  <h1>Crafting</h1>
  <nav id="tabs"></nav>
  <a class="back" href="/play/">← back to the table</a>
  <a class="back" href="/" style="margin-left:0">worlds &amp; characters</a>
</header>

<main id="main"></main>

<footer>
  <button class="act go" id="craft" disabled>Craft</button>
  <!-- How many. A hundred doses is a hundred separate attempts, each with its own d20 —
       the same thing as pressing Craft a hundred times, which is what this replaces. -->
  <span class="batch" id="batchwrap">
    <label for="batch">×</label>
    <input type="number" id="batch" min="1" value="1" step="1">
    <button class="act" id="batchmax" title="As many as your materials allow">all</button>
  </span>
  <button class="act" id="save" disabled>Save recipe</button>
  <span id="err"></span>
  <span class="mastery" id="mastery"></span>
</footer>

<script>
const STATE = {{ state_json|safe }};
let CRAFT = "herbalism";       // the discipline tab in front
let SHELF = [];                // raw ingredients for the current discipline
let STOCK = [];                // things already made, which can go back in the pot
let CHOSEN = [];               // raw ingredient ids in the pot
let USING = {};                // stock id -> how many of it are in the pot
let CHAIN = [];                // methods, in order
let PREVIEW = null;
// ingredient id -> why the chain as it stands would refuse it. Sent by the server from
// the same walk that enforces the rules, rather than worked out here: the preparation
// rules live in exactly one place and this is a picture of them, not a second copy.
let REFUSED = {};
// How many of the current chain the materials allow, from the server. Kept so the "all"
// button and the ceiling on the number field agree with what the bench will actually
// accept, rather than being counted twice in two places that can disagree.
let BATCH_MAX = 0;
let CONC_COST = 2;             // server's rule; refreshed with the shelf
let HERE = "";                 // the biome underfoot
let BIOMES = [];               // everywhere the party could be
// Why foraging is refused right now, in the engine's own words, or "". Asked for with
// the table so the button can be dead and *say so*, rather than looking alive and
// failing when pressed.
let BUSY = "";
// The biome picker is a debug teleport, not a game action — you go somewhere by going
// there. Kept because it is the only way to test a biome without walking to one.
let DEBUG = localStorage.getItem("pfgm.debug") === "1";
// How long the player wants to spend on the ground. Every hour is its own Survival
// check, and past a day awake every hour is also a Will save against dropping.
let FORAGE_HOURS = 1;

function hourWarning(h) {
  if (h > 24) return `Past a day awake — a Will save every hour, harder each time.`;
  if (h >= 12) return `A long shift. Water starts to matter after a day.`;
  return "";
}

let TABLE = null;              // the d100 forage table for HERE
let ATTEMPTS = 1;              // how many things one session turns up
let SHOWTABLE = false;
let SHOWPROSE = false;
const PREVIEW_COST = () => CONC_COST;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// A glyph per kind and per method. Deliberately emoji rather than image files: the app
// ships as one executable and must work offline, so anything fetched is a liability.
const KIND_GLYPH = { "herb": "🌿", "fungus": "🍄", "monster part": "🦴", "poison": "☠️" };
const METHOD_GLYPH = {
  "grind": "⚗️", "mix": "🥣", "brew": "🫖", "preserve": "🧊", "extract": "🔪",
  "distill": "⚱️", "purify": "💧", "infuse": "✨", "neutralize": "🧪",
  "refine": "💎", "catalyst crafting": "🌟",
};

function tabs() {
  $("#tabs").innerHTML = STATE.disciplines.map(d => {
    const t = STATE.tracks[d.id] || {};
    const sub = t.available ? `${esc(t.name)} ${t.level}` : "not yet";
    return `<button class="tab ${d.id === CRAFT ? "on" : ""}" data-craft="${d.id}">
      ${esc(d.name)}<small>${sub}</small></button>`;
  }).join("");
}

async function selectCraft(id) {
  CRAFT = id;
  CHOSEN = []; USING = {}; CHAIN = []; PREVIEW = null;
  $("#err").textContent = "";
  tabs();
  const track = STATE.tracks[CRAFT] || {};
  if (!track.available) { renderLocked(); return; }
  const [r, ft] = await Promise.all([
    fetch(`/api/craft/ingredients?craft=${encodeURIComponent(CRAFT)}`),
    fetch(`/api/forage/table?craft=${encodeURIComponent(CRAFT)}`),
  ]);
  const d = await r.json();
  const f = await ft.json();
  BIOMES = f.biomes || []; ATTEMPTS = f.attempts || 1;
  BUSY = f.busy || "";
  SHELF = d.ingredients;
  STOCK = d.stock || [];
  HERE = d.biome || "";
  TABLE = d.table || null;
  if (STOCK.length) CONC_COST = STOCK[0].concentrates_to.cost;
  STATE.tracks[CRAFT] = d.track;
  renderBench();
  refresh();
}

function renderLocked() {
  const d = STATE.disciplines.find(x => x.id === CRAFT);
  $("#main").innerHTML = `<div class="locked-note">
    <b>${esc(d.name)}</b>${esc(d.blurb)}<br><br>
    No world class has been written for this yet, so there is nothing here to work with.
    Herbalism is the one that is finished.</div>`;
  $("#craft").disabled = true; $("#save").disabled = true;
  $("#mastery").innerHTML = "";
}

function renderBench() {
  $("#main").innerHTML = `
    <section class="panel">
      <h2>Ingredients</h2>
      <div class="inner">
        <div id="ground"></div>
        <input id="filter" type="text" placeholder="Search the shelf…" autocomplete="off">
        <label class="onlymine"><input type="checkbox" id="onlyhave">
          Only what I am carrying</label>
        <div id="stockwrap"></div>
        <h4 class="sect">Raw</h4>
        <div class="shelf" id="shelf"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Crafting Chain</h2>
      <div class="inner chainside">
        <div class="stations" id="stations"></div>
        <div class="chain" id="chainrow"></div>
        <div class="pot" id="pot">
          <div class="cauldron">🍲</div>
          <div class="in" id="potin"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Preview</h2>
      <div class="inner" id="preview"></div>
    </section>`;
  $("#filter").addEventListener("input", renderShelf);
  $("#onlyhave").addEventListener("change", renderShelf);
  renderStations();
  renderShelf();
}

function renderGround() {
  const g = $("#ground");
  if (!g) return;
  const t = TABLE || { rows: [], nothing_chance: 100 };
  const opts = (BIOMES || []).map(b =>
    `<option value="${esc(b.id)}" ${b.id === HERE ? "selected" : ""}>${esc(b.id)}</option>`).join("");
  g.innerHTML = `<div class="ground">
    <b>${esc(HERE || "nowhere in particular")}</b>
    <em>${esc(t.describe || "")}</em>
    ${DEBUG ? `<select id="biomepick">${opts}</select>` : ""}
    <div class="hours">
      <label for="foragehours">Hours</label>
      <input type="range" id="foragehours" min="1" max="48" value="${FORAGE_HOURS}">
      <b id="hourlabel">${FORAGE_HOURS}</b>
    </div>
    <div class="sub" id="hourwarn">${BUSY ? "" : hourWarning(FORAGE_HOURS)}</div>
    ${BUSY ? `<div class="sub busy">${esc(BUSY)}</div>` : ""}
    <div class="row2">
      <button class="mini" id="forage" ${BUSY ? "disabled" : ""}>Forage</button>
      <button class="mini" id="showtable">${SHOWTABLE ? "hide" : "roll table"}</button>
      <button class="mini ghost" id="debugtoggle" title="Move the ground underfoot without walking there. For testing.">${DEBUG ? "hide debug" : "debug"}</button>
    </div>
    ${SHOWTABLE ? `<div id="tablewrap">${
      t.rows.length ? `<table>${t.rows.map(r =>
        `<tr><td>${esc(r.roll)}</td><td>${esc(r.name)}</td><td>${esc(r.tier)}</td></tr>`).join("")}
        <tr><td>${t.nothing_from}-100</td><td><em>nothing</em></td><td>—</td></tr></table>`
      : `<div class="none">Nothing you know of grows here.</div>`}</div>` : ""}
  </div>`;
}

function renderStock() {
  const wrap = $("#stockwrap");
  if (!wrap) return;
  if (!STOCK.length) {
    wrap.innerHTML = `<h4 class="sect">Made</h4>
      <div class="none">Nothing yet. What you craft lands here, and can go back in the pot.</div>`;
    return;
  }
  wrap.innerHTML = `<h4 class="sect">Made</h4>
    <div class="shelf">${STOCK.map(s => {
      const inPot = USING[s.id] || 0;
      // A jar that will poison whoever drinks it reads as one on the shelf. Read off the
      // effects rather than the name: "Purified Draught of Skull Orchid" is not made safe
      // by being called one, and the shelf used to show both as the same green flask.
      const venom = s.poisons || [];
      return `<button class="jar made ${s.usable ? "" : "locked"} ${inPot ? "chosen" : ""}"
        data-stock="${esc(s.id)}" ${s.usable ? "" : "disabled"}
        title="${esc(s.name)} — ${esc(s.tier)}, ×${s.potency} potency. You have ${s.count}.
Click to add one to the pot; right-click to take one out.
${venom.map(v => `Poison — ${esc(v.body)}`).join("\n")}
${s.can_concentrate ? `Concentrating ${s.concentrates_to.cost} makes ${esc(s.concentrates_to.name)} (×${s.concentrates_to.potency}).` : ""}">
        <span class="count">${inPot ? `${inPot}/${s.count}` : s.count}</span>
        <span class="glyph">${venom.length ? "☠️" : "🧪"}</span>
        <b>${esc(s.base)}</b>
        ${s.concentration > 1 ? `<span class="conc">Tier ${s.concentration}</span>` : ""}
        <span class="tier t${s.rank}"></span>
      </button>`;
    }).join("")}</div>
    ${STOCK.some(s => s.can_concentrate && s.usable) ? `<div class="stockrow" style="margin-top:8px">
      ${STOCK.filter(s => s.can_concentrate && s.usable).map(s =>
        `<button class="mini" data-conc="${esc(s.id)}"
          title="Spend ${s.concentrates_to.cost} to make one ${esc(s.concentrates_to.name)}">
          concentrate ${esc(s.base)}${s.concentration > 1 ? ` T${s.concentration}` : ""}
        </button>`).join("")}
    </div>` : ""}`;
}

function renderShelf() {
  renderGround();
  renderStock();
  const q = ($("#filter")?.value || "").trim().toLowerCase();
  // The shelf lists every ingredient in the game, which is the right default when you
  // are learning what exists and the wrong one when you are deciding what to brew
  // tonight. `have` is what is actually in the satchel.
  const mine = !!$("#onlyhave")?.checked;
  const list = SHELF.filter(i => (!mine || (i.held || 0) > 0) && (!q
    || i.name.toLowerCase().includes(q)
    || (i.aka || "").toLowerCase().includes(q)
    || i.kind.includes(q) || i.tier.includes(q)));
  if (mine && !list.length) {
    $("#shelf").innerHTML = `<div class="sub" style="grid-column:1/-1">You are not
      carrying any ingredients. Forage, or untick the box to see the whole shelf.</div>`;
    return;
  }
  $("#shelf").innerHTML = list.map(i => {
    // Marked, not disabled. A jar the chain refuses is still worth picking up — you may
    // be about to add the grind that fixes it — and a button you cannot press gives you
    // no way to find out what it would take.
    const no = REFUSED[i.id] || "";
    return `
    <button class="jar ${i.usable ? "" : "locked"} ${no ? "refused" : ""} ${
              CHOSEN.includes(i.id) ? "chosen" : ""}"
            data-ing="${esc(i.id)}" ${i.usable ? "" : "disabled"}
            title="${esc(i.name)}${i.aka ? ` (${esc(i.aka)})` : ""} — ${esc(i.tier)}${
              i.usable ? "" : ", beyond your tier"}${
              no ? `\n\n${esc(CHAIN.join(" → "))}: ${esc(no)}.` : ""
            }\n\n${esc(i.text).slice(0, 400)}">
      <span class="glyph">${KIND_GLYPH[i.kind] || "🌿"}</span>
      <b>${esc(i.name)}</b>
      ${i.held ? `<span class="held">×${i.held}</span>` : ""}
      ${no ? `<span class="nomark" aria-hidden="true">✕</span>` : ""}
      <span class="tier t${i.rank}"></span>
    </button>`;
  }).join("")
    || `<div class="problems">Nothing on the shelf matches that.</div>`;
}

function renderStations() {
  const t = STATE.tracks[CRAFT];
  $("#stations").innerHTML = (t.all_methods || []).map(m => `
    <button class="station ${m.known ? "" : "locked"}" data-method="${esc(m.method)}"
            ${m.known ? "" : "disabled"}>
      <span class="glyph">${METHOD_GLYPH[m.method] || "⚗️"}</span>
      ${esc(m.method)}
      ${m.known ? "" : `<em>${esc(t.name)} ${m.level}</em>`}
    </button>`).join("");
}

function renderChain() {
  $("#chainrow").innerHTML = CHAIN.length
    ? CHAIN.map((m, i) => `${i ? '<span class="arrow">→</span>' : ""}
        <button class="step" data-step="${i}" title="Remove">${esc(m)}</button>`).join("")
    : `<span class="empty">No method chosen — pick stations above, in the order you work them.</span>`;
  const raw = CHOSEN.map(id => {
    const i = SHELF.find(x => x.id === id) || { name: id };
    return `<button class="chip" data-drop="${esc(id)}" title="Take out">${esc(i.name)}</button>`;
  });
  const mine = Object.entries(USING).map(([id, n]) => {
    const s = STOCK.find(x => x.id === id) || { name: id };
    return `<button class="chip" data-drop="${esc(id)}" title="Take one out">${
      n > 1 ? `${n}× ` : ""}${esc(s.name)}</button>`;
  });
  $("#potin").innerHTML = raw.concat(mine).join("");
}

function renderPreview(p) {
  const el = $("#preview");
  if (!el) return;
  if (!p) { el.innerHTML = `<div class="problems">Put something in the pot.</div>`; return; }

  const inferred = p.ingredients.some(i => i.tier_inferred);
  // A line naming the source, dimmed, then the mechanic: "Leechwort: +2 Heal checks to
  // staunch bleeding" reads as one card entry rather than two.
  const sourced = x => {
    const cut = x.indexOf(": ");
    return cut > 0
      ? `<span class="from">${esc(x.slice(0, cut))}</span> ${esc(x.slice(cut + 2))}`
      : esc(x);
  };
  const poisons = p.poisons || [];
  const removed = p.removed || [];
  // The poisons are drawn from their own structured entries so the save can sit in front
  // of the harm it gates. `drawbacks` holds the same poisons already rendered as flat
  // lines for cards that have nowhere to put the structure, so they are filtered out here
  // rather than printed twice.
  const poisonLines = poisons.map(x => x.line);
  const otherBad = (p.drawbacks || []).filter(x => !poisonLines.includes(x));
  // Purify's own sentences are appended to the effect list so they survive into the jar's
  // card in inventory. On the bench they have a section of their own, so the Effects list
  // shows only what the thing still does.
  const benefits = p.effects.filter(x => !removed.includes(x));
  el.innerHTML = `
    <div class="out-title"><b>${esc(p.name)}</b></div>
    <div class="meta">
      <span>Rarity</span><div>${esc(p.tier)}</div>
      <span>Stages</span><div>${p.stages}</div>
      <span>Potency</span><div>×${p.potency.toFixed(2)}</div>
      <span>Difficulty</span><div>DC ${p.dc}</div>
      <span>Chance</span><div>${p.chance}%</div>
    </div>
    ${Object.keys(p.consumes || {}).length ? `<h3>Spends</h3>
      <ul class="fx">${Object.entries(p.consumes).map(([id, n]) => {
        const s = STOCK.find(x => x.id === id) || { name: id };
        return `<li class="bad">${n}× ${esc(s.name)}</li>`;
      }).join("")}</ul>` : ""}
    ${p.problems.length ? `<h3>Cannot be made</h3>
      <ul class="fx problems">${p.problems.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <h3>Effects</h3>
    ${benefits.length
      ? `<ul class="fx">${benefits.map(x => `<li>${sourced(x)}</li>`).join("")}</ul>`
      : removed.length
        ? `<p class="none">Everything these components did was harm, and the chain took it
            out. What is left is inert.</p>`
        : `<p class="none">No mechanical effect could be read out of these. What they say
            is below.</p>`}
    ${(poisons.length || otherBad.length) ? `<h3 class="warn">Drawbacks</h3>
      <ul class="fx">
        ${poisons.map(x => `<li class="bad">
          ${x.source ? `<span class="from">${esc(x.source)}</span> ` : ""}
          ${x.save_line ? `<span class="save">${esc(x.save_line)}</span> or ` : ""}
          ${esc(x.harm)}</li>`).join("")}
        ${otherBad.map(x => `<li class="bad">${sourced(x)}</li>`).join("")}
      </ul>` : ""}
    ${removed.length ? `<h3>Removed</h3>
      <ul class="fx">${removed.map(x => `<li class="gone">${esc(x)}</li>`).join("")}</ul>`
      : ""}
    ${(p.described && p.described.length) ? `<h3>
        <button class="mini" id="showprose" style="width:auto;padding:2px 8px">
          ${SHOWPROSE ? "hide" : "what the source says"}</button></h3>
      ${SHOWPROSE ? p.described.map(d =>
        `<p class="prose"><b>${esc(d.name)}</b> ${esc(d.text)}</p>`).join("") : ""}` : ""}
    ${inferred ? `<p class="inferred">Rarity is inferred from each ingredient's crafting
      DC — the source document never states one.</p>` : ""}`;
}

function renderMastery() {
  const t = STATE.tracks[CRAFT];
  if (!t || !t.available) { $("#mastery").innerHTML = ""; return; }
  const need = t.to_next ? t.to_next.of : 0;
  const pct = need ? Math.min(100, Math.round(100 * t.mp / need)) : 100;
  // The deed, when the points are no longer what is holding the level back. Without it
  // a paid-up track reads as a bug: the bar is full, the level does not move, and the
  // page gives no reason. `legendary-catalyst` is a slug in the data, so it is spelled
  // out here rather than shown raw.
  const waits = t.to_next && t.to_next.milestone
    ? `<span class="mwaits">${esc(t.name)} ${t.level + 1} also waits on `
      + `${esc(t.to_next.milestone.replace(/-/g, " "))}</span>`
    : "";
  $("#mastery").innerHTML = `
    <span>${esc(t.name)} ${t.level} · ${esc(t.max_tier)}</span>
    <span class="mbar"><i style="width:${pct}%"></i></span>
    <span>${t.to_next ? `${t.mp} / ${need} MP` : "mastered"}</span>
    ${waits}`;
}

async function refresh() {
  renderChain();
  renderMastery();
  // An empty pot used to return here, which meant choosing "brew" first — the order most
  // people work in — greyed nothing at all and the rules read as broken. An empty pot is
  // exactly when the shelf most needs to say which jars the chain will take.
  const empty = !CHOSEN.length && !Object.keys(USING).length;
  let answer = null;
  try {
    answer = await post("/api/craft/preview",
      { craft: CRAFT, ingredients: CHOSEN, methods: CHAIN, stock: USING });
  } catch (e) { $("#err").textContent = e.message; }
  REFUSED = (answer && answer.refused) || {};
  BATCH_MAX = (answer && answer.batch_max) || 0;
  PREVIEW = empty ? null : answer;
  renderShelf();
  renderPreview(PREVIEW);
  buttons();
}

function buttons() {
  const ok = PREVIEW && !PREVIEW.problems.length;
  const box = $("#batch");
  // Clamped to what the materials allow, here rather than only on the server, so the
  // field cannot sit showing 100 while the bench is about to stop at 12.
  const cap = Math.max(1, BATCH_MAX || 1);
  if (box) {
    box.max = cap;
    let n = Math.floor(Number(box.value) || 1);
    if (n < 1) n = 1;
    if (n > cap) n = cap;
    box.value = n;
    box.disabled = !ok;
  }
  const wrap = $("#batchwrap");
  // Hidden when there is nothing to repeat. A "×1 all" beside a dead Craft button is
  // three controls saying nothing.
  if (wrap) wrap.classList.toggle("off", !ok || cap <= 1);
  const max = $("#batchmax");
  if (max) { max.disabled = !ok || cap <= 1; max.textContent = `all ${cap}`; }

  const n = box ? Math.max(1, Math.floor(Number(box.value) || 1)) : 1;
  $("#craft").disabled = !ok;
  $("#craft").textContent = ok
    ? (n > 1 ? `Craft ${n} (${PREVIEW.chance}% each)` : `Craft (${PREVIEW.chance}% success)`)
    : "Craft";
  $("#save").disabled = !CHOSEN.length && !Object.keys(USING).length;
}

// Typing in the count re-labels Craft without going back to the server: the chain has not
// changed, only how many times it is to be worked.
document.addEventListener("input", e => {
  if (e.target.closest("#batch")) buttons();
});
document.addEventListener("click", e => {
  if (!e.target.closest("#batchmax")) return;
  const box = $("#batch");
  if (box) { box.value = Math.max(1, BATCH_MAX || 1); buttons(); }
});

// The slider updates its label and its warning without redrawing the ground panel, which
// would tear the thumb out from under the pointer mid-drag.
document.addEventListener("input", e => {
  const slider = e.target.closest("#foragehours");
  if (!slider) return;
  FORAGE_HOURS = Number(slider.value);
  const label = $("#hourlabel");
  const warn = $("#hourwarn");
  if (label) label.textContent = FORAGE_HOURS;
  if (warn) warn.textContent = hourWarning(FORAGE_HOURS);
});

document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-craft]");
  if (tab) { await selectCraft(tab.dataset.craft); return; }

  const jar = e.target.closest("[data-ing]");
  if (jar && !jar.disabled) {
    const id = jar.dataset.ing;
    CHOSEN = CHOSEN.includes(id) ? CHOSEN.filter(x => x !== id) : [...CHOSEN, id];
    renderShelf(); await refresh(); return;
  }
  if (e.target.closest("#showprose")) {
    SHOWPROSE = !SHOWPROSE; renderPreview(PREVIEW); return;
  }
  if (e.target.closest("#showtable")) {
    SHOWTABLE = !SHOWTABLE; renderGround(); return;
  }
  if (e.target.closest("#debugtoggle")) {
    DEBUG = !DEBUG;
    localStorage.setItem("pfgm.debug", DEBUG ? "1" : "0");
    renderGround(); return;
  }
  if (e.target.closest("#forage")) {
    const btn = e.target.closest("#forage");
    btn.disabled = true;
    try {
      const d = await post("/api/forage", { hours: FORAGE_HOURS });
      $("#err").innerHTML = `<span style="color:var(--brew)">${esc(d.tell)}</span>`;
      await reloadShelf();
    } catch (err) { $("#err").textContent = err.message; }
    btn.disabled = false;
    return;
  }
  const made = e.target.closest("[data-stock]");
  if (made && !made.disabled) {
    const s = STOCK.find(x => x.id === made.dataset.stock);
    USING[s.id] = Math.min(s.count, (USING[s.id] || 0) + 1);
    renderShelf(); await refresh(); return;
  }
  // One click puts a dose in, so the way back out has to be a click too. Concentrating
  // needs two of a thing, and a control that can only ever count up makes overshooting
  // by one a reason to reload the page.
  const conc = e.target.closest("[data-conc]");
  if (conc) {
    const s = STOCK.find(x => x.id === conc.dataset.conc);
    USING = { [s.id]: Math.min(s.count, PREVIEW_COST()) };
    CHOSEN = [];
    if (!CHAIN.includes("distill")) CHAIN.push("distill");
    renderShelf(); await refresh(); return;
  }
  const drop = e.target.closest("[data-drop]");
  if (drop) {
    const id = drop.dataset.drop;
    if (USING[id] !== undefined) {
      USING[id] -= 1;
      if (USING[id] <= 0) delete USING[id];
    } else {
      CHOSEN = CHOSEN.filter(x => x !== id);
    }
    renderShelf(); await refresh(); return;
  }
  const station = e.target.closest("[data-method]");
  if (station && !station.disabled) { CHAIN.push(station.dataset.method); await refresh(); return; }
  const step = e.target.closest("[data-step]");
  if (step) { CHAIN.splice(Number(step.dataset.step), 1); await refresh(); return; }
});

$("#craft").addEventListener("click", async () => {
  $("#err").textContent = "";
  $("#craft").disabled = true;
  try {
    const asked = Math.max(1, Math.floor(Number($("#batch")?.value) || 1));
    const d = await post("/api/craft/do",
      { craft: CRAFT, ingredients: CHOSEN, methods: CHAIN, stock: USING,
        name: PREVIEW?.name, batch: asked });
    STATE.tracks[CRAFT] = d.track;
    // Spent doses are gone; leaving them selected offers the player stock they no
    // longer have and the next preview refuses it.
    USING = {};
    renderStations();
    // Levelling can unlock methods and tiers, so the shelf is re-fetched rather than
    // left showing the ceiling the character had a moment ago.
    await reloadShelf();
    const b = d.batch || { attempted: 1, made: d.succeeded ? 1 : 0, spoiled: d.succeeded ? 0 : 1 };
    if (b.attempted > 1) {
      // The tally, not a hundred roll lines. Every attempt was its own d20; what the
      // player wants to know afterwards is how many jars they ended up with.
      $("#err").innerHTML = `<span style="color:var(--brew)">${b.made} made</span>
        <span style="color:var(--dim)">·</span>
        <span style="color:${b.spoiled ? "var(--alarm)" : "var(--dim)"}">${b.spoiled} spoiled</span>
        <span style="color:var(--dim)"> — ${b.attempted} attempt${b.attempted === 1 ? "" : "s"}
        at ${d.chance}% each.${b.stopped ? " " + esc(b.stopped) : ""}</span>`;
    } else {
      $("#err").innerHTML = `<span style="color:${d.succeeded ? "var(--brew)" : "var(--alarm)"}">
        d20 ${d.roll} against ${d.chance}% — ${d.succeeded ? "made" : "spoiled"}.</span>
        <span style="color:var(--dim)"> ${esc(d.tell)}</span>`;
    }
    // Back to one. A batch of ninety left in the box is a batch of ninety one careless
    // press away from happening again.
    if ($("#batch")) $("#batch").value = 1;
  } catch (e) { $("#err").textContent = e.message; }
  await refresh();
});

$("#save").addEventListener("click", async () => {
  const name = prompt("Name this recipe", PREVIEW?.name || "");
  if (!name) return;
  try {
    const d = await post("/api/craft/recipes",
      { craft: CRAFT, name, ingredients: CHOSEN, methods: CHAIN, stock: USING });
    STATE.recipes = d.recipes;
    $("#err").innerHTML = `<span style="color:var(--brew)">Saved “${esc(name)}”.</span>`;
  } catch (e) { $("#err").textContent = e.message; }
});

document.addEventListener("change", async e => {
  if (!e.target.closest("#biomepick")) return;
  try {
    const d = await post("/api/travel", { biome: e.target.value });
    HERE = d.biome;
    $("#err").innerHTML = `<span style="color:var(--dim)">${esc(d.describe)}</span>`;
    await reloadShelf();
  } catch (err) { $("#err").textContent = err.message; }
});

async function reloadShelf() {
  const [r, ft] = await Promise.all([
    fetch(`/api/craft/ingredients?craft=${encodeURIComponent(CRAFT)}`),
    fetch(`/api/forage/table?craft=${encodeURIComponent(CRAFT)}`),
  ]);
  const d = await r.json();
  const f = await ft.json();
  SHELF = d.ingredients; STOCK = d.stock || []; HERE = d.biome || "";
  TABLE = d.table || null; BIOMES = f.biomes || []; ATTEMPTS = f.attempts || 1;
  BUSY = f.busy || "";
  STATE.tracks[CRAFT] = d.track;
  renderShelf();
  await refresh();
}

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "",
    },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

selectCraft(CRAFT);
</script>
