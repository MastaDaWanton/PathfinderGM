{% load static assets %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crafting — Pathfinder GM</title>
<!-- The shared materials (theme v2), ahead of this page's styles so its palette stands.
     The three panels are built by script, so they read the theme's tokens under their
     own selectors rather than taking its classes. -->
<link rel="stylesheet" href="{% asset 'css/theme-v2.css' %}">
<style>
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 400; font-display: swap;
    src: local("Cinzel"), url("{% static 'fonts/Cinzel-Regular.woff2' %}") format("woff2");
  }
  @font-face {
    font-family: "Cinzel"; font-style: normal; font-weight: 600; font-display: swap;
    src: local("Cinzel SemiBold"), url("{% static 'fonts/Cinzel-SemiBold.woff2' %}") format("woff2");
  }
  :root {
    --display: "Cinzel", "Trajan Pro", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --body: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --bg: #0f0d0b; --panel: #17130f; --edge: #3a2f22; --ink: #e6dcc6;
    --dim: #8e816a; --accent: #c9a86a; --alarm: #a8443a;
    --gold: #d9c08a; --gold-dim: #7a6543; --blood: #6e1f1f; --sunk: #0c0a08;
    /* The brew's own colour, used for the cauldron glow and the output card. */
    --brew: #6fcf8f; --brew-dim: #2f5f42;
  }
  * { box-sizing: border-box; }
  body {
    /* A fixed height, not a minimum. With `min-height` the grid row was free to grow to
       the shelf's full 3000px and the whole page scrolled; the panels have to be bounded
       before `overflow-y` on `.inner` can do anything. */
    margin: 0; color: var(--ink); font: 16px/1.6 var(--body);
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    /* The black grimoire leather under its .40 / .58 dimming: .page-backdrop-leather on
       <body>, the theme's copy of exactly what was here (the owner kept it). */
  }

  /* --- banner and discipline tabs --- */
  header {
    border-bottom: 1px solid var(--gold-dim);
    background:
      linear-gradient(rgba(14, 10, 7, .22), rgba(8, 6, 4, .44)),
      var(--tex-card-leather) #1d1710;
    background-size: auto, 340px auto;
    padding: 0 26px; display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap;
  }
  h1 {
    font: 400 27px/1 var(--display); letter-spacing: .09em; font-variant: small-caps;
    color: var(--gold); margin: 16px 0; white-space: nowrap;
  }
  .back {
    margin-left: auto; margin-bottom: 15px; color: var(--dim); text-decoration: none;
    font: 14px/1 var(--body); border-bottom: 1px solid transparent;
  }
  .back:hover { color: var(--accent); border-bottom-color: var(--gold-dim); }
  nav { display: flex; gap: 2px; align-self: flex-end; flex-wrap: wrap; }
  .tab {
    background: linear-gradient(#171209, #100d08); color: var(--dim); cursor: pointer;
    border: 1px solid var(--edge); border-bottom: none; padding: 10px 18px 9px;
    border-radius: 3px 3px 0 0; font: 400 15px/1 var(--display);
    letter-spacing: .07em; font-variant: small-caps; position: relative; top: 1px;
  }
  .tab:hover:not(.on) { color: var(--ink); }
  .tab.on {
    color: var(--gold);
    background:
      linear-gradient(rgba(20, 15, 9, .05), rgba(12, 9, 6, .22)),
      var(--tex-card-leather) #241d15;
    background-size: auto, 340px auto;
    border-color: var(--gold-dim); box-shadow: inset 0 2px 0 rgba(217,192,138,.22);
  }
  .tab small { display: block; font: italic 11px/1 var(--body); letter-spacing: 0;
               font-variant: normal; margin-top: 4px; opacity: .7; }

  /* --- three columns, per the reference layout --- */
  main {
    flex: 1; display: grid; gap: 34px; padding: 18px 30px 0;
    /* The shelf takes the slack, not the chain. The chain column was `1fr` and so ate
       every spare pixel — 1086px of it on a 1922px screen, holding eleven small station
       buttons and a cauldron, while 162 jars queued up four-across in the column beside
       it. The chain is a fixed amount of furniture and is sized to it; the shelf is the
       part that gets better with room. */
    grid-template-columns: minmax(320px, 1fr) minmax(300px, 420px) minmax(300px, 380px);
    /* Stretch, not start: with `start` the three columns ended up 650, 423 and 509 tall
       and the bench read as three unrelated boxes rather than one workspace. */
    align-items: stretch; min-height: 0;
  }
  /* Narrow enough for one column, the bench is taller than the screen, so the page
     scrolls as a whole instead of three panels scrolling inside a fixed frame. */
  @media (max-width: 1180px) {
    body { height: auto; min-height: 100vh; overflow: visible; }
    /* The panels' clasp box reaches 35px past each panel and main pads 30px, so the
       page was 3px wider than a phone before theme v2 and 4px after (the layout
       viewport measured 378 and 379 at 375). The metal itself stays 24px inside; only
       the transparent box is clipped, and on the x axis only, so the top and bottom
       clasps are untouched. `overflow-x: clip` on the root was tried first and did
       nothing: Chrome still sized the layout viewport from the overflow. Wider than
       this the body clips it already. */
    main { overflow-x: clip; }
    main { grid-template-columns: 1fr; }
    .panel > .inner { overflow-y: visible; }
  }

  .panel {
    /* The 2560px swatch the user upscaled, as one piece — no seams, no stretch. It
       arrives neutral grey and evenly lit; the `color` blend layer gives it the bench's
       own tan, and there is no baked-in lighting to fight, which is what disqualified
       the page hide when it was tried here. Fixed attachment keeps the grain still
       while the shelf scrolls over it.
       Theme v2: the tooled leather that replaced leather-tile.jpg in the table mockup
       (Fabric Leather 02 as grey grain, the seamless half, at the mock's 300px), through
       the same two browns and the same multiply: the theme's `.v2-tooled-leather`.
       At the bench's own light tint (.04 / .16 of black). The text inside is brightened
       instead, as the mockup does in its tooled sides (the owner, 2026-09-30: "brighten
       the craft text"): see `.panel` text colours below. The first pass darkened the
       leather to .50 / .60 to carry this page's --dim, and the bench went nearly black. */
    background:
      linear-gradient(rgba(0, 0, 0, .04), rgba(0, 0, 0, .16)),
      linear-gradient(#57432d, #4b3a27),
      var(--tex-side-leather) #241d15;
    background-blend-mode: normal, multiply, normal;
    background-repeat: no-repeat, no-repeat, repeat;
    background-attachment: scroll, scroll, fixed;
    background-size: auto, auto, 300px auto;
    border: 1px solid rgba(201, 162, 39, .25);
    border-radius: 3px; box-shadow: inset 0 0 40px rgba(0,0,0,.45),
    0 8px 32px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 230, 150, .06);
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel { position: relative; }
  /* The text on the tooled leather, brightened the way the mockup brightens its tooled
     sides, not by darkening the leather. Measured on the new grain at .04 / .16, text
     removed, worst 2%: this page's --dim (#8e816a) held 3.45:1 at 375, and the alarm red
     a save once written on the old chain's preview held 2.4. Inside the
     panels only, so the header, tabs and footer keep the page's own values: --dim is
     the mockup's own tooled-leather dim, #b3a488, still well under --ink. */
  .panel { --dim: #b3a488; }
  /* The world card's own frame, applied whole — the user's reference, "exactly".
     Bevel ring at z2, ironmongery at z3 bolting through it; both on .panel rather
     than .inner, so they hold still while the shelf scrolls inside.
     Theme v2: the shelf's world card moved to the table's framed card, so this follows
     (see home.html `.card::before` for the account): the 6px ring with the brass's grain
     and its lips, lying on the panel's edge over its 1px border rather than 4px outside
     it; the re-surfaced clasps and bosses registered on the ring's centre line. */
  .panel::before {
    content: ""; position: absolute; inset: -1px; pointer-events: none;
    border-radius: inherit; z-index: 2; padding: var(--ring);
    background: var(--brass-grain), var(--gilt);
    background-size: 256px auto, auto; background-blend-mode: soft-light, normal;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    box-shadow: inset 1.5px 1.5px 0 rgba(255, 244, 205, .55),
                inset -1.5px -1.5px 0 rgba(30, 20, 8, .9);
  }
  .panel::after {
    content: ""; position: absolute; inset: -35px; pointer-events: none; z-index: 3;
    background-image: var(--clasp-tl), var(--clasp-tr), var(--clasp-bl), var(--clasp-br),
                      var(--boss-top), var(--boss-bottom), var(--boss-left), var(--boss-right);
    background-position: left var(--clasp-in-x) top var(--clasp-in-y), right var(--clasp-in-x) top var(--clasp-in-y),
                         left var(--clasp-in-x) bottom var(--clasp-in-y), right var(--clasp-in-x) bottom var(--clasp-in-y),
                         center top var(--boss-in), center bottom var(--boss-in),
                         left var(--boss-in) center, right var(--boss-in) center;
    background-repeat: no-repeat;
    background-size: 96px auto, 96px auto, 96px auto, 96px auto,
                     40px auto, 40px auto, auto 40px, auto 40px;
    filter: drop-shadow(2px 4px 3px rgba(0, 0, 0, .6));
  }

  .panel > h2 {
    margin: 0; padding: 12px 16px 10px; color: var(--gold);
    font: 400 17px/1 var(--display); letter-spacing: .11em; font-variant: small-caps;
    text-align: center; border-bottom: 1px solid var(--gold-dim);
  }
  .panel > .inner { padding: 14px 16px; overflow-y: auto; }

  /* --- action bar --- */
  footer {
    border-top: 1px solid var(--gold-dim); margin-top: 16px; padding: 14px 22px 18px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(#100d09, #0b0907);
  }
  #err { color: var(--alarm); font-size: 14px; min-height: 1em; }

  /* Herbalism's tab since the bench moved to the table: one framed card, centred across
     the three columns, and a way there. Its button is the gold of the theme, not the
     retired --brew green (docs/herbalism-ui-plan.md §2). */
  .moved-card { grid-column: 1 / -1; justify-self: center; align-self: start;
                width: min(560px, 100%); margin-top: 40px; }
  .moved-card .inner { padding: 18px 26px 26px; }
  .moved-card p { margin: 0 0 18px; color: var(--ink); }
  a.act { display: inline-block; text-decoration: none;
          font: 400 16px/1 var(--display); letter-spacing: .09em; font-variant: small-caps;
          padding: 13px 26px; border-radius: 2px; color: var(--gold);
          background: linear-gradient(#2a2114, #1a140c); border: 1px solid var(--accent); }
  a.act:hover { color: #f0dcae; border-color: var(--gold); }
  a.act:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
  /* The carried candle becomes literal: the cursor is the candlestick, its
     hotspot on the flame tip, so the pointer's point is the point of light —
     and the glow that follows the pointer blooms exactly from the flame.
     Text fields keep the beam: you cannot place a caret with a candle. */
  body, a, button, select, label, summary,
  .sugg, .pick, .tab, .card.pick, .prepbtn, .opensheet {
    cursor: url("{% static 'img/cursor-candle.png' %}") 24 0, auto;
  }
  input[type=text], textarea, .dieface { cursor: text; }

  /* The carried candle, same as home's. A veil of darkness with a hole in it, plus a
     warm screen-blended pool at the flame; position from the pointer, intensity from
     noise. See home.html for the full account of why each number is what it is. */
  #cursorshade {
    /* Sized from the window: a fixed 6000px square showed its edge on a 3440px window
       (2026-09-30). The same rule as the table's; see its comment. */
    --shade: max(6000px, calc(200vmax + 400px));
    position: fixed; left: 0; top: 0; width: var(--shade); height: var(--shade);
    margin: calc(var(--shade) / -2) 0 0 calc(var(--shade) / -2);
    pointer-events: none; z-index: 55;
    transform: translate(var(--cx, -9000px), calc(var(--cy, -9000px) + 5px))
               scale(calc(.94 + .10 * var(--flick, .8)));
    background: radial-gradient(circle,
      transparent 0 130px, rgba(4, 3, 2, .05) 240px,
      rgba(4, 3, 2, .11) 460px, rgba(4, 3, 2, .13) 4243px);
  }
  #cursorlight {
    position: fixed; left: 0; top: 0; width: 170px; height: 170px;
    margin: -85px 0 0 -85px; pointer-events: none; z-index: 60;
    opacity: calc(.5 + .5 * var(--flick, .8));
    transform: translate(calc(var(--cx, -9000px) + var(--jx, 0px)),
                         calc(var(--cy, -9000px) + 5px + var(--jy, 0px)));
    background: radial-gradient(circle,
      rgba(255, 190, 100, .15), rgba(232, 170, 80, .06) 45%, transparent 70%);
    mix-blend-mode: screen;
  }
  #cursorlight::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle,
      rgba(255, 200, 110, .22), rgba(240, 175, 85, .08) 40%, transparent 65%);
    -webkit-mask-image: repeating-radial-gradient(circle at 32% 30%,
      #000 0 22px, rgba(0,0,0,.25) 34px, #000 52px);
    mask-image: repeating-radial-gradient(circle at 32% 30%,
      #000 0 22px, rgba(0,0,0,.25) 34px, #000 52px);
    animation: dappleswing 8.6s ease-in-out infinite alternate;
  }
  @keyframes dappleswing {
    from { transform: rotate(-16deg) scale(1.04); }
    to   { transform: rotate(19deg) scale(.98); }
  }
  @media (hover: none) { #cursorlight { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="page-backdrop-leather">
<div id="cursorshade" aria-hidden="true"></div>
<div id="cursorlight" aria-hidden="true"></div>

<header>
  <h1>Crafting</h1>
  <nav id="tabs"></nav>
  <a class="back" href="/play/">← back to the table</a>
  <a class="back" href="/" style="margin-left:0">worlds &amp; characters</a>
</header>

<main id="main"></main>

<footer>
  <span id="err"></span>
</footer>

<script>
// The flame, same two channels as home: --cx/--cy from the pointer, --flick from
// summed irrational sines plus a bounded walk. See home.html for the reasoning.
{
  const root = document.documentElement.style;
  document.addEventListener("pointermove", e => {
    root.setProperty("--cx", `${e.clientX}px`);
    root.setProperty("--cy", `${e.clientY}px`);
  }, { passive: true });
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    let walk = 0;
    const tick = now => {
      const t = now / 1000;
      walk = Math.max(-0.5, Math.min(0.5, walk + (Math.random() - 0.5) * 0.04));
      const flick = 0.72 + 0.14 * Math.sin(t * 1.7) + 0.09 * Math.sin(t * 4.3 + 1.3)
        + 0.05 * Math.sin(t * 9.1 + 4.1) + 0.12 * walk;
      root.setProperty("--flick", flick.toFixed(3));
      root.setProperty("--jx", `${(Math.sin(t * 2.9) * 1.2).toFixed(2)}px`);
      root.setProperty("--jy", `${(Math.sin(t * 3.7 + 2) * 0.9).toFixed(2)}px`);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } else {
    root.setProperty("--flick", "0.8");
  }
}

const STATE = {{ state_json|safe }};
let CRAFT = "herbalism";       // the discipline tab in front
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tabs() {
  $("#tabs").innerHTML = STATE.disciplines.map(d => {
    const t = STATE.tracks[d.id] || {};
    const sub = t.available ? `${esc(t.name)} ${t.level}` : "not yet";
    return `<button class="tab ${d.id === CRAFT ? "on" : ""}" data-craft="${d.id}">
      ${esc(d.name)}<small>${sub}</small></button>`;
  }).join("");
}

// The Enchanting tab's second row of modes ("the circle" and "By the book", two crafts on
// one track) is retired (docs/enchanting-ui-plan.md §2 and §15 U7, lane U1, 2026-10-06):
// enchanting is one craft at the circle over the table now, and its tab here is the card
// that opens it. No other craft ever had a mode, so the row and its variable went with it.
async function selectCraft(id) {
  CRAFT = id;
  $("#err").textContent = "";
  tabs();
  // Every craft is worked at its own bench over the table now, and each tab here is one
  // card with a way there. Herbalism moved on 2026-10-02 (docs/herbalism-ui-plan.md
  // §4.1), blacksmithing on 2026-10-04 (docs/blacksmithing-ui-plan.md §15, lane U7),
  // enchanting on 2026-10-06 (docs/enchanting-ui-plan.md §15, lane U1), alchemy on
  // 2026-10-07 (docs/alchemy-ui-plan.md §5.1) and leatherworking on 2026-10-08
  // (docs/leatherworking-ui-plan.md §13). The old chain bench this page drew below the
  // tabs (shelf, chain, cauldron, preview, batch Craft and Save recipe) could no longer be
  // reached from any tab, and its routes (/api/craft/preview, /do, /recipes) were deleted
  // on 2026-11-08 (audit finding #20).
  if (CRAFT === "herbalism") { renderHerbalismMoved(); return; }
  if (CRAFT === "blacksmithing") { renderForgeMoved(); return; }
  if (CRAFT === "enchanting") { renderEnchantMoved(); return; }
  if (CRAFT === "alchemy") { renderAlchemyMoved(); return; }
  if (CRAFT === "leatherworking") { renderLeatherMoved(); return; }
}

// The card that stands where the herbalism bench was. Its one button returns to the
// table with the bench open (`/play/#bench`, which 30-bench-shell.js opens on load).
function renderHerbalismMoved() {
  $("#main").innerHTML = `<section class="panel moved-card" aria-labelledby="moved-title">
      <h2 id="moved-title">Herbalism is at the table now</h2>
      <div class="inner">
        <p>Your satchel, the tools and the herbarium open over the table, where you stand,
          and the time each step takes passes in the scene.</p>
        <a class="act moved-go" href="/play/#bench">Open the herbalism bench</a>
      </div>
    </section>`;
}

// The card that stands where the old forge was (lane U7). Its one button returns to the
// table with the forge open (`/play/#forge`, which 40-forge-shell.js opens on load).
function renderForgeMoved() {
  $("#main").innerHTML = `<section class="panel moved-card" aria-labelledby="moved-title">
      <h2 id="moved-title">The forge is at the table now</h2>
      <div class="inner">
        <p>Your rack, the anvil and the work order open over the table, where you stand.
          A field kit works anywhere; a smithy opens the furnace, the crucible and rare
          metal. The time each step takes passes in the scene.</p>
        <a class="act moved-go" href="/play/#forge">Open the forge</a>
      </div>
    </section>`;
}

// The card that stands where the old enchanting chain was (lane U1). Its one button
// returns to the table with the circle open (`/play/#enchant`, which 45-enchant-shell.js
// opens on load).
function renderEnchantMoved() {
  $("#main").innerHTML = `<section class="panel moved-card" aria-labelledby="moved-title">
      <h2 id="moved-title">The circle is at the table now</h2>
      <div class="inner">
        <p>Your shelf of vessels and essences, the circle and the working open over the
          table, where you stand. Prepare a vessel, attune its essences and bind them, one
          step at a time; a binding waits In progress until its days have passed.</p>
        <a class="act moved-go" href="/play/#enchant">Open the circle</a>
      </div>
    </section>`;
}

// The card that stands where the old leatherworking chain was (leather lane U7). Its one
// button returns to the table with the tanner's bench open (`/play/#leather`, which the
// leather shell opens on load). The chain spent every input on any failure and printed the
// tannin's prose on the finished suit; the bench works one step at a time with the hide's
// clock and grade in view. Written before renderAlchemyMoved so the forge's and alchemy's
// own cards keep the slices their tests read.
function renderLeatherMoved() {
  $("#main").innerHTML = `<section class="panel moved-card" aria-labelledby="moved-title">
      <h2 id="moved-title">Leatherworking is at the table now</h2>
      <div class="inner">
        <p>Your rack of hides and supplies, the beam, the vats and the work order open over
          the table, where you stand. Flense, salt, tan and stitch one step at a time; a field
          kit works anywhere, a tannery opens the vats and rare hides, and a tanning waits In
          progress until its days have passed.</p>
        <a class="act moved-go" href="/play/#leather">Open the leather bench</a>
      </div>
    </section>`;
}

// The card that stands where the old alchemy chain was (alchemy lane U1). Its one button
// returns to the table with the bench open (`/play/#alchemy`, which 50-alchemy-shell.js
// opens on load). The chain read every material as an emoji tile into a cauldron and rolled
// a die per dose; the bench works one method at a time and states the stakes first.
function renderAlchemyMoved() {
  $("#main").innerHTML = `<section class="panel moved-card" aria-labelledby="moved-title">
      <h2 id="moved-title">Alchemy is at the table now</h2>
      <div class="inner">
        <p>Your shelf of reagents, solvents and vessels, the glass and the formula card open
          over the table, where you stand. Dissolve, calcine, distill and bottle one step at a
          time; a field kit works anywhere, a laboratory opens rare work, the still and the
          aludel. The mishap is said before you roll, and the time each step takes passes in
          the scene.</p>
        <a class="act moved-go" href="/play/#alchemy">Open the alchemy bench</a>
      </div>
    </section>`;
}

document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-craft]");
  if (tab) await selectCraft(tab.dataset.craft);
});

selectCraft(CRAFT);
</script>
<!-- The heartbeat that lets the packaged exe tell an open window from a closed
     one. Every page carries it; tests/test_packaging.py fails if one does not. -->
<!-- The soundtrack carries on here from the table (music.js resumes the same song). -->
<script src="{% asset 'js/prefs.js' %}"></script>
<script src="{% asset 'js/music.js' %}"></script>
<script>window.Music && Music.start("ambient");</script>
<script src="{% static 'js/keepalive.js' %}"></script>
</body>
</html>
