<!-- The dice bench: the roller on its own, with nothing else running.

     Kept in the repo rather than thrown away because judging how a die FEELS needs it
     thrown a hundred times in a row, and doing that inside a campaign means a hundred
     real turns and a model call each. It loads the live `play/static/js/dice3d.js`, so
     what you see here is what the game does.

     Serve it — `python -m http.server 8732` at the repo root, or the `dice-bench`
     entry in .claude/launch.json — and open /tools/dicebench/. A file:// URL will not
     do: the module needs a real origin for the audio context.

     See docs/dice-feel.md for what each part of the throw is for. -->
<meta charset="utf-8">
<title>Dice bench</title>
<style>
  body { background:#0d0b09; color:#c9b489; font:14px/1.5 Georgia, serif; margin:0; padding:18px; }
  button { margin:4px; padding:9px 14px; background:#2a2114; color:#d9c08a;
           border:1px solid #7a6543; border-radius:2px; cursor:pointer; font:14px Georgia,serif; }
  #log { margin-top:14px; font:12px/1.6 ui-monospace, Consolas, monospace; color:#8fa398;
         white-space:pre-wrap; }
</style>
<h2>Dice bench</h2>
<div>
  <button data-roll="4" data-res="3">d4</button>
  <button data-roll="6" data-res="4">d6</button>
  <button data-roll="8" data-res="7">d8</button>
  <button data-roll="10" data-res="9">d10</button>
  <button data-roll="12" data-res="11">d12</button>
  <button data-roll="20" data-res="14">d20</button>
  <button data-roll="20" data-res="20">d20 = 20 (crit)</button>
  <button data-roll="20" data-res="1">d20 = 1 (fumble)</button>
  <button data-roll="100" data-res="73">d100 (a pair)</button>
  <button id="all">every shape in turn</button>
  <button id="ten">roll a d20 ten times, timed</button>
  <button id="real">the path the player walks (ask → slow request → land)</button>
  <button id="light">measure the light through a spin</button>
</div>
<div id="log"></div>
<script src="../../play/static/js/dice3d.js"></script>
<script>
const log = (s) => { document.getElementById("log").textContent += s + "\n"; };
document.querySelectorAll("[data-roll]").forEach(b => {
  b.onclick = async () => {
    const sides = Number(b.dataset.roll);
    const res = Number(b.dataset.res);
    const t = performance.now();
    await window.Dice3D.land({
      sides, result: res, title: "Perception", why: "the crowd is loud",
      terms: [{ label: "d" + sides, value: res }, { label: "total", value: res + 5, total: true }],
      verdict: { text: res === 20 ? "A natural twenty" : "Beaten", good: true },
    });
    log(`d${sides} landed ${res} — closed after ${Math.round(performance.now() - t)} ms`);
  };
});
// Every solid, one after another, so a face that comes apart on one shape and not
// another is visible in a single pass.
document.getElementById("all").onclick = async () => {
  for (const [sides, res] of [[4, 3], [6, 4], [8, 7], [10, 9], [12, 11], [20, 14], [100, 73]]) {
    const p = window.Dice3D.land({ sides, result: res, title: "d" + sides, terms: [] });
    setTimeout(() => document.querySelector("#d3d-go")?.click(), 1500);
    await p;
    log(`d${sides} showed ${res}`);
  }
};
/* The sequence the game actually runs, which for a long time nothing here did: the mat
   asks, the answer goes to the server, the server narrates the turn — ten to twenty
   seconds of model — and only then does the die land. Every defect the table reported
   about the dice lived in the joins between those three, not in any one of them. */
document.getElementById("real").onclick = async () => {
  const res = 1 + Math.floor(Math.random() * 20);
  const shown = { sides: 20, title: "Perception", why: "the crowd is loud", terms: [] };
  const t = performance.now();
  const own = await window.Dice3D.ask(Object.assign({ hold: true }, shown));
  const held = performance.now();
  const before = getComputedStyle(document.querySelector("#d3d-die")).transform;
  await new Promise(r => setTimeout(r, 6000));          // stand in for the model call
  const after = getComputedStyle(document.querySelector("#d3d-die")).transform;
  log(`  waited 6s with the mat held; die ${before === after ? "FROZE" : "kept turning"}`);
  await window.Dice3D.land(Object.assign({ result: own ?? res }, shown,
    { terms: [{ label: "d20", value: own ?? res }] }));
  log(`the real path: asked at 0ms, held at ${Math.round(held - t)}ms, ` +
      `closed at ${Math.round(performance.now() - t)}ms`);
};

/* The light, measured rather than admired.

   A face turned toward the camera has the same normal in the room no matter what the
   die has been doing, so under a light that belongs to the ROOM its brightness cannot
   change while the die spins. Under a light baked into the die — which is what shipped
   — it changes constantly, and that is exactly what "the lighting is assigned to a few
   faces and it spins with those faces" looks like from the outside.

   Picking "whichever face is most square-on" out of a spin does NOT measure that: on a
   d20 the front-most face still wanders about twenty degrees off the view axis, so its
   own normal is moving and the reading moves with it (0.508–1.428 that way, which says
   nothing). The die has an exact way to do this instead — `faceToFront` is what the
   landing uses — so drive each of the twenty faces square-on in turn and read what the
   browser computed for it. Same normal, twenty times; anything but a flat line is a
   light that is riding on the die.

   Reading `getComputedStyle().filter` rather than the roller's own numbers, so the
   measurement also holds for the version that had no numbers to ask for. */
document.getElementById("light").onclick = async () => {
  window.Dice3D.land({ sides: 20, result: 14, title: "Light", terms: [] });
  const die = document.querySelector("#d3d-die");
  const faces = [...die.children];
  const bright = (el) => {
    const m = /brightness\(([\d.]+)\)/.exec(getComputedStyle(el).filter || "");
    return m ? Number(m[1]) : NaN;
  };
  const seen = [];
  for (let i = 0; i < faces.length; i++) {
    die.getAnimations().forEach(a => a.cancel());
    die.style.transition = "none";
    die.style.animation = "none";
    // Face i square-on to the camera: the same transform the die lands with.
    die.style.transform = window.Dice3D._faceToFront
      ? window.Dice3D._faceToFront(20, i) : "";
    // Shade it here rather than waiting for the next frame. Not tidiness: animation
    // frames do not fire in a background tab, so a bench that waits for one measures
    // nothing at all unless somebody is watching it — which is the same throttling
    // that had the die freezing mid-roll.
    if (window.Dice3D._lit) window.Dice3D._lit();
    seen.push(bright(faces[i]));
  }
  const lo = Math.min(...seen), hi = Math.max(...seen);
  log(`each of the 20 faces turned square-on to the camera in turn:`);
  log(`  brightness ${lo.toFixed(3)}–${hi.toFixed(3)}, spread ${(hi - lo).toFixed(3)}` +
      `  (a light in the room gives one number; a light on the die gives twenty)`);
  document.querySelector("#d3d-go")?.click();
};

document.getElementById("ten").onclick = async () => {
  for (let i = 0; i < 10; i++) {
    const res = 1 + Math.floor(Math.random() * 20);
    const t = performance.now();
    const p = window.Dice3D.land({ sides: 20, result: res, title: "Again", terms: [] });
    // Close it as soon as the throw has settled, to time the throw itself.
    setTimeout(() => document.querySelector("#d3d-go")?.click(), 1400);
    await p;
    log(`  roll ${i + 1}: ${res} in ${Math.round(performance.now() - t)} ms`);
  }
};
</script>
